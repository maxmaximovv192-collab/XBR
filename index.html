льзуют отдел и порядок, животных — тип и отряд. Видовое название состоит из двух слов. Современная систематика учитывает молекулярные данные и общих предков. Пример: У животных: вид → род → семейство → отряд → класс."}, {"t": "Какой пример соответствует теме «Систематика»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "У животных: вид → род → семейство → отряд → класс.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "У животных: вид → род → семейство → отряд → класс."}]}, {"id": "qe27_52", "s": "bio", "title": "Бактерии и археи", "q": [{"t": "Что характерно для бактериальной клетки?", "o": ["Хлоропласт", "Нуклеоид", "Ядрышко", "Митохондрия"], "a": 1, "ex": "Прокариоты не имеют мембранного ядра. Бактерии размножаются делением, могут обмениваться генами, участвуют в круговоротах и симбиозах."}, {"t": "Что служит переживанию неблагоприятных условий у некоторых бактерий?", "o": ["Жгутик", "Эндоспора", "Рибосома", "Плазмида"], "a": 1, "ex": "Бактериальная стенка обычно содержит муреин. Плазмиды — дополнительные молекулы ДНК. Эндоспоры некоторых бактерий служат для переживания неблагоприятных условий, а не размножения. Археи имеют иные особенности мембран и стенок. Пример: Конъюгация — перенос генетического материала между клетками."}, {"t": "Какой пример соответствует теме «Бактерии и археи»?", "o": ["Конъюгация — перенос генетического материала между клетками.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "Конъюгация — перенос генетического материала между клетками."}]}, {"id": "qe27_53", "s": "bio", "title": "Грибы и лишайники", "q": [{"t": "Что входит в клеточную стенку большинства грибов?", "o": ["Кератин", "Крахмал", "Хитин", "Гликоген"], "a": 2, "ex": "Грибы гетеротрофны, клеточная стенка обычно содержит хитин, запасное вещество — гликоген. Лишайник — симбиотическая система гриба и фотосинтезирующего партнёра."}, {"t": "Запасной углевод грибов?", "o": ["Гликоген", "Крахмал", "Целлюлоза", "Хитин"], "a": 0, "ex": "Грибы питаются путём всасывания после внешнего расщепления веществ. Дрожжи могут быть одноклеточными. Микориза — взаимовыгодная связь гриба с корнем растения. Лишайники способны заселять бедные субстраты. Пример: Гриб получает органику, растение через микоризу — воду и минеральные вещества."}, {"t": "Какой пример соответствует теме «Грибы и лишайники»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Гриб получает органику, растение через микоризу — воду и минеральные вещества."], "a": 3, "ex": "Гриб получает органику, растение через микоризу — воду и минеральные вещества."}]}, {"id": "qe27_54", "s": "bio", "title": "Водоросли, мхи, папоротники", "q": [{"t": "Как называется гаметофит папоротника?", "o": ["Заросток", "Сорус", "Шишка", "Семя"], "a": 0, "ex": "Водоросли не имеют настоящих органов; мхи не имеют настоящих корней; папоротники имеют сосудистые ткани, корни и листья. Для оплодотворения большинства мхов и папоротников нужна вода."}, {"t": "Что преобладает в цикле папоротника?", "o": ["Гаметофит", "Зигота", "Спора", "Спорофит"], "a": 3, "ex": "Водоросли имеют таллом, мхи — ризоиды, папоротники — настоящие корни и проводящие ткани. У папоротников спорангии часто собраны в сорусы. Оплодотворение у этих наземных споровых растений обычно зависит от воды. Пример: Сорус → спорангии → споры → заросток."}, {"t": "Какой пример соответствует теме «Водоросли, мхи, папоротники»?", "o": ["Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Сорус → спорангии → споры → заросток.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "Сорус → спорангии → споры → заросток."}]}, {"id": "qe27_55", "s": "bio", "title": "Голосеменные и покрытосеменные", "q": [{"t": "Какой набор у типичного эндосперма цветковых?", "o": ["3n", "2n", "4n", "n"], "a": 0, "ex": "У голосеменных семязачатки не заключены в завязь; покрытосеменные образуют цветок и плод. При двойном оплодотворении возникают зигота и обычно триплоидный эндосперм."}, {"t": "Из чего обычно развивается плод?", "o": ["Из семязачатка", "Из рыльца", "Из завязи", "Из пыльника"], "a": 2, "ex": "Пыльцевое зерно — мужской гаметофит, зародышевый мешок — женский. Один спермий сливается с яйцеклеткой, другой с центральной клеткой. Семязачаток превращается в семя, завязь обычно — в плод. Пример: n + n → 2n (зародыш); n + 2n → 3n (эндосперм)."}, {"t": "Какой пример соответствует теме «Голосеменные и покрытосеменные»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "n + n → 2n (зародыш); n + 2n → 3n (эндосперм).", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "n + n → 2n (зародыш); n + 2n → 3n (эндосперм)."}]}, {"id": "qe27_56", "s": "bio", "title": "Органы и семейства растений", "q": [{"t": "Какая ткань проводит воду от корней?", "o": ["Флоэма", "Эпидерма", "Камбий", "Ксилема"], "a": 3, "ex": "Корень поглощает воду, побег несёт листья и почки, цветок обеспечивает половое размножение. Однодольные обычно имеют одну семядолю, параллельное жилкование и мочковатую корневую систему."}, {"t": "Какой плод у бобовых?", "o": ["Семянка", "Боб", "Стручок", "Зерновка"], "a": 1, "ex": "Корень имеет зоны деления, растяжения, всасывания и проведения. Устьица регулируют газообмен. У крестоцветных четыре лепестка и плод стручок; у бобовых часто мотыльковый венчик и плод боб; у злаков плод зерновка. Пример: Злаки: одна семядоля, параллельное жилкование, плод зерновка."}, {"t": "Какой пример соответствует теме «Органы и семейства растений»?", "o": ["Злаки: одна семядоля, параллельное жилкование, плод зерновка.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "Злаки: одна семядоля, параллельное жилкование, плод зерновка."}]}, {"id": "qe27_57", "s": "bio", "title": "Простейшие, губки, кишечнополостные", "q": [{"t": "Какие клетки характерны для гидры?", "o": ["Хрящевые", "Эритроциты", "Костные", "Стрекательные"], "a": 3, "ex": "Простейшие — одноклеточные эукариоты. Губки фильтруют воду; кишечнополостные имеют стрекательные клетки и лучевую симметрию."}, {"t": "Какой тип нервной системы у гидры?", "o": ["Диффузная", "Узловая", "Трубчатая", "Стволовая"], "a": 0, "ex": "Амёба движется ложноножками, инфузория — ресничками, эвглена — жгутиком. У губок нет настоящих тканей в школьной классификации. Кишечнополостные имеют кишечную полость и нервную сеть. Пример: Гидра: щупальца со стрекательными клетками, рот, кишечная полость."}, {"t": "Какой пример соответствует теме «Простейшие, губки, кишечнополостные»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Гидра: щупальца со стрекательными клетками, рот, кишечная полость."], "a": 3, "ex": "Гидра: щупальца со стрекательными клетками, рот, кишечная полость."}]}, {"id": "qe27_58", "s": "bio", "title": "Черви и моллюски", "q": [{"t": "Какой червь имеет вторичную полость тела?", "o": ["Планария", "Бычий цепень", "Аскарида", "Дождевой червь"], "a": 3, "ex": "Плоские черви не имеют полости тела; круглые имеют первичную, кольчатые — вторичную. У моллюсков характерны мантия и мускулистая нога."}, {"t": "У кого первичная полость тела?", "o": ["Планария", "Дождевой червь", "Улитка", "Аскарида"], "a": 3, "ex": "У плоских червей кишечник часто слепо замкнут, у ленточных отсутствует. Круглые черви имеют сквозной кишечник. Кольчатые обладают сегментацией и обычно замкнутой кровеносной системой. У большинства моллюсков кровеносная система незамкнутая, у головоногих — замкнутая. Пример: Дождевой червь: кожное дыхание, метанефридии, целом."}, {"t": "Какой пример соответствует теме «Черви и моллюски»?", "o": ["Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Дождевой червь: кожное дыхание, метанефридии, целом.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "Дождевой червь: кожное дыхание, метанефридии, целом."}]}, {"id": "qe27_59", "s": "bio", "title": "Членистоногие", "q": [{"t": "Сколько пар ходильных ног у насекомых?", "o": ["2", "5", "3", "4"], "a": 2, "ex": "Членистые конечности и хитиновый покров — признаки типа. У насекомых три пары ног, у паукообразных четыре, у ракообразных две пары усиков. Рост связан с линькой."}, {"t": "У кого развитие с полным превращением?", "o": ["Таракан", "Стрекоза", "Бабочка", "Кузнечик"], "a": 2, "ex": "У ракообразных обычно жабры, у насекомых трахеи, у пауков книжные лёгкие и/или трахеи. Насекомые с полным превращением имеют стадию куколки. Кровеносная система членистоногих незамкнутая. Пример: Яйцо → личинка → куколка → имаго."}, {"t": "Какой пример соответствует теме «Членистоногие»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Яйцо → личинка → куколка → имаго.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "Яйцо → личинка → куколка → имаго."}]}, {"id": "qe27_60", "s": "bio", "title": "Хордовые и позвоночные", "q": [{"t": "У какой группы четырёхкамерное сердце и перья?", "o": ["Костные рыбы", "Ящерицы", "Птицы", "Земноводные"], "a": 2, "ex": "Хорда, дорсальная нервная трубка и глоточные щели характерны на определённых стадиях. Рыбы обычно дышат жабрами; земноводные имеют кожное и лёгочное дыхание; птицы и млекопитающие теплокровны."}, {"t": "У какого животного четырёхкамерное сердце?", "o": ["Ящерица", "Крокодил", "Лягушка", "Окунь"], "a": 1, "ex": "У рыб сердце двухкамерное, у земноводных и большинства пресмыкающихся трёхкамерное, у крокодилов, птиц и млекопитающих четырёхкамерное. Птицы имеют воздушные мешки, млекопитающие — диафрагму и молочные железы. Пример: Рыбы: сердце → жабры → органы → сердце."}, {"t": "Какой пример соответствует теме «Хордовые и позвоночные»?", "o": ["Рыбы: сердце → жабры → органы → сердце.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "Рыбы: сердце → жабры → органы → сердце."}]}, {"id": "qe27_61", "s": "bio", "title": "Ткани человека", "q": [{"t": "К какой ткани относится кровь?", "o": ["Нервная", "Соединительная", "Эпителиальная", "Мышечная"], "a": 1, "ex": "Эпителий покрывает поверхности, соединительная ткань имеет развитое межклеточное вещество, мышечная сокращается, нервная передаёт сигналы."}, {"t": "К какому типу тканей относится кровь?", "o": ["Соединительная", "Эпителиальная", "Нервная", "Мышечная"], "a": 0, "ex": "Эпителиальные клетки плотно прилегают, соединительные ткани включают кровь, кость, хрящ и жир. Гладкая мышца работает непроизвольно, скелетная поперечнополосатая — обычно произвольно. Нервная ткань содержит нейроны и глию. Пример: Кровь — жидкая соединительная ткань."}, {"t": "Какой пример соответствует теме «Ткани человека»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Кровь — жидкая соединительная ткань."], "a": 3, "ex": "Кровь — жидкая соединительная ткань."}]}, {"id": "qe27_62", "s": "bio", "title": "Опорно-двигательная система", "q": [{"t": "Какая ткань покрывает суставные поверхности костей?", "o": ["Нервная", "Эпителиальная", "Хрящевая", "Гладкая мышечная"], "a": 2, "ex": "Кости выполняют опорную и защитную функции, суставы обеспечивают подвижность, мышцы тянут кости при сокращении. Антагонисты действуют противоположно."}, {"t": "Что соединяет мышцу с костью?", "o": ["Связка", "Хрящ", "Надкостница", "Сухожилие"], "a": 3, "ex": "Компактное и губчатое вещество обеспечивают прочность кости. Органические компоненты придают упругость, минеральные — твёрдость. Суставной хрящ и жидкость снижают трение. Сухожилия соединяют мышцы с костями. Пример: Сгибание: бицепс сокращается, трицепс расслабляется."}, {"t": "Какой пример соответствует теме «Опорно-двигательная система»?", "o": ["Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Сгибание: бицепс сокращается, трицепс расслабляется.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "Сгибание: бицепс сокращается, трицепс расслабляется."}]}, {"id": "qe27_63", "s": "bio", "title": "Кровь и иммунитет", "q": [{"t": "Какие клетки вырабатывают антитела?", "o": ["Миоциты", "Тромбоциты", "Плазматические клетки", "Эритроциты"], "a": 2, "ex": "Эритроциты переносят кислород, тромбоциты участвуют в свёртывании, лейкоциты защищают организм. Антитела вырабатываются плазматическими клетками. Вакцинация формирует активный иммунитет."}, {"t": "Какой иммунитет создаёт введение готовых антител?", "o": ["Врождённый", "Естественный активный", "Искусственный пассивный", "Искусственный активный"], "a": 2, "ex": "Плазма переносит растворённые вещества. Эритроциты человека безъядерные, содержат гемоглобин. Т-лимфоциты участвуют в клеточном иммунитете, B-лимфоциты дают начало плазматическим клеткам. Сыворотка с готовыми антителами создаёт пассивный иммунитет. Пример: Вакцина → собственный иммунный ответ → клетки памяти."}, {"t": "Какой пример соответствует теме «Кровь и иммунитет»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Вакцина → собственный иммунный ответ → клетки памяти.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "Вакцина → собственный иммунный ответ → клетки памяти."}]}, {"id": "qe27_64", "s": "bio", "title": "Кровообращение и лимфа", "q": [{"t": "Какой сосуд несёт артериальную кровь от лёгких?", "o": ["Лёгочная вена", "Полая вена", "Лёгочная артерия", "Аорта"], "a": 0, "ex": "Артерии несут кровь от сердца, вены — к сердцу. Малый круг начинается в правом желудочке и заканчивается в левом предсердии. Лимфа возвращает тканевую жидкость в кровь."}, {"t": "Где начинается большой круг?", "o": ["Правое предсердие", "Левый желудочек", "Правый желудочек", "Левое предсердие"], "a": 1, "ex": "Большой круг: левый желудочек, аорта, органы, полые вены, правое предсердие. Малый круг: правый желудочек, лёгочные артерии, лёгкие, лёгочные вены, левое предсердие. Клапаны препятствуют обратному току. Пример: Лёгочная артерия несёт венозную кровь."}, {"t": "Какой пример соответствует теме «Кровообращение и лимфа»?", "o": ["Лёгочная артерия несёт венозную кровь.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "Лёгочная артерия несёт венозную кровь."}]}, {"id": "qe27_65", "s": "bio", "title": "Дыхание", "q": [{"t": "Что происходит с диафрагмой при вдохе?", "o": ["Не меняется", "Расслабляется и поднимается", "Сокращается и опускается", "Сокращается и поднимается"], "a": 2, "ex": "Вентиляция обеспечивает поступление воздуха, диффузия — газообмен в альвеолах. При спокойном вдохе диафрагма сокращается и опускается."}, {"t": "Что делает диафрагма при спокойном вдохе?", "o": ["Сокращается и опускается", "Расслабляется и опускается", "Сокращается и поднимается", "Не движется"], "a": 0, "ex": "При вдохе объём грудной клетки увеличивается, давление в лёгких падает. Газообмен обусловлен разностью парциальных давлений. Гемоглобин переносит большую часть кислорода; CO₂ преимущественно переносится в виде гидрокарбоната. Пример: Альвеола → O₂ в кровь; кровь → CO₂ в альвеолу."}, {"t": "Какой пример соответствует теме «Дыхание»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Альвеола → O₂ в кровь; кровь → CO₂ в альвеолу."], "a": 3, "ex": "Альвеола → O₂ в кровь; кровь → CO₂ в альвеолу."}]}, {"id": "qe27_66", "s": "bio", "title": "Пищеварение", "q": [{"t": "Где преимущественно всасываются питательные вещества?", "o": ["Тонкая кишка", "Пищевод", "Желудок", "Ротовая полость"], "a": 0, "ex": "Амилаза расщепляет крахмал, пепсин работает в кислой среде желудка, ферменты поджелудочной железы действуют в тонкой кишке. Желчь эмульгирует жиры."}, {"t": "Какой фермент расщепляет белки в желудке?", "o": ["Амилаза", "Липаза слюны", "Мальтаза", "Пепсин"], "a": 3, "ex": "Белки расщепляются до аминокислот, углеводы до моносахаридов, жиры до жирных кислот и продуктов расщепления глицеридов. В тонкой кишке всасывается основная масса питательных веществ. Желчь не содержит пищеварительных ферментов. Пример: Печень → желчь → двенадцатиперстная кишка."}, {"t": "Какой пример соответствует теме «Пищеварение»?", "o": ["Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Печень → желчь → двенадцатиперстная кишка.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "Печень → желчь → двенадцатиперстная кишка."}]}, {"id": "qe27_67", "s": "bio", "title": "Выделение и кожа", "q": [{"t": "Где образуется первичная моча?", "o": ["Почечная лоханка", "Мочеточник", "Мочевой пузырь", "Капсула нефрона"], "a": 3, "ex": "Нефрон фильтрует плазму, затем вещества реабсорбируются и секретируются. Кожа защищает и участвует в терморегуляции посредством потоотделения и изменения просвета сосудов."}, {"t": "Где начинается фильтрация плазмы в нефроне?", "o": ["В мочевом пузыре", "В собирательной трубочке", "В клубочке", "В мочеточнике"], "a": 2, "ex": "Первичная моча образуется фильтрацией в клубочке и капсуле нефрона. Реабсорбция возвращает воду и полезные вещества в кровь. АДГ усиливает реабсорбцию воды в собирательных трубочках. Испарение пота охлаждает тело. Пример: Клубочек → капсула → канальцы → собирательная трубочка."}, {"t": "Какой пример соответствует теме «Выделение и кожа»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Клубочек → капсула → канальцы → собирательная трубочка.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "Клубочек → капсула → канальцы → собирательная трубочка."}]}, {"id": "qe27_68", "s": "bio", "title": "Размножение человека", "q": [{"t": "Где обычно происходит оплодотворение?", "o": ["Матка", "Яичник", "Влагалище", "Маточная труба"], "a": 3, "ex": "Гаметы формируются мейозом. Оплодотворение обычно происходит в маточной трубе, имплантация — в матке. Плацента обеспечивает обмен между организмами матери и плода."}, {"t": "Где обычно происходит оплодотворение?", "o": ["Во влагалище", "В маточной трубе", "В матке", "В яичнике"], "a": 1, "ex": "При сперматогенезе из одной первичной клетки обычно образуются четыре сперматиды; при оогенезе — одна крупная яйцеклетка и полярные тельца. Плацентарный обмен не означает прямое смешивание крови матери и плода. Пример: Овуляция → выход ооцита → возможное оплодотворение в трубе."}, {"t": "Какой пример соответствует теме «Размножение человека»?", "o": ["Овуляция → выход ооцита → возможное оплодотворение в трубе.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "Овуляция → выход ооцита → возможное оплодотворение в трубе."}]}, {"id": "qe27_69", "s": "bio", "title": "Нервная система", "q": [{"t": "Какой нейрон проводит сигнал от рецептора?", "o": ["Двигательный", "Чувствительный", "Мышечный", "Секреторный"], "a": 1, "ex": "ЦНС включает головной и спинной мозг; ПНС — нервы и узлы. Рефлекс реализуется через рецептор, чувствительный нейрон, центральное звено, двигательный нейрон и эффектор."}, {"t": "Какая система обычно ускоряет сердцебиение при стрессе?", "o": ["Симпатическая", "Парасимпатическая", "Соматическая чувствительная", "Зрительная"], "a": 0, "ex": "Соматическая система управляет скелетными мышцами; вегетативная регулирует внутренние органы. Симпатическая система обычно ускоряет сердцебиение, парасимпатическая замедляет. Спинной мозг выполняет рефлекторную и проводниковую функции. Пример: Рецептор → чувствительный нейрон → вставочный → двигательный → мышца."}, {"t": "Какой пример соответствует теме «Нервная система»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Рецептор → чувствительный нейрон → вставочный → двигательный → мышца."], "a": 3, "ex": "Рецептор → чувствительный нейрон → вставочный → двигательный → мышца."}]}, {"id": "qe27_70", "s": "bio", "title": "Эндокринная регуляция", "q": [{"t": "Какой гормон снижает глюкозу крови?", "o": ["Глюкагон", "Адреналин", "Кортизол", "Инсулин"], "a": 3, "ex": "Гормоны действуют на клетки с соответствующими рецепторами. Инсулин снижает концентрацию глюкозы в крови, глюкагон повышает. Обратная связь стабилизирует параметры."}, {"t": "Какой гормон повышает концентрацию глюкозы при голодании?", "o": ["Инсулин", "Мелатонин", "Окситоцин", "Глюкагон"], "a": 3, "ex": "Гипофиз регулирует многие железы, щитовидная железа выделяет тиреоидные гормоны, надпочечники — адреналин и кортикостероиды. Поджелудочная железа смешанной секреции. Гормоны действуют через рецепторы. Пример: Инсулин способствует снижению гликемии; глюкагон — повышению."}, {"t": "Какой пример соответствует теме «Эндокринная регуляция»?", "o": ["Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Инсулин способствует снижению гликемии; глюкагон — повышению.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "Инсулин способствует снижению гликемии; глюкагон — повышению."}]}, {"id": "qe27_71", "s": "bio", "title": "Анализаторы", "q": [{"t": "Где расположены фоторецепторы?", "o": ["Радужка", "Хрусталик", "Роговица", "Сетчатка"], "a": 3, "ex": "Анализатор включает рецепторный, проводниковый и центральный отделы. Палочки сетчатки обеспечивают сумеречное зрение, колбочки — цветовое. Улитка участвует в слухе."}, {"t": "Где находятся фоторецепторы?", "o": ["В радужке", "В хрусталике", "В сетчатке", "В роговице"], "a": 2, "ex": "Роговица и хрусталик преломляют свет, сетчатка воспринимает его. При аккомодации меняется кривизна хрусталика. Слуховые косточки передают колебания, рецепторы улитки преобразуют их в нервные сигналы. Полукружные каналы участвуют в равновесии. Пример: Свет → роговица → зрачок → хрусталик → сетчатка."}, {"t": "Какой пример соответствует теме «Анализаторы»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Свет → роговица → зрачок → хрусталик → сетчатка.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "Свет → роговица → зрачок → хрусталик → сетчатка."}]}, {"id": "qe27_72", "s": "bio", "title": "Высшая нервная деятельность", "q": [{"t": "Какой рефлекс приобретается в течение жизни?", "o": ["Безусловный", "Условный", "Зрачковый", "Коленный"], "a": 1, "ex": "Безусловные рефлексы врождённые, условные приобретаются и требуют подкрепления. Сон связан с закономерным чередованием фаз. Речь и мышление связаны с функциями коры."}, {"t": "Какой рефлекс приобретённый?", "o": ["Зрачковый на свет", "Условный", "Безусловный", "Врождённый защитный"], "a": 1, "ex": "Условный рефлекс формируется при сочетании сигнала с подкреплением; без подкрепления может угасать. Безусловные рефлексы наследственно обусловлены. Сон включает медленные и быстрые фазы; обучение связано с пластичностью нервной системы. Пример: Звук + пища → слюноотделение на звук после обучения."}, {"t": "Какой пример соответствует теме «Высшая нервная деятельность»?", "o": ["Звук + пища → слюноотделение на звук после обучения.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "Звук + пища → слюноотделение на звук после обучения."}]}, {"id": "qe27_73", "s": "bio", "title": "Гигиена и здоровье", "q": [{"t": "Что относится к активному специфическому иммунитету?", "o": ["Кожа", "Готовые антитела из сыворотки", "Слюна", "Иммунитет после вакцинации"], "a": 3, "ex": "Профилактика включает физическую активность, сон, сбалансированное питание, гигиену и вакцинацию. Гомеостаз поддерживает относительное постоянство внутренней среды."}, {"t": "Какой механизм стабилизирует температуру тела?", "o": ["Отрицательная обратная связь", "Положительная обратная связь", "Генетический дрейф", "Мутагенез"], "a": 0, "ex": "Гомеостаз поддерживается нервной и гуморальной регуляцией. Отрицательная обратная связь компенсирует отклонения. Для профилактики инфекций важны гигиена и вакцинация по показаниям; антибиотики не лечат вирусные инфекции. Пример: Перегрев → усиление потоотделения → охлаждение."}, {"t": "Какой пример соответствует теме «Гигиена и здоровье»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Перегрев → усиление потоотделения → охлаждение."], "a": 3, "ex": "Перегрев → усиление потоотделения → охлаждение."}]}, {"id": "qe27_74", "s": "bio", "title": "История эволюционных идей", "q": [{"t": "Кто обосновал естественный отбор?", "o": ["Линней", "Мендель", "Дарвин", "Пастер"], "a": 2, "ex": "Ламарк предложил раннюю целостную эволюционную теорию; Дарвин объяснил адаптации естественным отбором наследственных различий. Современная теория соединяет отбор с генетикой популяций."}, {"t": "Что непосредственно отбирается естественным отбором?", "o": ["Мутации по потребности", "Цели организмов", "Будущие признаки", "Фенотипы особей"], "a": 3, "ex": "Ламарк объяснял изменения упражнением органов и наследованием приобретённых признаков; современная генетика не принимает это как общий механизм. Дарвин опирался на наследственные различия и различный репродуктивный успех. Пример: Устойчивые к антибиотику бактерии оставляют больше потомков при его применении."}, {"t": "Какой пример соответствует теме «История эволюционных идей»?", "o": ["Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Устойчивые к антибиотику бактерии оставляют больше потомков при его применении.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "Устойчивые к антибиотику бактерии оставляют больше потомков при его применении."}]}, {"id": "qe27_75", "s": "bio", "title": "СТЭ и факторы эволюции", "q": [{"t": "Что особенно заметно в малых популяциях?", "o": ["Фотосинтез", "Митоз", "Трансляция", "Дрейф генов"], "a": 3, "ex": "Мутации и рекомбинация создают разнообразие; дрейф генов случайно меняет частоты аллелей; поток генов и изоляция влияют на различия популяций. Отбор действует на фенотипы."}, {"t": "Какова частота гетерозигот при p=0,7 и q=0,3?", "o": ["0,49", "0,09", "0,42", "0,21"], "a": 2, "ex": "Стабилизирующий отбор благоприятствует средним значениям, движущий — одному краю распределения, дизруптивный — крайним. Дрейф особенно заметен в малых популяциях. При равновесии Харди—Вайнберга частота рецессивных гомозигот q². Пример: Если q² = 0,09, то q = 0,3 и p = 0,7."}, {"t": "Какой пример соответствует теме «СТЭ и факторы эволюции»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Если q² = 0,09, то q = 0,3 и p = 0,7.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "Если q² = 0,09, то q = 0,3 и p = 0,7."}]}, {"id": "qe27_76", "s": "bio", "title": "Вид и видообразование", "q": [{"t": "Какое видообразование связано с пространственным барьером?", "o": ["Географическое", "Экологическое без пространственного барьера", "Искусственный отбор", "Конвергенция"], "a": 0, "ex": "Вид определяют совокупностью критериев: морфологического, генетического, экологического и других. Репродуктивная изоляция препятствует обмену генами между популяциями."}, {"t": "Какой барьер предзиготический?", "o": ["Низкая плодовитость гибридов", "Разные сроки размножения", "Стерильность гибридов", "Гибель гибридного зародыша"], "a": 1, "ex": "Географическое видообразование начинается с пространственного разобщения; экологическое возможно без географического барьера. Репродуктивные барьеры могут действовать до или после оплодотворения. Ни один критерий вида не универсален сам по себе. Пример: Разные сроки размножения — предзиготический барьер."}, {"t": "Какой пример соответствует теме «Вид и видообразование»?", "o": ["Разные сроки размножения — предзиготический барьер.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "Разные сроки размножения — предзиготический барьер."}]}, {"id": "qe27_77", "s": "bio", "title": "Макроэволюция и доказательства", "q": [{"t": "Крылья птицы и бабочки как органы полёта являются?", "o": ["Аналогичными", "Атавизмами", "Гомологичными", "Рудиментами"], "a": 0, "ex": "Гомологичные органы имеют общее происхождение, аналогичные — сходную функцию при различном происхождении. Ароморфоз повышает общий уровень организации, идиоадаптация — частная адаптация."}, {"t": "Что демонстрируют крыло птицы и крыло бабочки по функции?", "o": ["Аналогию", "Гомологию как крылья", "Атавизм", "Рудиментарность"], "a": 0, "ex": "Рудименты — органы, утратившие значительную часть исходной функции; атавизмы — появление признаков предков у отдельных особей. Биологический прогресс выражается ростом численности, ареала и разнообразия группы. Общая дегенерация может сопровождать паразитизм. Пример: Крыло птицы и передняя конечность кошки — гомологичные органы."}, {"t": "Какой пример соответствует теме «Макроэволюция и доказательства»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Крыло птицы и передняя конечность кошки — гомологичные органы."], "a": 3, "ex": "Крыло птицы и передняя конечность кошки — гомологичные органы."}]}, {"id": "qe27_78", "s": "bio", "title": "Происхождение жизни", "q": [{"t": "Какой органоид имеет собственную ДНК?", "o": ["Рибосома", "Митохондрия", "Лизосома", "Аппарат Гольджи"], "a": 1, "ex": "Гипотезы абиогенеза описывают образование органических веществ и ранних самовоспроизводящихся систем. Эндосимбиотическая теория объясняет происхождение митохондрий и пластид."}, {"t": "Какой органоид объясняет эндосимбиотическая теория?", "o": ["Лизосома", "Аппарат Гольджи", "Ядрышко", "Митохондрия"], "a": 3, "ex": "Гипотеза химической эволюции предполагает постепенное возникновение органических молекул и систем воспроизведения. Опыт Миллера—Юри показал возможность абиогенного образования ряда органических веществ в модельных условиях. Эндосимбиоз подтверждают собственные ДНК и рибосомы органоидов. Пример: Митохондрии и пластиды имеют двойные мембраны и собственный геном."}, {"t": "Какой пример соответствует теме «Происхождение жизни»?", "o": ["Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Митохондрии и пластиды имеют двойные мембраны и собственный геном.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "Митохондрии и пластиды имеют двойные мембраны и собственный геном."}]}, {"id": "qe27_79", "s": "bio", "title": "Антропогенез", "q": [{"t": "Какой признак связан с прямохождением?", "o": ["Длинные передние конечности", "Хвост", "S-образный позвоночник", "Хватательная стопа с противопоставленным пальцем"], "a": 2, "ex": "Человек и современные человекообразные обезьяны имеют общих предков. Эволюция человека включала прямохождение, развитие мозга, орудийной деятельности и культуры. Все современные люди принадлежат одному виду."}, {"t": "Какой признак связан с прямохождением?", "o": ["Удлинённые передние конечности", "Отсутствие изгибов позвоночника", "Сводчатая стопа", "Хватательная стопа с противопоставленным большим пальцем"], "a": 2, "ex": "Антропогенез имеет ветвящийся характер, а не прямую лестницу. Прямохождение сопровождалось изменениями таза, позвоночника и стопы. Социальные факторы включают труд, речь и передачу культуры. Пример: S-образный позвоночник способствует амортизации при ходьбе."}, {"t": "Какой пример соответствует теме «Антропогенез»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "S-образный позвоночник способствует амортизации при ходьбе.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "S-образный позвоночник способствует амортизации при ходьбе."}]}, {"id": "qe27_80", "s": "bio", "title": "Экологические факторы", "q": [{"t": "Какой фактор абиотический?", "o": ["Температура", "Паразитизм", "Конкуренция", "Хищничество"], "a": 0, "ex": "Абиотические факторы — условия неживой среды, биотические — взаимодействия организмов, антропогенные — деятельность человека. Лимитирующий фактор ограничивает жизнедеятельность."}, {"t": "Как называют организм с узким диапазоном выносливости?", "o": ["Продуцент", "Стенобионт", "Эврибионт", "Редуцент"], "a": 1, "ex": "Закон толерантности: жизнедеятельность ограничена как недостатком, так и избытком фактора. Стенобионты имеют узкий диапазон выносливости, эврибионты — широкий. Взаимодействия включают конкуренцию, хищничество, паразитизм и мутуализм. Пример: Микориза — пример мутуализма."}, {"t": "Какой пример соответствует теме «Экологические факторы»?", "o": ["Микориза — пример мутуализма.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "Микориза — пример мутуализма."}]}, {"id": "qe27_81", "s": "bio", "title": "Экосистемы и пищевые сети", "q": [{"t": "Кто является консументом второго порядка в этой цепи?", "o": ["Лягушка", "Уж", "Трава", "Кузнечик"], "a": 0, "ex": "Продуценты создают органическое вещество, консументы потребляют его, редуценты минерализуют остатки. Энергия уменьшается по трофическим уровням; правило 10% приблизительно."}, {"t": "Сколько энергии примерно достигнет третьего уровня при 1000 кДж на первом?", "o": ["10 кДж", "100 кДж", "1 кДж", "900 кДж"], "a": 0, "ex": "Пищевая сеть объединяет несколько цепей. Пастбищная цепь начинается с продуцента, детритная — с мёртвого органического вещества. Пирамида энергии всегда уменьшается вверх по уровням. Пример: При 1000 кДж у продуцентов следующий уровень получает примерно 100 кДж."}, {"t": "Какой пример соответствует теме «Экосистемы и пищевые сети»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "При 1000 кДж у продуцентов следующий уровень получает примерно 100 кДж."], "a": 3, "ex": "При 1000 кДж у продуцентов следующий уровень получает примерно 100 кДж."}]}, {"id": "qe27_82", "s": "bio", "title": "Сукцессии и агроценозы", "q": [{"t": "Как называется восстановление леса после пожара при сохранении почвы?", "o": ["Вторичная сукцессия", "Дрейф генов", "Первичная сукцессия", "Конвергенция"], "a": 0, "ex": "Сукцессия — последовательное изменение сообщества. Первичная начинается на субстрате без почвы, вторичная — после нарушения с сохранением почвы. Агроценоз зависит от вмешательства человека."}, {"t": "Какой тип сукцессии начинается на свежей лаве?", "o": ["Вторичная", "Сезонная миграция", "Агроценоз", "Первичная"], "a": 3, "ex": "Первичная сукцессия начинается без сформированной почвы, вторичная — при её сохранении. Агроценоз обычно беднее видами и требует внешней поддержки. Устойчивость естественных экосистем связана с разнообразием связей и саморегуляцией. Пример: После пожара при сохранённой почве происходит вторичная сукцессия."}, {"t": "Какой пример соответствует теме «Сукцессии и агроценозы»?", "o": ["Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "После пожара при сохранённой почве происходит вторичная сукцессия.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "После пожара при сохранённой почве происходит вторичная сукцессия."}]}, {"id": "qe27_83", "s": "bio", "title": "Популяционная экология", "q": [{"t": "Какой процесс увеличивает численность популяции?", "o": ["Иммиграция", "Смертность", "Хищничество", "Эмиграция"], "a": 0, "ex": "Численность меняют рождаемость, смертность, иммиграция и эмиграция. При ограниченных ресурсах рост замедляется вблизи ёмкости среды."}, {"t": "Какова итоговая численность в приведённом примере?", "o": ["132", "102", "112", "108"], "a": 2, "ex": "Плотность — численность на единицу площади или объёма. Возрастная и половая структура влияют на воспроизводство. Логистический рост замедляется при приближении к ёмкости среды; конкуренция часто зависит от плотности. Пример: 100 особей + 20 рождений − 10 смертей + 5 иммигрантов − 3 эмигранта = 112."}, {"t": "Какой пример соответствует теме «Популяционная экология»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "100 особей + 20 рождений − 10 смертей + 5 иммигрантов − 3 эмигранта = 112.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "100 особей + 20 рождений − 10 смертей + 5 иммигрантов − 3 эмигранта = 112."}]}, {"id": "qe27_84", "s": "bio", "title": "Биосфера и круговороты", "q": [{"t": "Какой процесс связывает атмосферный N₂?", "o": ["Транспирация", "Азотфиксация", "Денитрификация", "Гликолиз"], "a": 1, "ex": "Биосфера включает области Земли, населённые организмами. Углерод фиксируется при фотосинтезе, возвращается при дыхании и разложении. Азотфиксация переводит атмосферный азот в доступные соединения."}, {"t": "Какой процесс возвращает азот в атмосферу?", "o": ["Транспирация", "Денитрификация", "Нитрификация", "Фотосинтез"], "a": 1, "ex": "Азотфиксирующие бактерии переводят N₂ в соединения азота; нитрификация окисляет аммоний до нитритов и нитратов; денитрификация возвращает азот в атмосферу. Фосфорный цикл не имеет значительной газовой фазы. Пример: NH₄⁺ → NO₂⁻ → NO₃⁻ — нитрификация."}, {"t": "Какой пример соответствует теме «Биосфера и круговороты»?", "o": ["NH₄⁺ → NO₂⁻ → NO₃⁻ — нитрификация.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "NH₄⁺ → NO₂⁻ → NO₃⁻ — нитрификация."}]}, {"id": "qe27_85", "s": "bio", "title": "Охрана природы", "q": [{"t": "Что способствует эвтрофикации?", "o": ["Очистка сточных вод", "Удаление избытка фосфатов", "Сток удобрений", "Снижение сбросов"], "a": 2, "ex": "Сохранение местообитаний, снижение загрязнения, рациональное использование ресурсов и защита биоразнообразия поддерживают экосистемы. Эвтрофикация связана с избытком биогенных элементов."}, {"t": "Почему после массового цветения воды может гибнуть рыба?", "o": ["Из-за дефицита кислорода при разложении органики", "Из-за прекращения круговорота воды", "Из-за роста солёности во всех случаях", "Из-за исчезновения атмосферного азота"], "a": 0, "ex": "Биоразнообразие включает генетическое, видовое и экосистемное разнообразие. Заповедники сохраняют природные комплексы, Красная книга фиксирует редкие и угрожаемые виды. При эвтрофикации разложение избытка органики расходует кислород. Пример: Избыток удобрений → рост водорослей → разложение → гипоксия."}, {"t": "Какой пример соответствует теме «Охрана природы»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Избыток удобрений → рост водорослей → разложение → гипоксия."], "a": 3, "ex": "Избыток удобрений → рост водорослей → разложение → гипоксия."}]}, {"id": "mix_chem_0", "s": "chem", "title": "Повторение • блок 1", "q": [{"t": "Сколько электронов у Na⁺?", "o": ["12", "10", "11", "23"], "a": 1, "ex": "Протоны определяют заряд ядра; нейтроны различают изотопы; электроны заполняют орбитали по принципу Паули и правилу Хунда."}, {"t": "Какой атом крупнее?", "o": ["F", "K", "Li", "Na"], "a": 1, "ex": "В периоде обычно растёт электроотрицательность и уменьшается радиус; вниз по группе радиус растёт. У элементов групп 13–18 число внешних электронов обычно равно номеру группы минус 10."}, {"t": "Сколько π-связей в ацетилене?", "o": ["1", "3", "0", "2"], "a": 3, "ex": "Ковалентная связь возникает при обобществлении электронов; ионная — при притяжении ионов. Одинарная связь содержит σ, двойная — σ и π, тройная — σ и две π."}, {"t": "Какая решётка у алмаза?", "o": ["Металлическая", "Атомная", "Молекулярная", "Ионная"], "a": 1, "ex": "Ионные кристаллы проводят ток в расплаве; молекулярные обычно легкоплавки; атомные имеют прочные ковалентные связи; металлические проводят ток в твёрдом состоянии."}, {"t": "Как называется реакция A + B → AB?", "o": ["Разложение", "Соединение", "Замещение", "Обмен"], "a": 1, "ex": "Реакции различают по составу реагентов и продуктов, тепловому эффекту, обратимости и изменению степеней окисления."}, {"t": "Что увеличивает скорость растворения мрамора в кислоте?", "o": ["Измельчение мрамора", "Охлаждение", "Уменьшение поверхности", "Разбавление кислоты"], "a": 0, "ex": "Скорость зависит от температуры, концентрации, площади контакта фаз и катализатора. Катализатор снижает энергию активации прямой и обратной реакции."}, {"t": "Повышение давления смещает данное равновесие куда?", "o": ["Останавливает реакцию", "Не влияет", "К N₂", "К NH₃"], "a": 3, "ex": "По принципу Ле Шателье система противодействует внешнему воздействию. Давление влияет на газовые реакции с изменением числа молей газа. Катализатор не смещает равновесие."}, {"t": "Среда раствора Na₂CO₃?", "o": ["Не определяется", "Кислая", "Щелочная", "Нейтральная"], "a": 2, "ex": "Сильные электролиты в разбавленном растворе диссоциируют практически полностью. Соль слабой кислоты и сильного основания обычно даёт щелочную среду."}]}, {"id": "mix_chem_8", "s": "chem", "title": "Повторение • блок 2", "q": [{"t": "Сколько электронов принимает Mn⁷⁺ при переходе в Mn²⁺?", "o": ["5", "7", "3", "2"], "a": 0, "ex": "Окисление — отдача электронов, восстановление — принятие. Число отданных и принятых электронов уравнивают."}, {"t": "Какой процесс идёт на катоде?", "o": ["Восстановление", "Окисление", "Гидролиз", "Нейтрализация"], "a": 0, "ex": "На катоде идёт восстановление, на аноде окисление. В водном растворе конкурируют ионы и вода; в расплаве воды нет."}, {"t": "Какой оксид амфотерный?", "o": ["CO₂", "SO₃", "Na₂O", "Al₂O₃"], "a": 3, "ex": "Оксиды, кислоты, основания, соли различают по составу. Соли бывают средними, кислыми и основными; амфотерные гидроксиды реагируют с кислотами и щелочами."}, {"t": "Какой металл вытеснит медь из раствора CuSO₄?", "o": ["Fe", "Ag", "Au", "Pt"], "a": 0, "ex": "Активность металлов определяет возможность вытеснения водорода из неокисляющих кислот и металлов из растворов солей. Неметаллы могут быть окислителями и восстановителями."}, {"t": "Какой оксид несолеобразующий?", "o": ["CO", "CaO", "SO₂", "P₂O₅"], "a": 0, "ex": "Основные оксиды реагируют с кислотами, кислотные — с основаниями, амфотерные — с обоими классами. CO и NO относятся к несолеобразующим."}, {"t": "Какой гидроксид амфотерный?", "o": ["Ba(OH)₂", "Zn(OH)₂", "NaOH", "KOH"], "a": 1, "ex": "Щёлочи — растворимые основания. Амфотерный Al(OH)₃ растворяется и в кислоте, и в избытке щёлочи. Кислоты реагируют с основаниями."}, {"t": "Какой осадок образуется при смешении BaCl₂ и Na₂SO₄?", "o": ["NaCl", "Na₂SO₄", "BaCl₂", "BaSO₄"], "a": 3, "ex": "Обмен в растворах протекает при образовании осадка, газа или слабого электролита. Кислые соли содержат замещаемый водород."}, {"t": "Какой ион окисляется хлором?", "o": ["K⁺", "Na⁺", "Br⁻", "F⁻"], "a": 2, "ex": "Щелочные металлы образуют щёлочи; Al и Zn амфотерны; Fe имеет степени +2 и +3; Cu реагирует с кислотами-окислителями. Галогены вытесняют менее активные галогены. S, N, P, C и Si образуют характерные кислотные оксиды."}]}, {"id": "mix_chem_16", "s": "chem", "title": "Повторение • блок 3", "q": [{"t": "Какой реагент выявляет сульфат-ионы?", "o": ["BaCl₂", "H₂O", "NaCl", "KNO₃"], "a": 0, "ex": "Ag⁺ обнаруживает Cl⁻ белым осадком; Ba²⁺ обнаруживает SO₄²⁻ белым осадком, устойчивым к разбавленным кислотам. Fe³⁺ с SCN⁻ даёт красное окрашивание."}, {"t": "Какой класс межклассово изомерен предельным одноатомным спиртам?", "o": ["Простые эфиры", "Алкины", "Алкены", "Карбоновые кислоты"], "a": 0, "ex": "Свойства зависят от порядка соединения атомов и их взаимного влияния. Изомеры имеют одинаковую молекулярную формулу, гомологи отличаются на группы CH₂."}, {"t": "Каков тип реакции хлорирования метана на свету?", "o": ["Обмен", "Поликонденсация", "Замещение", "Присоединение"], "a": 2, "ex": "Алканы вступают в радикальное замещение и горение; малые циклы могут вступать в присоединение с раскрытием кольца."}, {"t": "Какое вещество обесцвечивает бромную воду без освещения?", "o": ["Этан", "Пропан", "Метан", "Этен"], "a": 3, "ex": "Кратные связи допускают присоединение водорода, галогенов и галогеноводородов. Сопряжённые диены дают 1,2- и 1,4-присоединение. Терминальные алкины имеют подвижный атом водорода."}, {"t": "Продукт нитрования бензола?", "o": ["Анилин", "Нитробензол", "Толуол", "Фенол"], "a": 1, "ex": "Бензольное кольцо устойчиво благодаря делокализации π-электронов. Характерно электрофильное замещение, а не обычное присоединение."}, {"t": "Какое вещество реагирует с NaOH в водном растворе?", "o": ["Фенол", "Метанол", "Пропанол", "Этанол"], "a": 0, "ex": "Спирты реагируют с активными металлами, подвергаются дегидратации и окислению. Фенол проявляет более выраженные кислотные свойства и реагирует со щёлочью."}, {"t": "Какой реагент отличает этаналь от пропанона?", "o": ["H₂ при катализаторе", "NaCl", "Аммиачный раствор оксида серебра", "Вода"], "a": 2, "ex": "Альдегидная группа –CHO окисляется до карбоксильной; кетоны обычно не дают реакцию серебряного зеркала. Оба класса гидрируются до спиртов."}, {"t": "Продукт щелочного гидролиза жира кроме глицерина?", "o": ["Альдегиды", "Амины", "Соли жирных кислот", "Алкены"], "a": 2, "ex": "Кислоты реагируют с основаниями и карбонатами; сложные эфиры образуются при этерификации и гидролизуются. Щелочной гидролиз жиров даёт глицерин и соли кислот."}]}, {"id": "mix_chem_24", "s": "chem", "title": "Повторение • блок 4", "q": [{"t": "Какой углевод даёт синее окрашивание с йодом?", "o": ["Сахароза", "Крахмал", "Фруктоза", "Глюкоза"], "a": 1, "ex": "Глюкоза — моносахарид, сахароза — дисахарид, крахмал и целлюлоза — полисахариды. Крахмал даёт синее окрашивание с йодом."}, {"t": "Какое вещество амфотерно?", "o": ["Метиламин", "Этанол", "Глицин", "Бензол"], "a": 2, "ex": "Амины проявляют основные свойства. Аминокислоты амфотерны; белки состоят из аминокислотных остатков, связанных пептидными связями. Азот входит и в состав некоторых гетероциклов."}, {"t": "Мономер полиэтилена?", "o": ["Этин", "Этен", "Этанол", "Этан"], "a": 1, "ex": "При полимеризации мономеры соединяются без выделения низкомолекулярного продукта; при поликонденсации он обычно выделяется."}, {"t": "Как отделить песок от воды?", "o": ["Фильтрование", "Титрование", "Нейтрализация", "Электролиз"], "a": 0, "ex": "Фильтрование отделяет нерастворимый осадок; перегонка использует различия температур кипения; кристаллизация — растворимость. При работе соблюдают инструкции и используют защиту."}, {"t": "Исходные вещества синтеза аммиака?", "o": ["NO и O₂", "N₂ и O₂", "NH₄Cl и H₂O", "N₂ и H₂"], "a": 3, "ex": "Аммиак получают из азота и водорода; серную кислоту — контактным способом через SO₃. Металлургия использует восстановление и электролиз. Химические отходы требуют надлежащей утилизации."}, {"t": "10 г соли в 90 г воды. Массовая доля соли?", "o": ["90%", "9%", "11,1%", "10%"], "a": 3, "ex": "Массовая доля равна отношению массы компонента к массе всей смеси. При добавлении воды масса растворённого вещества сохраняется."}, {"t": "Теоретически 20 г продукта, выход 80%. Масса?", "o": ["25 г", "16 г", "20 г", "4 г"], "a": 1, "ex": "Переведи массы в моли, найди ограничивающий реагент по коэффициентам, вычисли теоретический выход, затем учти фактический выход и чистоту сырья."}, {"t": "При сгорании 1 моль выделяется 400 кДж. Сколько при 0,5 моль?", "o": ["400 кДж", "100 кДж", "800 кДж", "200 кДж"], "a": 3, "ex": "Тепловой эффект пропорционален количеству прореагировавшего вещества. Экзотермический процесс выделяет тепло; эндотермический поглощает."}]}, {"id": "mix_chem_32", "s": "chem", "title": "Повторение • блок 5", "q": [{"t": "Простейшая формула CH₂O, M=60 г/моль. Молекулярная формула?", "o": ["CH₂O", "C₃H₆O₃", "C₂H₂O", "C₂H₄O₂"], "a": 3, "ex": "По продуктам сгорания найди количество C и H, кислород — по разности масс. Раздели количества атомов на минимальное, затем учти молярную массу."}]}, {"id": "mix_bio_0", "s": "bio", "title": "Повторение • блок 1", "q": [{"t": "Какой метод предполагает изменение исследуемого фактора?", "o": ["Классификация", "Эксперимент", "Описание", "Наблюдение"], "a": 1, "ex": "Биология изучает живые системы. Наблюдение не предполагает вмешательства, эксперимент проверяет гипотезу при контролируемых условиях. Контрольная группа нужна для сравнения."}, {"t": "На каком уровне действует элементарная эволюция?", "o": ["Клеточном", "Популяционно-видовом", "Организменном", "Молекулярном"], "a": 1, "ex": "Выделяют молекулярный, клеточный, организменный, популяционно-видовой, экосистемный и биосферный уровни. Живым системам свойственны обмен, саморегуляция, наследственность и изменчивость."}, {"t": "Как возникают новые клетки?", "o": ["Самозарождением", "Из внеклеточного вещества", "Делением исходных клеток", "Из вирусов"], "a": 2, "ex": "Клетка — структурная и функциональная единица клеточных организмов; новые клетки возникают из предшествующих клеток. Клетки сходны по основным химическим процессам."}, {"t": "Мономер белка?", "o": ["Нуклеотид", "Глицерин", "Аминокислота", "Глюкоза"], "a": 2, "ex": "Вода — растворитель и среда реакций; белки состоят из аминокислот, нуклеиновые кислоты — из нуклеотидов; липиды формируют мембраны; углеводы запасают энергию."}, {"t": "Какой органоид немембранный?", "o": ["Лизосома", "Хлоропласт", "Митохондрия", "Рибосома"], "a": 3, "ex": "Мембрана регулирует транспорт; рибосомы синтезируют белок, митохондрии обеспечивают аэробное дыхание, аппарат Гольджи сортирует продукты. Осмос — движение воды через полупроницаемую мембрану."}, {"t": "Где идёт цикл Кальвина?", "o": ["Ядро", "Строма хлоропласта", "Матрикс митохондрии", "Цитоплазма"], "a": 1, "ex": "Катаболизм высвобождает энергию, анаболизм расходует её. При фотосинтезе световая фаза создаёт АТФ и НАДФН, цикл Кальвина фиксирует CO₂. Хемосинтез использует энергию окисления неорганических веществ."}, {"t": "Как называется синтез РНК на ДНК?", "o": ["Транскрипция", "Репликация", "Конъюгация", "Трансляция"], "a": 0, "ex": "Репликация удваивает ДНК; транскрипция создаёт РНК; трансляция — полипептид. Генетический код триплетен и вырожден."}, {"t": "Что расходится в анафазе I мейоза?", "o": ["Сестринские хроматиды", "Гомологичные хромосомы", "Рибосомы", "Нуклеотиды"], "a": 1, "ex": "В S-фазе удваивается ДНК. Митоз сохраняет число хромосом; мейоз I разделяет гомологи, мейоз II — сестринские хроматиды. Кроссинговер происходит в профазе I."}]}, {"id": "mix_bio_8", "s": "bio", "title": "Повторение • блок 2", "q": [{"t": "Какой структуры нет у вирусов?", "o": ["Геном", "Рибосомы", "Капсид", "Белки"], "a": 1, "ex": "Вирус содержит генетический материал и белковый капсид, иногда липидную оболочку. Размножение зависит от клетки хозяина."}, {"t": "Какая ткань обеспечивает рост растения?", "o": ["Механическая", "Покровная", "Проводящая", "Образовательная"], "a": 3, "ex": "У многоклеточных клетки специализируются и образуют ткани, органы и системы. У растений выделяют образовательные, покровные, основные, проводящие и механические ткани."}, {"t": "Когда возникают зародышевые листки?", "o": ["Дробление", "Овуляция", "Оплодотворение", "Гаструляция"], "a": 3, "ex": "Бесполое размножение не требует слияния гамет; половое создаёт новые комбинации аллелей. Эмбриогенез включает дробление, гаструляцию и органогенез."}, {"t": "Какое поколение доминирует у мхов?", "o": ["Спорофит", "Гаметофит", "Зигота", "Спора"], "a": 1, "ex": "Гаметофит образует гаметы митозом, спорофит — споры мейозом. У мхов преобладает гаметофит, у сосудистых растений — спорофит."}, {"t": "Доля aa при Aa × Aa?", "o": ["25%", "100%", "50%", "75%"], "a": 0, "ex": "При полном доминировании Aa × Aa даёт 3:1 по фенотипу. Независимое наследование двух несцепленных генов даёт 9:3:3:1. Анализирующее скрещивание проводят с рецессивной гомозиготой."}, {"t": "Что нарушает полное сцепление?", "o": ["Митоз", "Диссоциация", "Трансляция", "Кроссинговер"], "a": 3, "ex": "Гены одной хромосомы образуют группу сцепления, кроссинговер создаёт рекомбинанты. Частота рекомбинации позволяет оценить расстояние между генами. X-сцепленные признаки имеют особые схемы наследования."}, {"t": "К какому типу относится изменение числа хромосом?", "o": ["Комбинативная", "Генная", "Геномная", "Модификационная"], "a": 2, "ex": "Модификации обычно не меняют генотип; комбинативная изменчивость перераспределяет аллели; мутации меняют наследственный материал. Различают генные, хромосомные и геномные мутации."}, {"t": "Какой метод выявляет трисомию?", "o": ["Гибридологический", "Генеалогический", "Цитогенетический", "Близнецовый"], "a": 2, "ex": "Родословные помогают определить тип наследования, близнецовый метод — вклад среды и наследственности, цитогенетический — особенности хромосом, биохимический — нарушения обмена."}]}, {"id": "mix_bio_16", "s": "bio", "title": "Повторение • блок 3", "q": [{"t": "Как называется увеличение числа наборов хромосом?", "o": ["Трансляция", "Инбридинг", "Гетерозис", "Полиплоидия"], "a": 3, "ex": "Селекция использует отбор, гибридизацию, мутагенез и полиплоидию. Биотехнология применяет живые системы для получения продуктов; генная инженерия меняет генетический материал."}, {"t": "Какой таксон выше рода?", "o": ["Семейство", "Популяция", "Вид", "Особь"], "a": 0, "ex": "Иерархия таксонов отражает классификацию и эволюционное родство. Бинарное название вида содержит родовое и видовое названия."}, {"t": "Что характерно для бактериальной клетки?", "o": ["Хлоропласт", "Нуклеоид", "Ядрышко", "Митохондрия"], "a": 1, "ex": "Прокариоты не имеют мембранного ядра. Бактерии размножаются делением, могут обмениваться генами, участвуют в круговоротах и симбиозах."}, {"t": "Что входит в клеточную стенку большинства грибов?", "o": ["Кератин", "Крахмал", "Хитин", "Гликоген"], "a": 2, "ex": "Грибы гетеротрофны, клеточная стенка обычно содержит хитин, запасное вещество — гликоген. Лишайник — симбиотическая система гриба и фотосинтезирующего партнёра."}, {"t": "Как называется гаметофит папоротника?", "o": ["Заросток", "Сорус", "Шишка", "Семя"], "a": 0, "ex": "Водоросли не имеют настоящих органов; мхи не имеют настоящих корней; папоротники имеют сосудистые ткани, корни и листья. Для оплодотворения большинства мхов и папоротников нужна вода."}, {"t": "Какой набор у типичного эндосперма цветковых?", "o": ["3n", "2n", "4n", "n"], "a": 0, "ex": "У голосеменных семязачатки не заключены в завязь; покрытосеменные образуют цветок и плод. При двойном оплодотворении возникают зигота и обычно триплоидный эндосперм."}, {"t": "Какая ткань проводит воду от корней?", "o": ["Флоэма", "Эпидерма", "Камбий", "Ксилема"], "a": 3, "ex": "Корень поглощает воду, побег несёт листья и почки, цветок обеспечивает половое размножение. Однодольные обычно имеют одну семядолю, параллельное жилкование и мочковатую корневую систему."}, {"t": "Какие клетки характерны для гидры?", "o": ["Хрящевые", "Эритроциты", "Костные", "Стрекательные"], "a": 3, "ex": "Простейшие — одноклеточные эукариоты. Губки фильтруют воду; кишечнополостные имеют стрекательные клетки и лучевую симметрию."}]}, {"id": "mix_bio_24", "s": "bio", "title": "Повторение • блок 4", "q": [{"t": "Какой червь имеет вторичную полость тела?", "o": ["Планария", "Бычий цепень", "Аскарида", "Дождевой червь"], "a": 3, "ex": "Плоские черви не имеют полости тела; круглые имеют первичную, кольчатые — вторичную. У моллюсков характерны мантия и мускулистая нога."}, {"t": "Сколько пар ходильных ног у насекомых?", "o": ["2", "5", "3", "4"], "a": 2, "ex": "Членистые конечности и хитиновый покров — признаки типа. У насекомых три пары ног, у паукообразных четыре, у ракообразных две пары усиков. Рост связан с линькой."}, {"t": "У какой группы четырёхкамерное сердце и перья?", "o": ["Костные рыбы", "Ящерицы", "Птицы", "Земноводные"], "a": 2, "ex": "Хорда, дорсальная нервная трубка и глоточные щели характерны на определённых стадиях. Рыбы обычно дышат жабрами; земноводные имеют кожное и лёгочное дыхание; птицы и млекопитающие теплокровны."}, {"t": "К какой ткани относится кровь?", "o": ["Нервная", "Соединительная", "Эпителиальная", "Мышечная"], "a": 1, "ex": "Эпителий покрывает поверхности, соединительная ткань имеет развитое межклеточное вещество, мышечная сокращается, нервная передаёт сигналы."}, {"t": "Какая ткань покрывает суставные поверхности костей?", "o": ["Нервная", "Эпителиальная", "Хрящевая", "Гладкая мышечная"], "a": 2, "ex": "Кости выполняют опорную и защитную функции, суставы обеспечивают подвижность, мышцы тянут кости при сокращении. Антагонисты действуют противоположно."}, {"t": "Какие клетки вырабатывают антитела?", "o": ["Миоциты", "Тромбоциты", "Плазматические клетки", "Эритроциты"], "a": 2, "ex": "Эритроциты переносят кислород, тромбоциты участвуют в свёртывании, лейкоциты защищают организм. Антитела вырабатываются плазматическими клетками. Вакцинация формирует активный иммунитет."}, {"t": "Какой сосуд несёт артериальную кровь от лёгких?", "o": ["Лёгочная вена", "Полая вена", "Лёгочная артерия", "Аорта"], "a": 0, "ex": "Артерии несут кровь от сердца, вены — к сердцу. Малый круг начинается в правом желудочке и заканчивается в левом предсердии. Лимфа возвращает тканевую жидкость в кровь."}, {"t": "Что происходит с диафрагмой при вдохе?", "o": ["Не меняется", "Расслабляется и поднимается", "Сокращается и опускается", "Сокращается и поднимается"], "a": 2, "ex": "Вентиляция обеспечивает поступление воздуха, диффузия — газообмен в альвеолах. При спокойном вдохе диафрагма сокращается и опускается."}]}, {"id": "mix_bio_32", "s": "bio", "title": "Повторение • блок 5", "q": [{"t": "Где преимущественно всасываются питательные вещества?", "o": ["Тонкая кишка", "Пищевод", "Желудок", "Ротовая полость"], "a": 0, "ex": "Амилаза расщепляет крахмал, пепсин работает в кислой среде желудка, ферменты поджелудочной железы действуют в тонкой кишке. Желчь эмульгирует жиры."}, {"t": "Где образуется первичная моча?", "o": ["Почечная лоханка", "Мочеточник", "Мочевой пузырь", "Капсула нефрона"], "a": 3, "ex": "Нефрон фильтрует плазму, затем вещества реабсорбируются и секретируются. Кожа защищает и участвует в терморегуляции посредством потоотделения и изменения просвета сосудов."}, {"t": "Где обычно происходит оплодотворение?", "o": ["Матка", "Яичник", "Влагалище", "Маточная труба"], "a": 3, "ex": "Гаметы формируются мейозом. Оплодотворение обычно происходит в маточной трубе, имплантация — в матке. Плацента обеспечивает обмен между организмами матери и плода."}, {"t": "Какой нейрон проводит сигнал от рецептора?", "o": ["Двигательный", "Чувствительный", "Мышечный", "Секреторный"], "a": 1, "ex": "ЦНС включает головной и спинной мозг; ПНС — нервы и узлы. Рефлекс реализуется через рецептор, чувствительный нейрон, центральное звено, двигательный нейрон и эффектор."}, {"t": "Какой гормон снижает глюкозу крови?", "o": ["Глюкагон", "Адреналин", "Кортизол", "Инсулин"], "a": 3, "ex": "Гормоны действуют на клетки с соответствующими рецепторами. Инсулин снижает концентрацию глюкозы в крови, глюкагон повышает. Обратная связь стабилизирует параметры."}, {"t": "Где расположены фоторецепторы?", "o": ["Радужка", "Хрусталик", "Роговица", "Сетчатка"], "a": 3, "ex": "Анализатор включает рецепторный, проводниковый и центральный отделы. Палочки сетчатки обеспечивают сумеречное зрение, колбочки — цветовое. Улитка участвует в слухе."}, {"t": "Какой рефлекс приобретается в течение жизни?", "o": ["Безусловный", "Условный", "Зрачковый", "Коленный"], "a": 1, "ex": "Безусловные рефлексы врождённые, условные приобретаются и требуют подкрепления. Сон связан с закономерным чередованием фаз. Речь и мышление связаны с функциями коры."}, {"t": "Что относится к активному специфическому иммунитету?", "o": ["Кожа", "Готовые антитела из сыворотки", "Слюна", "Иммунитет после вакцинации"], "a": 3, "ex": "Профилактика включает физическую активность, сон, сбалансированное питание, гигиену и вакцинацию. Гомеостаз поддерживает относительное постоянство внутренней среды."}]}, {"id": "mix_bio_40", "s": "bio", "title": "Повторение • блок 6", "q": [{"t": "Кто обосновал естественный отбор?", "o": ["Линней", "Мендель", "Дарвин", "Пастер"], "a": 2, "ex": "Ламарк предложил раннюю целостную эволюционную теорию; Дарвин объяснил адаптации естественным отбором наследственных различий. Современная теория соединяет отбор с генетикой популяций."}, {"t": "Что особенно заметно в малых популяциях?", "o": ["Фотосинтез", "Митоз", "Трансляция", "Дрейф генов"], "a": 3, "ex": "Мутации и рекомбинация создают разнообразие; дрейф генов случайно меняет частоты аллелей; поток генов и изоляция влияют на различия популяций. Отбор действует на фенотипы."}, {"t": "Какое видообразование связано с пространственным барьером?", "o": ["Географическое", "Экологическое без пространственного барьера", "Искусственный отбор", "Конвергенция"], "a": 0, "ex": "Вид определяют совокупностью критериев: морфологического, генетического, экологического и других. Репродуктивная изоляция препятствует обмену генами между популяциями."}, {"t": "Крылья птицы и бабочки как органы полёта являются?", "o": ["Аналогичными", "Атавизмами", "Гомологичными", "Рудиментами"], "a": 0, "ex": "Гомологичные органы имеют общее происхождение, аналогичные — сходную функцию при различном происхождении. Ароморфоз повышает общий уровень организации, идиоадаптация — частная адаптация."}, {"t": "Какой органоид имеет собственную ДНК?", "o": ["Рибосома", "Митохондрия", "Лизосома", "Аппарат Гольджи"], "a": 1, "ex": "Гипотезы абиогенеза описывают образование органических веществ и ранних самовоспроизводящихся систем. Эндосимбиотическая теория объясняет происхождение митохондрий и пластид."}, {"t": "Какой признак связан с прямохождением?", "o": ["Длинные передние конечности", "Хвост", "S-образный позвоночник", "Хватательная стопа с противопоставленным пальцем"], "a": 2, "ex": "Человек и современные человекообразные обезьяны имеют общих предков. Эволюция человека включала прямохождение, развитие мозга, орудийной деятельности и культуры. Все современные люди принадлежат одному виду."}, {"t": "Какой фактор абиотический?", "o": ["Температура", "Паразитизм", "Конкуренция", "Хищничество"], "a": 0, "ex": "Абиотические факторы — условия неживой среды, биотические — взаимодействия организмов, антропогенные — деятельность человека. Лимитирующий фактор ограничивает жизнедеятельность."}, {"t": "Кто является консументом второго порядка в этой цепи?", "o": ["Лягушка", "Уж", "Трава", "Кузнечик"], "a": 0, "ex": "Продуценты создают органическое вещество, консументы потребляют его, редуценты минерализуют остатки. Энергия уменьшается по трофическим уровням; правило 10% приблизительно."}]}, {"id": "mix_bio_48", "s": "bio", "title": "Повторение • блок 7", "q": [{"t": "Как называется восстановление леса после пожара при сохранении почвы?", "o": ["Вторичная сукцессия", "Дрейф генов", "Первичная сукцессия", "Конвергенция"], "a": 0, "ex": "Сукцессия — последовательное изменение сообщества. Первичная начинается на субстрате без почвы, вторичная — после нарушения с сохранением почвы. Агроценоз зависит от вмешательства человека."}, {"t": "Какой процесс увеличивает численность популяции?", "o": ["Иммиграция", "Смертность", "Хищничество", "Эмиграция"], "a": 0, "ex": "Численность меняют рождаемость, смертность, иммиграция и эмиграция. При ограниченных ресурсах рост замедляется вблизи ёмкости среды."}, {"t": "Какой процесс связывает атмосферный N₂?", "o": ["Транспирация", "Азотфиксация", "Денитрификация", "Гликолиз"], "a": 1, "ex": "Биосфера включает области Земли, населённые организмами. Углерод фиксируется при фотосинтезе, возвращается при дыхании и разложении. Азотфиксация переводит атмосферный азот в доступные соединения."}, {"t": "Что способствует эвтрофикации?", "o": ["Очистка сточных вод", "Удаление избытка фосфатов", "Сток удобрений", "Снижение сбросов"], "a": 2, "ex": "Сохранение местообитаний, снижение загрязнения, рациональное использование ресурсов и защита биоразнообразия поддерживают экосистемы. Эвтрофикация связана с избытком биогенных элементов."}]}]);
GLOSS = GLOSS.concat([["chem", "Атом и электронные конфигурации", "Протоны определяют заряд ядра; нейтроны различают изотопы; электроны заполняют орбитали по принципу Паули и правилу Хунда."], ["chem", "Периодичность", "В периоде обычно растёт электроотрицательность и уменьшается радиус; вниз по группе радиус растёт. У элементов групп 13–18 число внешних электронов обычно равно номеру группы минус 10."], ["chem", "Связи и гибридизация", "Ковалентная связь возникает при обобществлении электронов; ионная — при притяжении ионов. Одинарная связь содержит σ, двойная — σ и π, тройная — σ и две π."], ["chem", "Кристаллические решётки", "Ионные кристаллы проводят ток в расплаве; молекулярные обычно легкоплавки; атомные имеют прочные ковалентные связи; металлические проводят ток в твёрдом состоянии."], ["chem", "Классификация реакций", "Реакции различают по составу реагентов и продуктов, тепловому эффекту, обратимости и изменению степеней окисления."], ["chem", "Кинетика", "Скорость зависит от температуры, концентрации, площади контакта фаз и катализатора. Катализатор снижает энергию активации прямой и обратной реакции."], ["chem", "Равновесие", "По принципу Ле Шателье система противодействует внешнему воздействию. Давление влияет на газовые реакции с изменением числа молей газа. Катализатор не смещает равновесие."], ["chem", "Диссоциация и гидролиз", "Сильные электролиты в разбавленном растворе диссоциируют практически полностью. Соль слабой кислоты и сильного основания обычно даёт щелочную среду."], ["chem", "ОВР", "Окисление — отдача электронов, восстановление — принятие. Число отданных и принятых электронов уравнивают."], ["chem", "Электролиз", "На катоде идёт восстановление, на аноде окисление. В водном растворе конкурируют ионы и вода; в расплаве воды нет."], ["chem", "Классы и номенклатура неорганики", "Оксиды, кислоты, основания, соли различают по составу. Соли бывают средними, кислыми и основными; амфотерные гидроксиды реагируют с кислотами и щелочами."], ["chem", "Металлы и неметаллы", "Активность металлов определяет возможность вытеснения водорода из неокисляющих кислот и металлов из растворов солей. Неметаллы могут быть окислителями и восстановителями."], ["chem", "Оксиды", "Основные оксиды реагируют с кислотами, кислотные — с основаниями, амфотерные — с обоими классами. CO и NO относятся к несолеобразующим."], ["chem", "Гидроксиды и кислоты", "Щёлочи — растворимые основания. Амфотерный Al(OH)₃ растворяется и в кислоте, и в избытке щёлочи. Кислоты реагируют с основаниями."], ["chem", "Соли", "Обмен в растворах протекает при образовании осадка, газа или слабого электролита. Кислые соли содержат замещаемый водород."], ["chem", "Химия элементов", "Щелочные металлы образуют щёлочи; Al и Zn амфотерны; Fe имеет степени +2 и +3; Cu реагирует с кислотами-окислителями. Галогены вытесняют менее активные галогены. S, N, P, C и Si образуют характерные кислотные оксиды."], ["chem", "Качественные реакции", "Ag⁺ обнаруживает Cl⁻ белым осадком; Ba²⁺ обнаруживает SO₄²⁻ белым осадком, устойчивым к разбавленным кислотам. Fe³⁺ с SCN⁻ даёт красное окрашивание."], ["chem", "Органическое строение и изомерия", "Свойства зависят от порядка соединения атомов и их взаимного влияния. Изомеры имеют одинаковую молекулярную формулу, гомологи отличаются на группы CH₂."], ["chem", "Алканы и циклоалканы", "Алканы вступают в радикальное замещение и горение; малые циклы могут вступать в присоединение с раскрытием кольца."], ["chem", "Алкены, диены и алкины", "Кратные связи допускают присоединение водорода, галогенов и галогеноводородов. Сопряжённые диены дают 1,2- и 1,4-присоединение. Терминальные алкины имеют подвижный атом водорода."], ["chem", "Арены", "Бензольное кольцо устойчиво благодаря делокализации π-электронов. Характерно электрофильное замещение, а не обычное присоединение."], ["chem", "Спирты и фенолы", "Спирты реагируют с активными металлами, подвергаются дегидратации и окислению. Фенол проявляет более выраженные кислотные свойства и реагирует со щёлочью."], ["chem", "Альдегиды и кетоны", "Альдегидная группа –CHO окисляется до карбоксильной; кетоны обычно не дают реакцию серебряного зеркала. Оба класса гидрируются до спиртов."], ["chem", "Карбоновые кислоты и эфиры", "Кислоты реагируют с основаниями и карбонатами; сложные эфиры образуются при этерификации и гидролизуются. Щелочной гидролиз жиров даёт глицерин и соли кислот."], ["chem", "Углеводы", "Глюкоза — моносахарид, сахароза — дисахарид, крахмал и целлюлоза — полисахариды. Крахмал даёт синее окрашивание с йодом."], ["chem", "Амины, аминокислоты, белки", "Амины проявляют основные свойства. Аминокислоты амфотерны; белки состоят из аминокислотных остатков, связанных пептидными связями. Азот входит и в состав некоторых гетероциклов."], ["chem", "Полимеры", "При полимеризации мономеры соединяются без выделения низкомолекулярного продукта; при поликонденсации он обычно выделяется."], ["chem", "Лаборатория и разделение смесей", "Фильтрование отделяет нерастворимый осадок; перегонка использует различия температур кипения; кристаллизация — растворимость. При работе соблюдают инструкции и используют защиту."], ["chem", "Промышленность и экология", "Аммиак получают из азота и водорода; серную кислоту — контактным способом через SO₃. Металлургия использует восстановление и электролиз. Химические отходы требуют надлежащей утилизации."], ["chem", "Растворы и массовая доля", "Массовая доля равна отношению массы компонента к массе всей смеси. При добавлении воды масса растворённого вещества сохраняется."], ["chem", "Стехиометрия, выход и примеси", "Переведи массы в моли, найди ограничивающий реагент по коэффициентам, вычисли теоретический выход, затем учти фактический выход и чистоту сырья."], ["chem", "Термохимия", "Тепловой эффект пропорционален количеству прореагировавшего вещества. Экзотермический процесс выделяет тепло; эндотермический поглощает."], ["chem", "Вывод молекулярной формулы", "По продуктам сгорания найди количество C и H, кислород — по разности масс. Раздели количества атомов на минимальное, затем учти молярную массу."], ["bio", "Биология и методы исследования", "Биология изучает живые системы. Наблюдение не предполагает вмешательства, эксперимент проверяет гипотезу при контролируемых условиях. Контрольная группа нужна для сравнения."], ["bio", "Уровни и свойства живого", "Выделяют молекулярный, клеточный, организменный, популяционно-видовой, экосистемный и биосферный уровни. Живым системам свойственны обмен, саморегуляция, наследственность и изменчивость."], ["bio", "Клеточная теория", "Клетка — структурная и функциональная единица клеточных организмов; новые клетки возникают из предшествующих клеток. Клетки сходны по основным химическим процессам."], ["bio", "Биохимия клетки", "Вода — растворитель и среда реакций; белки состоят из аминокислот, нуклеиновые кислоты — из нуклеотидов; липиды формируют мембраны; углеводы запасают энергию."], ["bio", "Мембраны и органоиды", "Мембрана регулирует транспорт; рибосомы синтезируют белок, митохондрии обеспечивают аэробное дыхание, аппарат Гольджи сортирует продукты. Осмос — движение воды через полупроницаемую мембрану."], ["bio", "Метаболизм и фотосинтез", "Катаболизм высвобождает энергию, анаболизм расходует её. При фотосинтезе световая фаза создаёт АТФ и НАДФН, цикл Кальвина фиксирует CO₂. Хемосинтез использует энергию окисления неорганических веществ."], ["bio", "Генетическая информация", "Репликация удваивает ДНК; транскрипция создаёт РНК; трансляция — полипептид. Генетический код триплетен и вырожден."], ["bio", "Клеточный цикл, митоз, мейоз", "В S-фазе удваивается ДНК. Митоз сохраняет число хромосом; мейоз I разделяет гомологи, мейоз II — сестринские хроматиды. Кроссинговер происходит в профазе I."], ["bio", "Вирусы", "Вирус содержит генетический материал и белковый капсид, иногда липидную оболочку. Размножение зависит от клетки хозяина."], ["bio", "Ткани и организация организмов", "У многоклеточных клетки специализируются и образуют ткани, органы и системы. У растений выделяют образовательные, покровные, основные, проводящие и механические ткани."], ["bio", "Размножение и онтогенез", "Бесполое размножение не требует слияния гамет; половое создаёт новые комбинации аллелей. Эмбриогенез включает дробление, гаструляцию и органогенез."], ["bio", "Жизненные циклы растений", "Гаметофит образует гаметы митозом, спорофит — споры мейозом. У мхов преобладает гаметофит, у сосудистых растений — спорофит."], ["bio", "Менделевская генетика", "При полном доминировании Aa × Aa даёт 3:1 по фенотипу. Независимое наследование двух несцепленных генов даёт 9:3:3:1. Анализирующее скрещивание проводят с рецессивной гомозиготой."], ["bio", "Сцепление и хромосомная теория", "Гены одной хромосомы образуют группу сцепления, кроссинговер создаёт рекомбинанты. Частота рекомбинации позволяет оценить расстояние между генами. X-сцепленные признаки имеют особые схемы наследования."], ["bio", "Изменчивость", "Модификации обычно не меняют генотип; комбинативная изменчивость перераспределяет аллели; мутации меняют наследственный материал. Различают генные, хромосомные и геномные мутации."], ["bio", "Генетика человека", "Родословные помогают определить тип наследования, близнецовый метод — вклад среды и наследственности, цитогенетический — особенности хромосом, биохимический — нарушения обмена."], ["bio", "Селекция и биотехнология", "Селекция использует отбор, гибридизацию, мутагенез и полиплоидию. Биотехнология применяет живые системы для получения продуктов; генная инженерия меняет генетический материал."], ["bio", "Систематика", "Иерархия таксонов отражает классификацию и эволюционное родство. Бинарное название вида содержит родовое и видовое названия."], ["bio", "Бактерии и археи", "Прокариоты не имеют мембранного ядра. Бактерии размножаются делением, могут обмениваться генами, участвуют в круговоротах и симбиозах."], ["bio", "Грибы и лишайники", "Грибы гетеротрофны, клеточная стенка обычно содержит хитин, запасное вещество — гликоген. Лишайник — симбиотическ
