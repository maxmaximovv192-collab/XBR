<style>
/* Layout: one-column mini app, bottom tab bar. Chemistry = vermillion, biology = picholine green, sun yellow for highlights. */
:root {
  --bg: #F4EFEE;
  --surface: #FFFFFF;
  --fg: #2C3D37;
  --muted: #5F6F66;
  --line: rgba(44,61,55,.14);
  --scarab: #2C3D37;
  --chem: #BC5339;
  --chem-soft: #F7DDD2;
  --chem-fg: #FFFFFF;
  --bio: #566955;
  --bio-soft: #DFE6D3;
  --bio-fg: #FFFFFF;
  --sun: #F5E1AC;
  --sun-fg: #2C3D37;
  --sage: #A5A88F;
  --ok: #4F7A5A;
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18221F; --surface: #243430; --fg: #F4EFEE; --muted: #A9B3AB; --line: rgba(244,239,238,.14);
    --scarab: #0F1815; --chem: #E27E5E; --chem-soft: #4A2E27; --chem-fg: #1A110E;
    --bio: #93AD8D; --bio-soft: #2F4239; --bio-fg: #14201A; --sun: #F5E1AC; --sun-fg: #2C3D37; --sage: #7C8A76; --ok: #8BC49A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18221F; --surface: #243430; --fg: #F4EFEE; --muted: #A9B3AB; --line: rgba(244,239,238,.14);
  --scarab: #0F1815; --chem: #E27E5E; --chem-soft: #4A2E27; --chem-fg: #1A110E;
  --bio: #93AD8D; --bio-soft: #2F4239; --bio-fg: #14201A; --sun: #F5E1AC; --sun-fg: #2C3D37; --sage: #7C8A76; --ok: #8BC49A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; line-height: 1.2; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; }
h3 { font-size: 1rem; font-weight: 800; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; box-shadow: 0 0 0 5px var(--chem); }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.label { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; letter-spacing: .05em; font-size: 1.15rem; }
.brand svg { width: 38px; height: 38px; flex: none; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--sun); color: var(--sun-fg); display: grid; place-items: center; font-weight: 800; flex: none; }
.who .n { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: .8rem; color: var(--muted); }

.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.num { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }

.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 20px; color: #F4EFEE; background: linear-gradient(135deg, #2C3D37 0%, #566955 70%, #6B7F5E 100%); display: flex; flex-direction: column; gap: 14px; }
.hero::after { content: ""; position: absolute; right: -50px; top: -50px; width: 190px; height: 190px; border-radius: 50%; background: conic-gradient(from 0deg, #F5E1AC, #A5A88F, #BC5339, #F5E1AC); opacity: .55; filter: blur(.5px); }
.hero > * { position: relative; z-index: 1; }
.hero .label { color: #D9DCC9; }
.hero .bar { background: rgba(244,239,238,.22); }
.hero .bar > i { background: var(--sun); }
.bar { height: 9px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--fg); transition: width .4s; }
.bar.chem > i { background: var(--chem); }
.bar.bio > i { background: var(--bio); }

.subj { display: flex; gap: 14px; align-items: center; }
.tile { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.tile svg { width: 30px; height: 30px; }
.tile.chem { background: var(--chem); color: var(--chem-fg); }
.tile.bio { background: var(--bio); color: var(--bio-fg); }
.tile.sun { background: var(--sun); color: var(--sun-fg); }
.tile svg { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.subj .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }

.btn { background: var(--chem); color: var(--chem-fg); border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 800; width: 100%; }
.btn.bio { background: var(--bio); color: var(--bio-fg); }
.btn.alt { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.sm { padding: 9px 14px; width: auto; font-size: .9rem; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-block; font-size: .72rem; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: var(--sun); color: var(--sun-fg); white-space: nowrap; }
.chip.chem { background: var(--chem-soft); color: var(--chem); }
.chip.bio { background: var(--bio-soft); color: var(--bio); }
.chip.ok { background: var(--ok); color: #fff; }
:root[data-theme="dark"] .chip.ok { color: #12201A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.ok { color: #12201A; } }
.chip.warn { background: var(--chem); color: var(--chem-fg); }

.item { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.item .t { flex: 1; min-width: 0; }
.item .t small { display: block; color: var(--muted); }
.item .tile { width: 42px; height: 42px; border-radius: 13px; }
.item .tile svg { width: 22px; height: 22px; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--sage); flex: none; display: grid; place-items: center; font-size: .72rem; font-weight: 800; }
.dot.on { background: var(--ok); border-color: var(--ok); color: #fff; }

.seg { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 8px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--scarab); color: #F4EFEE; }
.seg button.on.chem { background: var(--chem); color: var(--chem-fg); }
.seg button.on.bio { background: var(--bio); color: var(--bio-fg); }

.note h3 { margin: 18px 0 4px; }
.note ul { margin: 6px 0; padding-left: 20px; }
.note li { margin: 3px 0; }
.formula { font-variant-numeric: tabular-nums; background: var(--sun); color: var(--sun-fg); border-radius: 12px; padding: 9px 13px; margin: 8px 0; font-weight: 700; overflow-x: auto; }
.opt { display: block; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font-weight: 600; }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
.opt.wrong { border-color: var(--chem); background: var(--chem-soft); }
textarea, input[type=text], input[type=password] { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; }
textarea { min-height: 96px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 6px; }
.err { background: var(--chem-soft); color: var(--chem); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: .9rem; }
.info { background: var(--sun); color: var(--sun-fg); border-radius: 12px; padding: 10px 12px; font-size: .85rem; }

.pick { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.pick button { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 800; }
.pick button.on { border-color: var(--chem); background: var(--chem-soft); }
.pick .avatar { width: 44px; height: 44px; font-size: 1.1rem; }
.pick button.on .avatar { background: var(--chem); color: var(--chem-fg); }

details.gl { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
details.gl summary { font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; list-style: none; }
details.gl summary::-webkit-details-marker { display: none; }
details.gl p { margin-top: 8px; color: var(--muted); }

.review { border-radius: 14px; padding: 12px 14px; background: var(--bio-soft); display: flex; flex-direction: column; gap: 4px; }
.review.again { background: var(--chem-soft); }
.stat3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.stat3 .card { padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.stat3 .num { font-size: 1.5rem; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 8px max(10px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.tabs nav { max-width: 560px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.tabs button { background: none; border: 0; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; font-weight: 700; color: var(--muted); border-radius: 12px; }
.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.on { color: var(--chem); background: var(--chem-soft); }

.login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 18px; max-width: 440px; margin: 0 auto; padding-block: 28px; }
.login .logo svg { width: 84px; height: 84px; }
.back { background: none; border: 0; color: var(--muted); font-weight: 700; padding: 4px 0; text-align: left; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); background: var(--scarab); color: #F4EFEE; padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: .85rem; z-index: 9; max-width: 90vw; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
 .studyfig{margin:0 0 12px;padding:10px;background:var(--surface);border-radius:16px;border:1px solid var(--line)}.studyfig svg{width:100%;max-height:420px;display:block}.studyfig figcaption{font-size:.75rem;color:var(--muted);text-align:center}.gl a{color:var(--fg);text-decoration:underline}input[type=search]{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg)}
 .note{line-height:1.72} .note p{margin:8px 0} .note h3{margin-top:22px} .formula.chemical,.reaction{font-family:Cambria,"STIX Two Text","Times New Roman",serif;font-size:1.32rem;font-weight:400;line-height:1.65;overflow-wrap:anywhere;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-left:3px solid var(--chem);padding:12px 15px;border-radius:12px;margin:10px 0;white-space:normal} .reaction b{font-family:var(--font-body);font-size:.92rem;font-weight:800;display:block} .reaction span{display:block} 
</style>

  var NOTES = [{"id": "bookN1", "s": "chem", "title": "Окислительно-восстановительные реакции", "min": 10, "body": [["h", "Степени окисления"], ["p", "В простых веществах СО равна нулю; у одноатомного иона равна заряду. Сумма СО в молекуле равна нулю, в сложном ионе — его заряду. H обычно +1, O обычно −2; исключения — гидриды, пероксиды и OF₂."], ["h", "Роли участников"], ["p", "Металлы в простом состоянии обычно восстановители; соединения с высшей СО элемента могут восстанавливаться, с низшей — окисляться. Промежуточная СО допускает двойственность, например Fe²⁺ и H₂O₂."], ["h", "Классификация"], ["p", "Межмолекулярная реакция — участники в разных веществах; внутримолекулярная — в одном; диспропорционирование — один элемент одновременно повышает и понижает СО. Сопропорционирование даёт промежуточную СО."], ["f", "2H₂O₂ → 2H₂O + O₂↑"], ["h", "Дополнительные примеры уравнений"], ["f", "Zn + 2HCl → ZnCl₂ + H₂↑"], ["f", "2FeCl₂ + Cl₂ → 2FeCl₃"], ["f", "3HNO₂ → HNO₃ + 2NO↑ + H₂O"], ["h", "Электронная природа ОВР"], ["p", "Окисление повышает степень окисления, восстановление понижает её. Окислитель сам восстанавливается. Сравнивайте степени окисления всех атомов до и после реакции."], ["f", "2KI + Cl₂ → 2KCl + I₂"], ["f", "2H₂S + SO₂ → 3S↓ + 2H₂O"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Окислительно-восстановительные реакции» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 1, с. 5–7 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN2", "s": "chem", "title": "Составление уравнений ОВР", "min": 10, "body": [["h", "Электронный баланс"], ["p", "Установить продукты, определить изменившиеся СО, записать отдачу и принятие электронов, найти НОК, перенести множители, уравнять остальные элементы. Проверить атомы и заряд."], ["h", "Метод полуреакций"], ["p", "В кислой среде кислород уравнивают H₂O, водород H⁺, заряд электронами; в щелочной среде добавляют OH⁻ и сокращают воду. Сложить полуреакции после уравнивания электронов."], ["f", "MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O"], ["f", "Fe²⁺ → Fe³⁺ + e⁻"], ["f", "MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 4H₂O + 5Fe³⁺"], ["h", "Дополнительные примеры уравнений"], ["f", "Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O"], ["h", "Составление молекулярного уравнения"], ["p", "После электронного баланса подберите коэффициенты для кислоты, соли и воды. В кислой среде перманганат восстанавливается до Mn²⁺."], ["f", "2KMnO₄ + 16HCl → 2KCl + 2MnCl₂ + 5Cl₂↑ + 8H₂O"], ["f", "Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Составление уравнений ОВР» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 2, с. 8–14 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN3", "s": "chem", "title": "Особые случаи составления ОВР", "min": 10, "body": [["h", "Особые случаи"], ["p", "Если изменяются СО нескольких элементов, суммируют отдаваемые или принимаемые электроны. Для диспропорционирования отдельно записывают два направления изменения одного элемента. При участии среды её количество не всегда совпадает с электронным коэффициентом."], ["h", "Проверка"], ["p", "В полуреакциях сохраняются атомы и заряд; в молекулярном уравнении дополнительно проверяют противоионы. Не следует путать индекс с коэффициентом."], ["f", "Cl₂ + 2NaOH → NaCl + NaClO + H₂O"], ["f", "3Cl₂ + 6KOH → 5KCl + KClO₃ + 3H₂O"], ["p", "Первое уравнение соответствует холодной разбавленной щёлочи, второе — горячей концентрированной."], ["h", "Дополнительные примеры уравнений"], ["f", "3Cl₂ + 6NaOH → 5NaCl + NaClO₃ + 3H₂O"], ["h", "Несколько центров окисления"], ["p", "При окислении сульфидов может меняться степень окисления и металла, и серы. Учитывайте суммарное число электронов для формульной единицы."], ["f", "4FeS₂ + 11O₂ → 2Fe₂O₃ + 8SO₂↑"], ["f", "2KClO₃ → 2KCl + 3O₂↑ (t, MnO₂)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Особые случаи составления ОВР» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 3, с. 15–22 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN4", "s": "chem", "title": "Комплексные соединения", "min": 10, "body": [["h", "Состав"], ["p", "Внутренняя сфера записывается в квадратных скобках: центральный атом и лиганды. Координационное число показывает число донорных атомов, связанных с центром. Внешняя сфера компенсирует заряд комплекса."], ["h", "Номенклатура"], ["p", "Указывают лиганды и их количество, затем центральный атом и его СО. Для анионных комплексов используют названия типа феррат, алюминат, цинкат."], ["h", "Диссоциация"], ["p", "Внешнесферные ионы отделяются как у сильного электролита; распад внутренней сферы обычно обратим и ограничен."], ["f", "K₄[Fe(CN)₆] → 4K⁺ + [Fe(CN)₆]⁴⁻"], ["f", "[Ag(NH₃)₂]⁺ ⇌ Ag⁺ + 2NH₃"], ["h", "Дополнительные примеры уравнений"], ["f", "AgCl + 2NH₃ ⇄ [Ag(NH₃)₂]⁺ + Cl⁻"], ["f", "Al(OH)₃ + OH⁻ → [Al(OH)₄]⁻"], ["h", "Лиганды и заряд комплекса"], ["p", "Нейтральные лиганды NH₃ и H₂O не изменяют заряд центрального иона; OH⁻ и CN⁻ уменьшают его. Координационное число не тождественно степени окисления."], ["f", "Cu²⁺ + 4NH₃ ⇌ [Cu(NH₃)₄]²⁺"], ["f", "Zn(OH)₂ + 2OH⁻ → [Zn(OH)₄]²⁻"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Комплексные соединения» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 4, с. 23–28 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN5", "s": "chem", "title": "Гидролиз солей", "min": 10, "body": [["h", "Сущность гидролиза"], ["p", "Ионы соли взаимодействуют с водой с образованием слабого электролита. Соли сильной кислоты и сильного основания практически не гидролизуются; соли слабой кислоты дают щелочную среду, слабого основания — кислую; для соли двух слабых электролитов важны их относительные силы."], ["h", "Уравнения"], ["p", "Для многозарядных ионов гидролиз часто ступенчатый, первая ступень преобладает. Записывают молекулярное, полное и сокращённое ионное уравнения."], ["f", "CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻"], ["f", "NH₄⁺ + H₂O ⇌ NH₃·H₂O + H⁺"], ["f", "Al³⁺ + H₂O ⇌ AlOH²⁺ + H⁺"], ["h", "Дополнительные примеры уравнений"], ["f", "CO₃²⁻ + H₂O ⇄ HCO₃⁻ + OH⁻"], ["f", "NH₄⁺ + H₂O ⇄ NH₃·H₂O + H⁺"], ["h", "Ступенчатый гидролиз"], ["p", "Сначала образуются гидроксокатионы или кислые анионы. Вторая ступень обычно выражена слабее первой."], ["f", "PO₄³⁻ + H₂O ⇌ HPO₄²⁻ + OH⁻"], ["f", "HPO₄²⁻ + H₂O ⇌ H₂PO₄⁻ + OH⁻"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Гидролиз солей» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 5, с. 29–34 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN6", "s": "chem", "title": "Степень гидролиза", "min": 10, "body": [["h", "Степень гидролиза"], ["p", "Отношение количества гидролизованной соли к исходному количеству. Зависит от природы ионов, концентрации и температуры. Разбавление обычно усиливает гидролиз; удаление продукта смещает равновесие."], ["h", "Управление равновесием"], ["p", "Добавление кислоты подавляет гидролиз по катиону и усиливает гидролиз по аниону; добавление щёлочи действует наоборот. Для соли слабой кислоты и сильного основания Kг = Kw/Ka."], ["f", "h = n(гидролизованной соли) / n(исходной соли)"], ["h", "Дополнительные примеры уравнений"], ["f", "CH₃COO⁻ + H₂O ⇄ CH₃COOH + OH⁻"], ["h", "Факторы гидролиза"], ["p", "Разбавление и изменение pH влияют на равновесие. Для слабого однозарядного гидролиза h ≈ √(Kг/c), если h выражена долей единицы и значительно меньше единицы."], ["f", "Kг = Kw / Ka (для аниона слабой кислоты)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Степень гидролиза» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 6, с. 35–36 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN7", "s": "chem", "title": "Металлы и растворы гидролизующихся солей", "min": 10, "body": [["h", "Металлы в растворах"], ["p", "Гидролиз соли слабого основания создаёт кислую среду; активный металл может вытеснять водород из такой среды. Нужно различать восстановление катиона металла и взаимодействие с H⁺ или водой."], ["h", "Пример"], ["p", "Магний в растворе хлорида аммония расходует протоны, равновесие гидролиза смещается; образуются аммиак и водород."], ["f", "Mg + 2NH₄Cl → MgCl₂ + 2NH₃↑ + H₂↑"], ["h", "Дополнительные примеры уравнений"], ["f", "2Na + 2H₂O → 2NaOH + H₂↑"], ["f", "Mg + 2H⁺ → Mg²⁺ + H₂↑"], ["h", "Конкурирующие процессы"], ["p", "В растворе соли учитывают не только ряд активности, но и кислотность и возможное взаимодействие металла с водой."], ["f", "2Al + 6NH₄Cl → 2AlCl₃ + 6NH₃↑ + 3H₂↑ (суммарная схема)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Металлы и растворы гидролизующихся солей» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 7, с. 37–37 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN8", "s": "chem", "title": "Необратимый гидролиз", "min": 10, "body": [["h", "Необратимость"], ["p", "Когда продукты гидролиза уходят в осадок или газ, равновесие сильно смещается. Сочетание гидролизующихся катионов и анионов может препятствовать существованию ожидаемой соли в воде."], ["h", "Бинарные вещества"], ["p", "Карбиды, нитриды и некоторые сульфиды при контакте с водой дают гидроксиды и летучие продукты; состав продуктов зависит от природы аниона."], ["f", "2Al³⁺ + 3CO₃²⁻ + 3H₂O → 2Al(OH)₃↓ + 3CO₂↑"], ["f", "CaC₂ + 2H₂O → Ca(OH)₂ + C₂H₂↑"], ["f", "Mg₃N₂ + 6H₂O → 3Mg(OH)₂ + 2NH₃↑"], ["h", "Взаимное усиление гидролиза"], ["p", "Если один ион связывает H⁺, а другой OH⁻, образование газа и осадка может сделать процесс практически необратимым."], ["f", "2AlCl₃ + 3Na₂S + 6H₂O → 2Al(OH)₃↓ + 3H₂S↑ + 6NaCl"], ["f", "Al₄C₃ + 12H₂O → 4Al(OH)₃↓ + 3CH₄↑"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Необратимый гидролиз» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 8, с. 38–43 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN9", "s": "chem", "title": "Оксиды", "min": 10, "body": [["h", "Получение и физические свойства"], ["p", "Оксиды получают окислением простых и сложных веществ, разложением гидроксидов, кислот и солей. Молекулярные оксиды часто летучи, ионные и атомные обычно тугоплавки."], ["h", "Классификация"], ["p", "Основные реагируют с кислотами, кислотные — с основаниями, амфотерные — с обоими, несолеобразующие (CO, NO, N₂O) не дают обычных реакций нейтрализации. Не каждый оксид реагирует с водой."], ["h", "ОВР"], ["p", "Низшие оксиды могут окисляться, высшие — восстанавливаться; промежуточные проявляют двойственность."], ["f", "CaO + H₂O → Ca(OH)₂"], ["f", "SO₃ + 2NaOH → Na₂SO₄ + H₂O"], ["f", "Al₂O₃ + 6HCl → 2AlCl₃ + 3H₂O"], ["f", "CuO + H₂ → Cu + H₂O"], ["h", "Дополнительные примеры уравнений"], ["f", "CaO + 2HCl → CaCl₂ + H₂O"], ["f", "CO₂ + 2NaOH → Na₂CO₃ + H₂O"], ["h", "Классификация и взаимодействия"], ["p", "Основные оксиды реагируют с кислотами, кислотные — с основаниями. Амфотерные реагируют с обоими. Несолеобразующие CO, NO, N₂O не проявляют обычных кислотно-основных свойств. Не всякий оксид взаимодействует с водой."], ["f", "CaO + 2HCl → CaCl₂ + H₂O"], ["f", "SiO₂ + 2NaOH → Na₂SiO₃ + H₂O (сплавление)"], ["f", "Al₂O₃ + 2NaOH → 2NaAlO₂ + H₂O (сплавление)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Оксиды» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 9, с. 44–48 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN10", "s": "chem", "title": "Гидроксиды. Основания", "min": 10, "body": [["h", "Классификация"], ["p", "Гидроксиды бывают основными, кислотными и амфотерными. Основания делят по растворимости и числу OH-групп; щёлочи — растворимые основания."], ["h", "Получение и свойства"], ["p", "Активные металлы и их основные оксиды реагируют с водой; нерастворимые основания осаждают обменом. Основания нейтрализуют кислоты, щёлочи реагируют с кислотными оксидами и солями при наличии движущей силы; многие нерастворимые основания разлагаются при нагревании."], ["f", "FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl"], ["f", "Cu(OH)₂ → CuO + H₂O"], ["f", "2NaOH + CO₂ → Na₂CO₃ + H₂O"], ["h", "Дополнительные примеры уравнений"], ["f", "NaOH + HCl → NaCl + H₂O"], ["h", "Растворимые и нерастворимые основания"], ["p", "Щёлочи диссоциируют в растворе, реагируют с кислотными оксидами и солями с образованием осадков. Большинство нерастворимых гидроксидов разлагается при нагревании."], ["f", "Cu(OH)₂ → CuO + H₂O (t)"], ["f", "2NaOH + CO₂ → Na₂CO₃ + H₂O"], ["f", "FeCl₃ + 3NaOH → Fe(OH)₃↓ + 3NaCl"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Гидроксиды. Основания» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 10, с. 49–51 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN11", "s": "chem", "title": "Кислоты", "min": 10, "body": [["h", "Классификация"], ["p", "Кислоты различают по основности, наличию кислорода, силе, устойчивости и окислительным свойствам. Основность определяется числом замещаемых протонов, а не общим количеством H в формуле."], ["h", "Получение"], ["p", "Гидратация соответствующего кислотного оксида, вытеснение более слабой или летучей кислоты, растворение газообразного галогеноводорода."], ["h", "Свойства"], ["p", "Кислоты реагируют с основаниями, основными и амфотерными оксидами, солями; металлы до H в ряду напряжений обычно вытесняют H₂ из неокисляющих кислот. HNO₃ и концентрированная H₂SO₄ дают продукты восстановления кислотного остатка."], ["f", "Na₂CO₃ + 2HCl → 2NaCl + CO₂↑ + H₂O"], ["f", "Cu + 4HNO₃ → Cu(NO₃)₂ + 2NO₂↑ + 2H₂O"], ["h", "Дополнительные примеры уравнений"], ["f", "HCl + AgNO₃ → HNO₃ + AgCl↓"], ["h", "Кислотность и реакции"], ["p", "Различайте основность кислоты и её силу. Многоосновные кислоты диссоциируют ступенчато. Для кислот-окислителей правило выделения водорода металлами неприменимо."], ["f", "H₃PO₄ ⇌ H⁺ + H₂PO₄⁻"], ["f", "Na₂SO₃ + 2HCl → 2NaCl + SO₂↑ + H₂O"], ["f", "Cu + 2H₂SO₄(конц.) → CuSO₄ + SO₂↑ + 2H₂O"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Кислоты» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 11, с. 52–54 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN12", "s": "chem", "title": "Амфотерные гидроксиды", "min": 10, "body": [["h", "Амфотерность"], ["p", "Al(OH)₃, Zn(OH)₂, Cr(OH)₃ проявляют кислотные и основные свойства. При добавлении щёлочи к соли сначала образуется осадок, затем в избытке щёлочи — растворимый гидроксокомплекс."], ["f", "Al³⁺ + 3OH⁻ → Al(OH)₃↓"], ["f", "Al(OH)₃ + OH⁻ → [Al(OH)₄]⁻"], ["f", "Al(OH)₃ + 3H⁺ → Al³⁺ + 3H₂O"], ["f", "Zn(OH)₂ + 2OH⁻ → [Zn(OH)₄]²⁻"], ["h", "Дополнительные примеры уравнений"], ["f", "Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O"], ["h", "Амфотерность в растворе и расплаве"], ["p", "В растворе избыток щёлочи даёт гидроксокомплексы, а при сплавлении возможны безводные соли."], ["f", "Zn(OH)₂ + 2HCl → ZnCl₂ + 2H₂O"], ["f", "Al(OH)₃ + NaOH → Na[Al(OH)₄]"], ["f", "Al(OH)₃ + NaOH → NaAlO₂ + 2H₂O (сплавление)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Амфотерные гидроксиды» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 12, с. 55–56 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN13", "s": "chem", "title": "Средние соли", "min": 10, "body": [["h", "Состав и получение"], ["p", "Средняя соль не содержит замещаемого кислотного H или основных OH-групп. Получение: нейтрализация, взаимодействие оксидов, обмен, замещение, соединение металла с неметаллом."], ["h", "Химические свойства"], ["p", "Обмен идёт при образовании газа, осадка или слабого электролита. Металл может вытеснять менее активный металл из раствора соли. При нагревании некоторые соли разлагаются; соли с промежуточной СО участвуют в ОВР."], ["f", "BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2NaCl"], ["f", "Fe + CuSO₄ → FeSO₄ + Cu"], ["f", "CaCO₃ → CaO + CO₂↑"], ["h", "Получение и обмен"], ["p", "Средние соли образуются при полной нейтрализации. Реакции обмена в растворе идут при образовании осадка, газа или слабого электролита."], ["f", "BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2NaCl"], ["f", "AgNO₃ + NaCl → AgCl↓ + NaNO₃"], ["f", "CaCO₃ → CaO + CO₂↑ (t)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Средние соли» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 13, с. 57–60 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN14", "s": "chem", "title": "Кислые, основные, двойные и смешанные соли", "min": 10, "body": [["h", "Кислые соли"], ["p", "Образуются при неполном замещении H многоосновной кислоты; реагируют и с кислотами, и со щёлочами. Гидрокарбонаты при нагревании часто переходят в карбонаты."], ["h", "Основные соли"], ["p", "Содержат OH-группы вследствие неполной нейтрализации основания; при действии кислоты дают среднюю соль."], ["h", "Двойные и смешанные соли"], ["p", "Двойные содержат разные катионы, смешанные — разные кислотные остатки; в растворе двойные соли распадаются на обычные ионы."], ["f", "NaHCO₃ + NaOH → Na₂CO₃ + H₂O"], ["f", "2NaHCO₃ → Na₂CO₃ + CO₂↑ + H₂O"], ["f", "Cu₂(OH)₂CO₃ + 4HCl → 2CuCl₂ + CO₂↑ + 3H₂O"], ["h", "Дополнительные примеры уравнений"], ["f", "Na₂CO₃ + CO₂ + H₂O → 2NaHCO₃"], ["h", "Состав и переходы между солями"], ["p", "Кислые соли сохраняют кислотный водород, основные — гидроксогруппы. Двойные соли содержат два различных катиона, смешанные — различные анионы."], ["f", "NaHCO₃ + NaOH → Na₂CO₃ + H₂O"], ["f", "2NaHCO₃ → Na₂CO₃ + CO₂↑ + H₂O (t)"], ["f", "Cu₂(OH)₂CO₃ → 2CuO + CO₂↑ + H₂O (t)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Кислые, основные, двойные и смешанные соли» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 14, с. 61–64 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN15", "s": "chem", "title": "Генетическая связь классов", "min": 10, "body": [["h", "Генетические ряды"], ["p", "Для металла типичный ряд: металл → основной оксид → основание → соль; для неметалла: неметалл → кислотный оксид → кислота → соль. Переходы могут быть прямыми или косвенными; нужно учитывать растворимость и амфотерность."], ["f", "2Ca + O₂ → 2CaO"], ["f", "CaO + H₂O → Ca(OH)₂"], ["f", "Ca(OH)₂ + 2HCl → CaCl₂ + 2H₂O"], ["f", "CaCl₂ + Na₂CO₃ → CaCO₃↓ + 2NaCl"], ["h", "Дополнительные примеры уравнений"], ["f", "Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O"], ["h", "Цепочки превращений"], ["p", "У металлов часто реализуется путь металл → основной оксид → основание → соль; у неметаллов — неметалл → кислотный оксид → кислота → соль. Учитывайте растворимость и условия каждой стрелки."], ["f", "2Ca + O₂ → 2CaO"], ["f", "CaO + H₂O → Ca(OH)₂"], ["f", "Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Генетическая связь классов» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 15, с. 65–72 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN16", "s": "chem", "title": "Общая характеристика неметаллов", "min": 10, "body": [["h", "Положение и строение"], ["p", "Неметаллы преимущественно в правой верхней части таблицы; у них различное число валентных электронов, высокие ЭО и энергии ионизации. Простые вещества бывают молекулярными и атомными; аллотропия характерна для O, S, P, C."], ["h", "Свойства"], ["p", "Взаимодействуют с металлами с образованием солей или бинарных соединений, с водородом — летучих гидридов, с кислородом — оксидов. Окислительная способность обычно растёт по периоду и ослабевает вниз по группе."], ["f", "2Na + Cl₂ → 2NaCl"], ["f", "S + O₂ → SO₂"], ["h", "Дополнительные примеры уравнений"], ["f", "4P + 5O₂ → 2P₂O₅"], ["h", "Строение и закономерности"], ["p", "Неметаллы образуют молекулярные и атомные простые вещества, могут иметь несколько аллотропных форм. В периоде неметаллические свойства обычно усиливаются, вниз по главной подгруппе ослабевают."], ["f", "C + O₂ → CO₂"], ["f", "2H₂ + O₂ → 2H₂O"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Общая характеристика неметаллов» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 16, с. 73–74 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN17", "s": "chem", "title": "Водород, вода, пероксид водорода", "min": 10, "body": [["h", "Водород"], ["p", "H₂ — неполярный лёгкий газ; восстанавливает некоторые оксиды, реагирует с неметаллами и активными металлами. В гидридах активных металлов H имеет СО −1."], ["h", "Вода"], ["p", "Полярная молекула, водородные связи, слабая диссоциация; реагирует с активными металлами, некоторыми оксидами и гидролизующимися соединениями."], ["h", "Пероксид"], ["p", "H₂O₂ содержит связь O–O, кислород −1; может быть окислителем и восстановителем, разлагается с выделением O₂."], ["f", "CuO + H₂ → Cu + H₂O"], ["f", "2Na + 2H₂O → 2NaOH + H₂↑"], ["f", "2H₂O₂ → 2H₂O + O₂↑"], ["h", "Водород, вода и H₂O₂"], ["p", "Водород восстанавливает некоторые оксиды металлов. С активными металлами образует гидриды, в которых водород имеет степень окисления −1. Пероксид водорода может быть окислителем и восстановителем."], ["f", "CuO + H₂ → Cu + H₂O (t)"], ["f", "2Na + H₂ → 2NaH"], ["f", "2NaH + 2H₂O → 2NaOH + 2H₂↑"], ["f", "2H₂O₂ → 2H₂O + O₂↑ (MnO₂)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Водород, вода, пероксид водорода» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 17, с. 75–86 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN18", "s": "chem", "title": "Галогены", "min": 10, "body": [["h", "Галогены"], ["p", "F₂, Cl₂, Br₂, I₂ — двухатомные молекулы, окислительная способность уменьшается вниз по группе. F в соединениях −1; остальные имеют также положительные СО. Хлор вытесняет Br₂ и I₂ из галогенидов."], ["h", "Галогеноводороды"], ["p", "HF слабая кислота, HCl, HBr, HI сильные в воде. Восстановительная способность галогенидов растёт от Cl⁻ к I⁻. AgCl белый, AgBr кремовый, AgI жёлтый осадки."], ["h", "Кислородные соединения хлора"], ["p", "HClO и гипохлориты обладают окислительным действием; хлораты и перхлораты содержат более высокие СО. Хлор в воде и щёлочи диспропорционирует."], ["f", "Cl₂ + H₂O ⇌ HCl + HClO"], ["f", "Cl₂ + 2KBr → 2KCl + Br₂"], ["f", "Ag⁺ + Cl⁻ → AgCl↓"], ["h", "Дополнительные примеры уравнений"], ["f", "Cl₂ + H₂O ⇄ HCl + HClO"], ["h", "Галогены и их соединения"], ["p", "Окислительная способность уменьшается от F₂ к I₂. Хлор вытесняет бром и иод из их солей. Хлорная вода содержит HCl и HClO; щёлочь даёт разные продукты в зависимости от температуры."], ["f", "Cl₂ + 2KBr → 2KCl + Br₂"], ["f", "Cl₂ + H₂O ⇌ HCl + HClO"], ["f", "Cl₂ + 2NaOH → NaCl + NaClO + H₂O (холод)"], ["f", "3Cl₂ + 6KOH → 5KCl + KClO₃ + 3H₂O (нагревание)"], ["f", "Ag⁺ + Br⁻ → AgBr↓"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Галогены» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 18, с. 87–100 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN19", "s": "chem", "title": "Подгруппа кислорода", "min": 10, "body": [["h", "Кислород и сера"], ["p", "O₂ и O₃ — аллотропы; озон сильнее окисляет. Сера образует S₈, проявляет СО −2, 0, +4, +6; взаимодействует с металлами, кислородом и водородом."], ["h", "H₂S и сульфиды"], ["p", "Сероводород — слабая двухосновная кислота и восстановитель; многие сульфиды нерастворимы. Сильная кислота вытесняет H₂S из ряда сульфидов."], ["h", "SO₂ и сульфиты"], ["p", "SO₂ кислотный оксид; H₂SO₃ неустойчива, сульфиты окисляются до сульфатов и выделяют SO₂ при подкислении."], ["h", "SO₃, H₂SO₄ и сульфаты"], ["p", "SO₃ образует серную кислоту; разбавленная проявляет обычные кислотные свойства, концентрированная — окислительные и водоотнимающие. BaSO₄ — белый осадок."], ["f", "2SO₂ + O₂ ⇌ 2SO₃"], ["f", "Na₂SO₃ + 2HCl → 2NaCl + SO₂↑ + H₂O"], ["f", "Ba²⁺ + SO₄²⁻ → BaSO₄↓"], ["h", "Дополнительные примеры уравнений"], ["f", "2SO₂ + O₂ ⇄ 2SO₃"], ["f", "SO₃ + H₂O → H₂SO₄"], ["f", "H₂S + CuSO₄ → CuS↓ + H₂SO₄"], ["h", "Кислород, сера и их соединения"], ["p", "О₂ и O₃ — аллотропные формы кислорода. У серы важны степени −2, 0, +4, +6. Сероводород — восстановитель, SO₂ проявляет двойственные ОВ-свойства, концентрированная серная кислота — окислитель."], ["f", "2SO₂ + O₂ ⇌ 2SO₃ (V₂O₅, t)"], ["f", "SO₂ + Br₂ + 2H₂O → H₂SO₄ + 2HBr"], ["f", "2H₂S + O₂ → 2S↓ + 2H₂O (недостаток O₂)"], ["f", "Ba²⁺ + SO₄²⁻ → BaSO₄↓"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Подгруппа кислорода» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 19, с. 101–120 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN20", "s": "chem", "title": "Подгруппа азота", "min": 10, "body": [["h", "Азот и аммиак"], ["p", "N₂ имеет тройную связь, малоактивен при обычных условиях. NH₃ — полярный газ, основание и восстановитель; соли NH₄⁺ при действии щёлочи выделяют NH₃."], ["h", "Оксиды и кислоты азота"], ["p", "N₂O и NO несолеобразующие; N₂O₃ соответствует HNO₂, N₂O₅ — HNO₃, NO₂ в воде даёт кислоты. HNO₃ сильная кислота и окислитель, продукты восстановления зависят от металла и концентрации."], ["h", "Нитраты"], ["p", "При нагревании нитраты щелочных металлов (кроме Li) обычно дают нитриты, большинство других — оксиды; AgNO₃ даёт металл."], ["h", "Фосфор и соединения"], ["p", "Белый, красный и чёрный фосфор различаются строением; PH₃ — гидрид, P₂O₃/P₄O₆ и P₂O₅/P₄O₁₀ — кислотные оксиды. H₃PO₄ трёхосновная, H₃PO₃ двухосновная, H₃PO₂ одноосновная (связи P–H не диссоциируют как OH)."], ["f", "NH₄⁺ + OH⁻ → NH₃↑ + H₂O"], ["f", "2NO + O₂ → 2NO₂"], ["f", "2KNO₃ → 2KNO₂ + O₂↑"], ["f", "P₂O₅ + 3H₂O → 2H₃PO₄"], ["h", "Дополнительные примеры уравнений"], ["f", "NH₃ + HCl → NH₄Cl"], ["f", "4NH₃ + 5O₂ → 4NO + 6H₂O"], ["h", "Азот, фосфор и их соединения"], ["p", "N₂ устойчив из-за тройной связи. Аммиак проявляет основные и восстановительные свойства. Азотная кислота окисляет металлы без обычного выделения H₂. Нитраты разлагаются по-разному в зависимости от металла. Фосфор образует оксиды и многоосновные кислоты."], ["f", "N₂ + 3H₂ ⇌ 2NH₃ (Fe, t, p)"], ["f", "NH₃ + HCl → NH₄Cl"], ["f", "4NH₃ + 5O₂ → 4NO + 6H₂O (Pt, t)"], ["f", "2NO + O₂ → 2NO₂"], ["f", "Cu + 4HNO₃(конц.) → Cu(NO₃)₂ + 2NO₂↑ + 2H₂O"], ["f", "2KNO₃ → 2KNO₂ + O₂↑ (t)"], ["f", "P₄O₁₀ + 6H₂O → 4H₃PO₄"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Подгруппа азота» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 20, с. 121–147 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN21", "s": "chem", "title": "Подгруппа углерода", "min": 10, "body": [["h", "Углерод"], ["p", "Алмаз, графит и другие формы отличаются связностью атомов. C восстанавливает ряд оксидов; CO — несолеобразующий оксид и восстановитель, CO₂ — кислотный оксид."], ["h", "Карбонаты"], ["p", "H₂CO₃ слабая и неустойчивая; карбонаты и гидрокарбонаты переходят друг в друга при изменении количества CO₂. Карбонаты многих металлов разлагаются при нагревании."], ["h", "Кремний"], ["p", "Si имеет атомную решётку; SiO₂ — кислотный оксид, с водой не реагирует, взаимодействует со щёлочами и HF. Силикаты при подкислении дают малорастворимую кремниевую кислоту."], ["f", "CO₂ + Ca(OH)₂ → CaCO₃↓ + H₂O"], ["f", "CaCO₃ + CO₂ + H₂O → Ca(HCO₃)₂"], ["f", "SiO₂ + 2NaOH → Na₂SiO₃ + H₂O"], ["f", "Na₂SiO₃ + 2HCl → H₂SiO₃↓ + 2NaCl"], ["h", "Дополнительные примеры уравнений"], ["f", "CO + CuO → Cu + CO₂"], ["f", "CaCO₃ + 2HCl → CaCl₂ + CO₂↑ + H₂O"], ["h", "Углерод и кремний"], ["p", "Углерод образует CO и CO₂; CO — восстановитель и токсичный газ. Для CO₂ характерны реакции кислотного оксида. Кремнезём имеет атомную решётку и реагирует с HF и щёлочами."], ["f", "Fe₂O₃ + 3CO → 2Fe + 3CO₂ (t)"], ["f", "CO₂ + Ca(OH)₂ → CaCO₃↓ + H₂O"], ["f", "CaCO₃ + CO₂ + H₂O → Ca(HCO₃)₂"], ["f", "SiO₂ + 4HF → SiF₄↑ + 2H₂O"], ["f", "Na₂SiO₃ + 2HCl → H₂SiO₃↓ + 2NaCl"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Подгруппа углерода» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 21, с. 148–164 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN22", "s": "chem", "title": "Общие свойства металлов", "min": 10, "body": [["h", "Строение и свойства"], ["p", "Металлическая связь объясняет электропроводность, пластичность и блеск. Металлы отдают электроны; активность в растворах оценивают по ряду напряжений с учётом пассивации и реакции с водой."], ["h", "Получение"], ["p", "Активные металлы получают электролизом расплавов, менее активные — восстановлением соединений или электролизом растворов. Коррозия связана с окислением металла; покрытия и протекторы уменьшают её."], ["f", "Zn + Cu²⁺ → Zn²⁺ + Cu"], ["f", "Fe₂O₃ + 3CO → 2Fe + 3CO₂"], ["h", "Дополнительные примеры уравнений"], ["f", "Fe + CuSO₄ → FeSO₄ + Cu"], ["f", "2Mg + O₂ → 2MgO"], ["h", "Активность, коррозия и получение"], ["p", "Металлическая связь объясняет проводимость и пластичность. Способ получения зависит от активности: электролиз расплавов, восстановление оксидов, разложение соединений. Коррозия включает окисление металла."], ["f", "Zn + CuSO₄ → ZnSO₄ + Cu"], ["f", "2Al + Fe₂O₃ → Al₂O₃ + 2Fe (t)"], ["f", "2Mg + O₂ → 2MgO"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Общие свойства металлов» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 22, с. 165–174 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN23", "s": "chem", "title": "Алюминий и его соединения", "min": 10, "body": [["h", "Алюминий"], ["p", "Конфигурация внешнего слоя 3s²3p¹, характерная СО +3. Оксидная плёнка препятствует реакции с водой и обусловливает пассивацию; Al сильный восстановитель."], ["h", "Оксид и гидроксид"], ["p", "Al₂O₃ тугоплавок, Al(OH)₃ белый осадок; оба амфотерны. Соли Al³⁺ гидролизуются с кислой реакцией среды."], ["f", "2Al + Fe₂O₃ → Al₂O₃ + 2Fe"], ["f", "2Al + 2NaOH + 6H₂O → 2Na[Al(OH)₄] + 3H₂↑"], ["f", "AlCl₃ + 3NaOH → Al(OH)₃↓ + 3NaCl"], ["h", "Дополнительные примеры уравнений"], ["f", "Al(OH)₃ + NaOH → Na[Al(OH)₄]"], ["h", "Алюминий: пассивация и амфотерность"], ["p", "Защитная оксидная плёнка препятствует реакции с водой. В кислотах и щёлочах при разрушении плёнки алюминий растворяется. Холодные концентрированные HNO₃ и H₂SO₄ пассивируют металл."], ["f", "2Al + 6HCl → 2AlCl₃ + 3H₂↑"], ["f", "2Al + 2NaOH + 6H₂O → 2Na[Al(OH)₄] + 3H₂↑"], ["f", "AlCl₃ + 3NaOH → Al(OH)₃↓ + 3NaCl"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Алюминий и его соединения» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 23, с. 175–183 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN24", "s": "chem", "title": "Щелочные и щелочноземельные металлы", "min": 10, "body": [["h", "Щелочные металлы"], ["p", "ns¹, СО +1, активность растёт вниз группы. Реагируют с водой и галогенами, образуют оксиды, пероксиды или надпероксиды в зависимости от металла. Гидроксиды сильные основания, соли обычно растворимы."], ["h", "Группа II"], ["p", "ns², СО +2; Be амфотерен, Mg менее активен, Ca/Sr/Ba реагируют с водой. Оксиды и гидроксиды Mg и Ca основные; растворимость гидроксидов увеличивается вниз группы."], ["h", "Жёсткость"], ["p", "Временная обусловлена гидрокарбонатами Ca/Mg, устраняется кипячением; постоянная связана с другими солями, устраняется осаждением или ионным обменом."], ["f", "2K + 2H₂O → 2KOH + H₂↑"], ["f", "Ca(HCO₃)₂ → CaCO₃↓ + CO₂↑ + H₂O"], ["f", "CaCl₂ + Na₂CO₃ → CaCO₃↓ + 2NaCl"], ["h", "Дополнительные примеры уравнений"], ["f", "CaO + H₂O → Ca(OH)₂"], ["h", "Щелочные и щелочноземельные металлы"], ["p", "Щелочные металлы имеют степень окисления +1, щелочноземельные — +2. Взаимодействие с кислородом может давать оксиды, пероксиды и надпероксиды. Растворимость гидроксидов щелочноземельных металлов возрастает вниз группы."], ["f", "2Na + O₂ → Na₂O₂"], ["f", "Ca + 2H₂O → Ca(OH)₂ + H₂↑"], ["f", "2Na₂O₂ + 2H₂O → 4NaOH + O₂↑ (суммарно)"], ["f", "CaCO₃ → CaO + CO₂↑ (t)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Щелочные и щелочноземельные металлы» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 24, с. 184–197 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN25", "s": "chem", "title": "Общая характеристика d-элементов", "min": 10, "body": [["h", "Строение"], ["p", "У d-элементов заполняется предвнешний d-подуровень. При образовании катионов сначала удаляются внешние s-электроны. Часто встречаются переменные СО, окрашенные ионы, комплексообразование и каталитические свойства."], ["h", "Оксиды и гидроксиды"], ["p", "С ростом СО одного элемента обычно усиливаются кислотные и окислительные свойства: низшие оксиды основные, промежуточные амфотерные, высшие кислотные. Это тенденция, а не универсальное правило."], ["p", "Пример: CrO — основной, Cr₂O₃ — амфотерный, CrO₃ — кислотный."], ["h", "Дополнительные примеры уравнений"], ["f", "Fe²⁺ → Fe³⁺ + e⁻"], ["f", "Cu²⁺ + 2OH⁻ → Cu(OH)₂↓"], ["h", "Особенности переходных элементов"], ["p", "Неполностью заполненные d-подуровни связаны с переменными степенями окисления, комплексообразованием и окраской многих соединений. Высшие оксиды обычно более кислотные."], ["f", "Fe²⁺ → Fe³⁺ + e⁻"], ["f", "MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Общая характеристика d-элементов» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 25, с. 198–199 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN26", "s": "chem", "title": "Хром и его соединения", "min": 10, "body": [["h", "Хром"], ["p", "Cr имеет конфигурацию [Ar]3d⁵4s¹; важны +2, +3, +6. Cr(II) восстановитель, Cr(III) устойчив и амфотерен, Cr(VI) сильный окислитель."], ["h", "Соединения"], ["p", "Cr(OH)₃ серо-зелёный осадок; растворяется в кислоте и избытке щёлочи. Хроматы жёлтые, дихроматы оранжевые; равновесие зависит от pH."], ["f", "2CrO₄²⁻ + 2H⁺ ⇌ Cr₂O₇²⁻ + H₂O"], ["f", "Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O"], ["f", "Cr(OH)₃ + 3H⁺ → Cr³⁺ + 3H₂O"], ["h", "Дополнительные примеры уравнений"], ["f", "2CrO₄²⁻ + 2H⁺ ⇄ Cr₂O₇²⁻ + H₂O"], ["f", "Cr³⁺ + 3OH⁻ → Cr(OH)₃↓"], ["h", "Cr(II), Cr(III), Cr(VI)"], ["p", "Cr(II) легко окисляется; Cr(III) образует амфотерный гидроксид; Cr(VI) в хроматах и дихроматах — сильный окислитель. Цвет хромата жёлтый, дихромата оранжевый."], ["f", "2CrO₄²⁻ + 2H⁺ ⇌ Cr₂O₇²⁻ + H₂O"], ["f", "Cr(OH)₃ + 3H⁺ → Cr³⁺ + 3H₂O"], ["f", "Cr₂O₇²⁻ + 6Fe²⁺ + 14H⁺ → 2Cr³⁺ + 6Fe³⁺ + 7H₂O"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Хром и его соединения» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 26, с. 200–213 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN27", "s": "chem", "title": "Марганец и его соединения", "min": 10, "body": [["h", "Марганец"], ["p", "Характерны +2, +4, +6, +7. Mn²⁺ обычно бледно-розовый, MnO₂ бурый/чёрный, манганат зелёный, перманганат фиолетовый. Низшие соединения более основные, высшие — кислотные."], ["h", "Зависимость от среды"], ["p", "Перманганат восстанавливается до Mn²⁺ в кислой среде, MnO₂ в нейтральной или слабощелочной, MnO₄²⁻ в сильнощелочной."], ["f", "MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O"], ["f", "MnO₄⁻ + 2H₂O + 3e⁻ → MnO₂↓ + 4OH⁻"], ["f", "MnO₄⁻ + e⁻ → MnO₄²⁻"], ["h", "Марганец и влияние среды"], ["p", "Перманганат в кислой среде даёт Mn²⁺, в нейтральной обычно MnO₂, в сильнощелочной — MnO₄²⁻. Соединения Mn(II) могут окисляться."], ["f", "MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O"], ["f", "MnO₄⁻ + 2H₂O + 3e⁻ → MnO₂↓ + 4OH⁻"], ["f", "MnO₄⁻ + e⁻ → MnO₄²⁻"], ["f", "2KMnO₄ → K₂MnO₄ + MnO₂ + O₂↑ (t)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Марганец и его соединения» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 27, с. 214–223 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN28", "s": "chem", "title": "Железо и его соединения", "min": 10, "body": [["h", "Железо"], ["p", "Fe — металл с характерными СО +2 и +3; Fe₃O₄ смешанный оксид. Fe²⁺ легко окисляется, Fe³⁺ способен восстанавливаться. Железо пассивируется некоторыми концентрированными кислотами."], ["h", "Гидроксиды и качественные реакции"], ["p", "Fe(OH)₂ светлый зеленоватый осадок, на воздухе буреет; Fe(OH)₃ бурый. Роданид с Fe³⁺ образует красноокрашенные комплексы. Ферраты содержат Fe(VI)."], ["f", "Fe + 2HCl → FeCl₂ + H₂↑"], ["f", "4Fe(OH)₂ + O₂ + 2H₂O → 4Fe(OH)₃"], ["f", "Fe³⁺ + 3OH⁻ → Fe(OH)₃↓"], ["h", "Fe(II) и Fe(III)"], ["p", "Железо с неокисляющими кислотами даёт соли Fe(II). Fe(OH)₂ легко окисляется воздухом до Fe(OH)₃. Fe³⁺ обнаруживают по окраске с тиоцианат-ионами."], ["f", "Fe + 2HCl → FeCl₂ + H₂↑"], ["f", "2FeCl₂ + Cl₂ → 2FeCl₃"], ["f", "4Fe(OH)₂ + O₂ + 2H₂O → 4Fe(OH)₃"], ["f", "Fe³⁺ + SCN⁻ ⇌ [Fe(SCN)]²⁺"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Железо и его соединения» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 28, с. 224–236 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN29", "s": "chem", "title": "Медь и её соединения", "min": 10, "body": [["h", "Медь"], ["p", "Cu расположена после H; из обычной разбавленной HCl водород не вытесняет. Реагирует с окислительными кислотами. Cu(I) и Cu(II) различаются устойчивостью; Cu₂O красный, CuO чёрный."], ["h", "Соединения"], ["p", "Cu(OH)₂ голубой осадок, при нагревании даёт CuO. Ионы Cu²⁺ образуют интенсивно-синий аммиачный комплекс; безводный CuSO₄ белый, пентагидрат голубой."], ["f", "2Cu + O₂ → 2CuO"], ["f", "Cu²⁺ + 2OH⁻ → Cu(OH)₂↓"], ["f", "Cu(OH)₂ → CuO + H₂O"], ["h", "Дополнительные примеры уравнений"], ["f", "CuSO₄ + 2NaOH → Cu(OH)₂↓ + Na₂SO₄"], ["h", "Cu(I) и Cu(II)"], ["p", "Медь не вытесняет водород из разбавленной HCl. Реагирует с кислотами-окислителями. Cu(OH)₂ голубой, CuO чёрный, Cu₂O красный. Аммиак образует интенсивно-синий комплекс Cu(II)."], ["f", "2Cu + O₂ → 2CuO (t)"], ["f", "3Cu + 8HNO₃(разб.) → 3Cu(NO₃)₂ + 2NO↑ + 4H₂O"], ["f", "Cu(OH)₂ → CuO + H₂O (t)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Медь и её соединения» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 29, с. 237–242 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN30", "s": "chem", "title": "Серебро и его соединения", "min": 10, "body": [["h", "Серебро"], ["p", "Ag благородный металл, типичная СО +1. Реагирует с азотной кислотой; Ag₂O образуется при действии щёлочи на Ag⁺ вместо неустойчивого AgOH."], ["h", "Соединения"], ["p", "AgCl, AgBr, AgI различаются цветом и растворимостью в аммиаке; AgCl растворяется вследствие образования комплекса. Нитрат серебра разлагается при нагревании."], ["f", "2Ag⁺ + 2OH⁻ → Ag₂O↓ + H₂O"], ["f", "AgCl + 2NH₃ ⇌ [Ag(NH₃)₂]⁺ + Cl⁻"], ["f", "2AgNO₃ → 2Ag + 2NO₂↑ + O₂↑"], ["h", "Дополнительные примеры уравнений"], ["f", "Ag⁺ + Cl⁻ → AgCl↓"], ["h", "Серебро и малорастворимые соли"], ["p", "AgCl — белый осадок, растворимый в аммиаке за счёт комплексообразования. Серебро реагирует с азотной кислотой; AgNO₃ при нагревании разлагается до металла."], ["f", "Ag + 2HNO₃(конц.) → AgNO₃ + NO₂↑ + H₂O"], ["f", "2AgNO₃ → 2Ag + 2NO₂↑ + O₂↑ (t)"], ["f", "AgCl + 2NH₃ ⇌ [Ag(NH₃)₂]⁺ + Cl⁻"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Серебро и его соединения» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 30, с. 243–251 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN31", "s": "chem", "title": "Цинк и его соединения", "min": 10, "body": [["h", "Подгруппа цинка"], ["p", "Zn, Cd, Hg имеют заполненный d-подуровень; для Zn характерна +2. Цинк активнее водорода, образует амфотерные оксид и гидроксид, комплексы с OH⁻ и NH₃."], ["h", "Свойства"], ["p", "Zn²⁺ даёт белый Zn(OH)₂; в кислоте и избытке щёлочи осадок растворяется. ZnS малорастворим."], ["f", "Zn + 2HCl → ZnCl₂ + H₂↑"], ["f", "Zn(OH)₂ + 2OH⁻ → [Zn(OH)₄]²⁻"], ["f", "Zn²⁺ + S²⁻ → ZnS↓"], ["h", "Дополнительные примеры уравнений"], ["f", "ZnO + 2HCl → ZnCl₂ + H₂O"], ["h", "Цинк и амфотерные соединения"], ["p", "Цинк растворяется в кислотах и растворах сильных щелочей. ZnO и Zn(OH)₂ амфотерны. Соли Zn²⁺ обычно бесцветные."], ["f", "Zn + 2NaOH + 2H₂O → Na₂[Zn(OH)₄] + H₂↑"], ["f", "ZnSO₄ + 2NaOH → Zn(OH)₂↓ + Na₂SO₄"], ["f", "Zn(OH)₂ + 2NaOH → Na₂[Zn(OH)₄]"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Цинк и его соединения» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 31, с. 252–255 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookN32", "s": "chem", "title": "Ртуть и её соединения", "min": 10, "body": [["h", "Ртуть"], ["p", "Жидкий металл при комнатной температуре, соединения и пары токсичны. Характерны Hg(II) и димерный катион Hg₂²⁺ (Hg(I)); металл малоактивен."], ["h", "Соединения"], ["p", "HgO разлагается при нагревании; HgS малорастворим; Hg₂Cl₂ и HgCl₂ различаются составом и свойствами. Изучать реакции теоретически, не проводить опыты с ртутью."], ["f", "2HgO → 2Hg + O₂↑"], ["f", "Hg²⁺ + S²⁻ → HgS↓"], ["h", "Ртуть(I) и ртуть(II)"], ["p", "Ртуть — жидкий металл при обычных условиях; соединения и пары токсичны. Для Hg(I) характерен двухатомный катион Hg₂²⁺."], ["f", "Hg₂²⁺ + 2Cl⁻ → Hg₂Cl₂↓"], ["f", "2HgO → 2Hg + O₂↑ (t)"], ["h", "Самопроверка"], ["ul", ["Объясните ключевые закономерности темы «Ртуть и её соединения» без подсказки.", "Закройте правую часть каждого уравнения и восстановите продукты, коэффициенты и условия.", "Сопоставьте свои ответы с примерами и выполните упражнения соответствующего раздела пособия."]], ["h", "Первоисточник"], ["p", "И. И. и Н. С. Новошинские. Неорганическая химия, 2017. § 32, с. 256–263 (включая упражнения и тесты, если они есть). Авторский учебный конспект; не дословная копия."]], "book": "Неорганическая химия, 2017"}, {"id": "bookO1", "s": "chem", "title": "Алканы", "min": 14, "body": [["h", "Введение и строение"], ["p", "Алканы — предельные алифатические углеводороды. В их молекулах атомы углерода соединены только одинарными σ-связями. Общая формула гомологического ряда: CₙH₂ₙ₊₂. Для атомов углерода характерна sp³-гибридизация, длина связи C–C около 0,154 нм, валентный угол около 109,5°."], ["f", "Общая формула: CₙH₂ₙ₊₂; метан CH₄; этан C₂H₆; пропан C₃H₈"], ["h", "Гомологи, радикалы и классификация атомов углерода"], ["p", "Гомологи отличаются друг от друга на группу CH₂. При отрыве атома водорода от алкана образуется алкильный радикал: CH₃–, C₂H₅– и т. д. В молекулах различают первичные, вторичные, третичные и четвертичные атомы углерода — это важно для понимания реакционной способности в реакциях замещения."], ["h", "Изомерия и номенклатура"], ["p", "Для алканов характерна структурная изомерия углеродного скелета. Нумеруют самую длинную цепь так, чтобы заместители получили наименьшие номера. Одинаковые заместители объединяют приставками ди-, три-, тетра-. Названия заместителей перечисляют в алфавитном порядке."], ["ul", ["н-бутан и 2-метилпропан — первые изомеры алканов", "у радикалов возможна изомерия строения скелета и положения неспаренного электрона", "в названиях учитывают главную цепь, номера заместителей и их кратность"]], ["h", "Физические свойства"], ["p", "При обычных условиях CH₄–C₄H₁₀ — газы, C₅H₁₂–C₁₅H₃₂ — жидкости, более тяжёлые представители — твёрдые вещества. Алканы неполярны, в воде практически не растворяются, но хорошо растворяются в неполярных органических растворителях. С увеличением молекулярной массы температуры кипения и плавления возрастают; разветвление цепи обычно понижает температуру кипения."], ["h", "Химические свойства: реакции радикального замещения"], ["p", "Главные реакции алканов — реакции замещения по связи C–H. В первую очередь обычно замещается атом водорода при третичном атоме углерода, затем при вторичном и в последнюю очередь при первичном."], ["r", ["Галогенирование", "CH₄ + Cl₂ → CH₃Cl + HCl (hν); при избытке Cl₂ возможны CH₂Cl₂, CHCl₃ и CCl₄"]], ["r", ["Галогенирование пропана", "CH₃–CH₂–CH₃ + Br₂ → CH₃–CHBr–CH₃ + HBr (hν, преимущественно 2-бромпропан)"]], ["r", ["Нитрование (реакция Коновалова)", "(CH₃)₃CH + HNO₃ → (CH₃)₃CNO₂ + H₂O (t, p)"]], ["h", "Химические свойства: окисление и горение"], ["p", "При полном горении алканы превращаются в CO₂ и H₂O. При недостатке кислорода могут образовываться CO или C. При каталитическом окислении метана в зависимости от условий получают метанол, формальдегид и муравьиную кислоту."], ["r", ["Полное горение", "CₙH₂ₙ₊₂ + (3n+1)/2 O₂ → nCO₂ + (n+1)H₂O"]], ["r", ["Каталитическое окисление метана", "Продукты каталитического окисления метана зависят от условий: CH₃OH, HCHO или HCOOH"]], ["p", "Алканы в обычных условиях не обесцвечивают бромную воду и раствор перманганата калия."], ["h", "Термические превращения алканов"], ["r", ["Крекинг", "C₉H₂₀ → C₄H₁₀ + C₅H₁₀; C₉H₂₀ → C₅H₁₂ + C₄H₈"]], ["r", ["Дегидрирование", "C₂H₆ → C₂H₄ + H₂ (t, кат.)"]], ["r", ["Пиролиз", "2CH₄ → HC≡CH + 3H₂ (высокая t)"]], ["r", ["Изомеризация", "CH₃–CH₂–CH₂–CH₃ → CH₃–CH(CH₃)–CH₃ (t, AlCl₃)"]], ["r", ["Дегидроциклизация", "C₆H₁₄ → C₆H₆ + 4H₂"]], ["r", ["Конверсия метана", "CH₄ + H₂O → CO + 3H₂; CH₄ + CO₂ → 2CO + 2H₂"]], ["h", "Получение"], ["ul", ["в промышленности — из природного газа, попутных газов и нефти", "реакция Фишера–Тропша: nCO + (2n+1)H₂ → CₙH₂ₙ₊₂ + nH₂O", "гидролиз карбида алюминия: Al₄C₃ + 12H₂O → 3CH₄ + 4Al(OH)₃", "реакция Дюма: CH₃COONa + NaOH → CH₄ + Na₂CO₃", "гидрирование алкенов и алкинов", "реакция Вюрца: 2R–Hal + 2Na → R–R + 2NaHal", "реакция Кольбе — электролиз солей карбоновых кислот"]], ["h", "Дополнительные превращения и синтез"], ["p", "При хлорировании метана последовательно образуются четыре хлорпроизводных. Иодирование практически не идёт. Синтез Гриньяра и электролиз Кольбе — дополнительные способы построения углеродной цепи."], ["f", "CH₃Cl + Cl₂ → CH₂Cl₂ + HCl (hν)"], ["f", "CH₂Cl₂ + Cl₂ → CHCl₃ + HCl (hν)"], ["f", "CHCl₃ + Cl₂ → CCl₄ + HCl (hν)"], ["f", "2CH₄ + O₂ → 2CH₃OH (кат.)"], ["f", "CH₄ + O₂ → HCHO + H₂O (кат.)"], ["f", "2CH₄ + 3O₂ → 2HCOOH + 2H₂O (кат.)"], ["f", "2C₄H₁₀ + 5O₂ → 4CH₃COOH + 2H₂O (MnO₂, t)"], ["f", "CH₃Cl + Mg → CH₃MgCl (эфир)"], ["f", "CH₃MgCl + H₂O → CH₄ + MgOHCl"], ["f", "2CH₃COONa + 2H₂O → C₂H₆ + 2CO₂ + H₂ + 2NaOH (электролиз)"], ["h", "Первоисточник"], ["p", "Сделано по структуре § 1 учебника Новошинских: строение, изомерия, номенклатура, физические свойства, химические свойства и способы получения. Формулировки переработаны в авторский конспект."]], "book": "Органическая химия, 2018", "illustration": "bookO1"}, {"id": "bookO2", "s": "chem", "title": "Алкены", "min": 15, "body": [["h", "Введение и общая характеристика"], ["p", "Алкены — непредельные алифатические углеводороды, содержащие одну двойную связь C=C. Общая формула ациклических алкенов: CₙH₂ₙ, n ≥ 2. Для атомов углерода у двойной связи характерна sp²-гибридизация: одна σ-связь и одна π-связь образуют двойную связь, поэтому вокруг неё ограничено вращение."], ["f", "Этен CH₂=CH₂; пропен CH₃–CH=CH₂; общая формула: CₙH₂ₙ"], ["h", "Введение в строение и изомерию"], ["p", "π-Связь менее прочна, чем σ-связь, поэтому алкены легко вступают в реакции присоединения. Для алкенов характерны изомерия углеродного скелета, положения двойной связи и геометрическая цис-/транс-изомерия у соединений, где при каждом атоме углерода двойной связи находятся разные заместители."], ["ul", ["пример изомерии положения: бут-1-ен и бут-2-ен", "пример геометрической изомерии: цис-бут-2-ен и транс-бут-2-ен", "вращение вокруг двойной связи затруднено, поэтому геометрическая изомерия устойчива"]], ["h", "Номенклатура"], ["p", "За основу берут самую длинную цепь, содержащую двойную связь. Нумерацию ведут от конца, ближайшего к двойной связи. Суффикс -ан заменяют на -ен, а номер двойной связи ставят перед названием или включают в него: бут-1-ен, пент-2-ен."], ["h", "Физические свойства"], ["p", "Низшие алкены — газы, средние — жидкости, высшие — твёрдые вещества. Они плохо растворимы в воде, хорошо растворяются в органических растворителях. Температуры кипения растут с увеличением молекулярной массы."], ["h", "Химические свойства: реакции присоединения по двойной связи"], ["p", "Основной тип реакций — электрофильное присоединение по двойной связи. При этом π-связь разрывается, а σ-каркас молекулы сохраняется."], ["r", ["Гидрирование", "CH₂=CH₂ + H₂ → CH₃–CH₃ (Ni, Pt, Pd)"]], ["r", ["Галогенирование", "CH₂=CH₂ + Br₂ → BrCH₂–CH₂Br"]], ["r", ["Гидрогалогенирование", "CH₃–CH=CH₂ + HCl → CH₃–CHCl–CH₃"]], ["p", "Для несимметричных алкенов действует правило Марковникова: водород присоединяется к более гидрогенизированному атому углерода, а остаток кислоты — к менее гидрогенизированному. Для HBr в присутствии пероксидов возможен анти-Марковниковский путь."], ["r", ["Гидратация", "CH₂=CH₂ + H₂O → CH₃–CH₂OH (H⁺, t)"]], ["r", ["Полимеризация", "nCH₂=CH₂ → (–CH₂–CH₂–)ₙ"]], ["h", "Окисление алкенов"], ["p", "Алкены легко окисляются. Разбавленный холодный раствор KMnO₄ окисляет их до гликолей; раствор перманганата обесцвечивается. При жёстком окислении происходит разрыв углеродной цепи и образуются карбоновые кислоты, кетоны или CO₂ в зависимости от строения алкена."], ["r", ["Мягкое окисление", "3CH₂=CH₂ + 2KMnO₄ + 4H₂O → 3HO–CH₂–CH₂–OH + 2MnO₂ + 2KOH"]], ["r", ["Горение", "CₙH₂ₙ + 3n/2 O₂ → nCO₂ + nH₂O"]], ["h", "Качественные реакции на двойную связь"], ["ul", ["обесцвечивание бромной воды", "обесцвечивание раствора KMnO₄ с образованием бурого MnO₂ при мягком окислении"]], ["h", "Способы получения"], ["ul", ["дегидрирование алканов: C₂H₆ → C₂H₄ + H₂", "дегидратация спиртов: C₂H₅OH → CH₂=CH₂ + H₂O", "дегидрогалогенирование галогеналканов спиртовым раствором щёлочи", "дегалогенирование дигалогеналканов цинком", "крекинг алканов и нефтепродуктов"]], ["h", "Что обязательно помнить по учебнику"], ["ul", ["строение двойной связи и sp²-гибридизацию", "правило Марковникова", "качественные реакции на кратную связь", "основные способы получения: дегидрирование, дегидратация, отщепление HX"]], ["h", "Уточнения к строению и химическим свойствам (§ 2, с. 18–24)"], ["p", "Длина C=C около 0,134 нм, угол 120°. Межклассовые изомеры алкенов — циклоалканы. Лёгкость присоединения HX возрастает от HF к HI. Пероксидный эффект характерен для HBr. Электроноакцепторные группы могут менять направление присоединения; в пособии приведены производные с CF₃."], ["f", "CF₃–CH=CH₂ + HCl → CF₃–CH₂–CH₂Cl (пример из пособия)"], ["f", "CH₃–CH=CH₂ + HBr → CH₃–CH₂–CH₂Br (пероксиды)"], ["f", "2C₂H₄ + O₂ → 2C₂H₄O (Ag, t, p; эпоксиэтан)"], ["f", "5CH₃–CH=CH–CH₃ + 8KMnO₄ + 12H₂SO₄ → 10CH₃COOH + 8MnSO₄ + 4K₂SO₄ + 12H₂O (t)"], ["f", "CH₂=CH–CH₂–CH₃ + 2KMnO₄ + 3H₂SO₄ → CO₂ + C₂H₅COOH + 2MnSO₄ + K₂SO₄ + 4H₂O (t)"], ["f", "CH₃–CH=CH₂ + Cl₂ → ClCH₂–CH=CH₂ + HCl (аллильное замещение)"], ["f", "CH₃–CHBr–CH₂–CH₃ + KOH → CH₃–CH=CH–CH₃ + KBr + H₂O (спирт, t; правило Зайцева)"], ["f", "CH₃–CHBr–CH₂Br + Zn → CH₃–CH=CH₂ + ZnBr₂ (t)"], ["h", "Первоисточник"], ["p", "Конспект отражает структуру § 2: строение, изомерия, номенклатура, физические свойства, химические свойства и способы получения; реакции даны в учебной, а не дословной форме."]], "book": "Органическая химия, 2018", "illustration": "bookO2"}, {"id": "bookO3", "s": "chem", "title": "Алкадиены", "min": 12, "body": [["h", "Введение и классификация"], ["p", "Алкадиены — непредельные углеводороды с двумя двойными связями. Общая формула ациклических представителей: CₙH₂ₙ₋₂. Выделяют кумулированные диены (=C=), сопряжённые (–C=C–C=C–) и изолированные, в которых двойные связи разделены двумя и более одинарными связями."], ["f", "Бутадиен-1,3: CH₂=CH–CH=CH₂; изопрен: CH₂=C(CH₃)–CH=CH₂"], ["h", "Строение и значение сопряжения"], ["p", "Наибольшее значение в школьном курсе имеют сопряжённые диены. В них π-электроны частично делокализованы, поэтому такие соединения более устойчивы и проявляют особую реакционную способность: для них возможны 1,2- и 1,4-присоединение."], ["h", "Изомерия и номенклатура"], ["p", "Для алкадиенов характерны изомерия скелета, положения двойных связей и геометрическая изомерия. В названии указывают положение обеих двойных связей: бутадиен-1,3, пентадиен-1,4 и т. д."], ["h", "Физические свойства"], ["p", "Низшие алкадиены — газы или летучие жидкости, плохо растворимы в воде, хорошо — в органических растворителях."], ["h", "Химические свойства"], ["r", ["Гидрирование", "CH₂=CH–CH=CH₂ + 2H₂ → CH₃–CH₂–CH₂–CH₃"]], ["r", ["Галогенирование, 1,2-присоединение", "CH₂=CH–CH=CH₂ + Br₂ → CH₂Br–CHBr–CH=CH₂"]], ["r", ["Галогенирование, 1,4-присоединение", "CH₂=CH–CH=CH₂ + Br₂ → CH₂Br–CH=CH–CH₂Br"]], ["r", ["Гидрогалогенирование", "CH₂=CH–CH=CH₂ + HBr → смесь 1,2- и 1,4-продуктов"]], ["r", ["Полимеризация", "nCH₂=CH–CH=CH₂ → каучукоподобный полимер"]], ["p", "На основе бутадиена и изопрена получают синтетические каучуки. Природный каучук — полимер изопрена."], ["h", "Получение"], ["ul", ["дегидрирование бутана и бутенов", "получение бутадиена из этилового спирта по Лебедеву", "выделение и синтез из нефтехимического сырья"]], ["h", "Практический акцент"], ["p", "Главное в теме — понимать особенность сопряжения и уметь различать 1,2- и 1,4-присоединение; это обычно спрашивают в заданиях на свойства диенов и каучуков."], ["h", "Полимеризация и получение"], ["p", "При 1,4-полимеризации сопряжённого диена в каждом звене остаётся двойная связь. Вулканизация создаёт поперечные связи между цепями каучука."], ["f", "2C₂H₅OH → CH₂=CH–CH=CH₂ + 2H₂O + H₂ (реакция Лебедева)"], ["f", "nCH₂=CH–CH=CH₂ → [–CH₂–CH=CH–CH₂–]ₙ"], ["h", "Первоисточник"], ["p", "Сделано по § 3 учебника. Формулировки сокращены и структурированы, но охватывают строение, изомерию, свойства, получение и значение сопряжённых диенов."]], "book": "Органическая химия, 2018", "illustration": "bookO3"}, {"id": "bookO4", "s": "chem", "title": "Алкины", "min": 13, "body": [["h", "Введение и строение"], ["p", "Алкины — непредельные углеводороды, содержащие одну тройную связь. Общая формула ациклических алкинов: CₙH₂ₙ₋₂. Для атомов углерода в тройной связи характерна sp-гибридизация; тройная связь включает одну σ- и две π-связи, поэтому молекула в области кратной связи имеет линейное строение."], ["f", "Этин HC≡CH; пропин CH₃–C≡CH; общая формула CₙH₂ₙ₋₂"], ["h", "Изомерия и номенклатура"], ["p", "Для алкинов характерны изомерия углеродного скелета и положения тройной связи. Самую длинную цепь нумеруют от конца, ближайшего к тройной связи; суффикс -ин: бут-1-ин, пент-2-ин."], ["h", "Физические свойства"], ["p", "Низшие алкины — газы, следующие представители — жидкости. В воде растворяются плохо, лучше — в органических растворителях."], ["h", "Химические свойства: присоединение"], ["r", ["Гидрирование до алкена", "HC≡CH + H₂ → CH₂=CH₂"]], ["r", ["Гидрирование до алкана", "HC≡CH + 2H₂ → CH₃–CH₃"]], ["r", ["Галогенирование", "HC≡CH + Br₂ → CHBr=CHBr; при избытке Br₂ → CHBr₂–CHBr₂"]], ["r", ["Гидрогалогенирование", "HC≡CH + HCl → CH₂=CHCl; далее +HCl → CH₃–CHCl₂"]], ["r", ["Гидратация ацетилена", "HC≡CH + H₂O → CH₃CHO (Hg²⁺, H₂SO₄)"]], ["p", "Для гомологов ацетилена гидратация по правилу Марковникова обычно приводит к енолу, который таутомеризуется в карбонильное соединение."], ["h", "Особое свойство ацетилена"], ["p", "Ацетилен с терминальной тройной связью проявляет слабокислотные свойства: водород при углероде может замещаться металлом. Поэтому ацетилен взаимодействует с аммиачными растворами оксида серебра и хлорида меди(I) с образованием ацетиленидов."], ["r", ["Образование ацетиленидов", "HC≡CH + 2[Ag(NH₃)₂]OH → AgC≡CAg↓ + 4NH₃ + 2H₂O"]], ["h", "Окисление и горение"], ["r", ["Горение", "2C₂H₂ + 5O₂ → 4CO₂ + 2H₂O"]], ["h", "Получение"], ["ul", ["гидролиз карбида кальция: CaC₂ + 2H₂O → C₂H₂ + Ca(OH)₂", "высокотемпературный пиролиз метана: 2CH₄ → C₂H₂ + 3H₂", "двойное отщепление галогеноводорода от дигалогеналканов"]], ["h", "Что особенно важно"], ["ul", ["строение тройной связи и sp-гибридизацию", "гидратацию ацетилена до ацетальдегида", "кислотные свойства терминальных алкинов", "получение ацетилена из карбида кальция"]], ["h", "Дополнительные реакции кратной связи"], ["p", "Терминальные алкины имеют подвижный атом H. Внутренние алкины не дают характерной реакции на этот атом. При жёстком окислении кратная связь расщепляется."], ["f", "3HC≡CH → C₆H₆ (t, кат.)"], ["f", "CH₃–C≡CH + H₂O → CH₃COCH₃ (Hg²⁺, H⁺)"], ["h", "Первоисточник"], ["p", "Конспект соответствует логике § 4: строение, номенклатура, свойства ацетиленовых углеводородов, их получение и качественные особенности."]], "book": "Органическая химия, 2018", "i
