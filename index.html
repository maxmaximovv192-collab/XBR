ая система гриба и фотосинтезирующего партнёра."], ["bio", "Водоросли, мхи, папоротники", "Водоросли не имеют настоящих органов; мхи не имеют настоящих корней; папоротники имеют сосудистые ткани, корни и листья. Для оплодотворения большинства мхов и папоротников нужна вода."], ["bio", "Голосеменные и покрытосеменные", "У голосеменных семязачатки не заключены в завязь; покрытосеменные образуют цветок и плод. При двойном оплодотворении возникают зигота и обычно триплоидный эндосперм."], ["bio", "Органы и семейства растений", "Корень поглощает воду, побег несёт листья и почки, цветок обеспечивает половое размножение. Однодольные обычно имеют одну семядолю, параллельное жилкование и мочковатую корневую систему."], ["bio", "Простейшие, губки, кишечнополостные", "Простейшие — одноклеточные эукариоты. Губки фильтруют воду; кишечнополостные имеют стрекательные клетки и лучевую симметрию."], ["bio", "Черви и моллюски", "Плоские черви не имеют полости тела; круглые имеют первичную, кольчатые — вторичную. У моллюсков характерны мантия и мускулистая нога."], ["bio", "Членистоногие", "Членистые конечности и хитиновый покров — признаки типа. У насекомых три пары ног, у паукообразных четыре, у ракообразных две пары усиков. Рост связан с линькой."], ["bio", "Хордовые и позвоночные", "Хорда, дорсальная нервная трубка и глоточные щели характерны на определённых стадиях. Рыбы обычно дышат жабрами; земноводные имеют кожное и лёгочное дыхание; птицы и млекопитающие теплокровны."], ["bio", "Ткани человека", "Эпителий покрывает поверхности, соединительная ткань имеет развитое межклеточное вещество, мышечная сокращается, нервная передаёт сигналы."], ["bio", "Опорно-двигательная система", "Кости выполняют опорную и защитную функции, суставы обеспечивают подвижность, мышцы тянут кости при сокращении. Антагонисты действуют противоположно."], ["bio", "Кровь и иммунитет", "Эритроциты переносят кислород, тромбоциты участвуют в свёртывании, лейкоциты защищают организм. Антитела вырабатываются плазматическими клетками. Вакцинация формирует активный иммунитет."], ["bio", "Кровообращение и лимфа", "Артерии несут кровь от сердца, вены — к сердцу. Малый круг начинается в правом желудочке и заканчивается в левом предсердии. Лимфа возвращает тканевую жидкость в кровь."], ["bio", "Дыхание", "Вентиляция обеспечивает поступление воздуха, диффузия — газообмен в альвеолах. При спокойном вдохе диафрагма сокращается и опускается."], ["bio", "Пищеварение", "Амилаза расщепляет крахмал, пепсин работает в кислой среде желудка, ферменты поджелудочной железы действуют в тонкой кишке. Желчь эмульгирует жиры."], ["bio", "Выделение и кожа", "Нефрон фильтрует плазму, затем вещества реабсорбируются и секретируются. Кожа защищает и участвует в терморегуляции посредством потоотделения и изменения просвета сосудов."], ["bio", "Размножение человека", "Гаметы формируются мейозом. Оплодотворение обычно происходит в маточной трубе, имплантация — в матке. Плацента обеспечивает обмен между организмами матери и плода."], ["bio", "Нервная система", "ЦНС включает головной и спинной мозг; ПНС — нервы и узлы. Рефлекс реализуется через рецептор, чувствительный нейрон, центральное звено, двигательный нейрон и эффектор."], ["bio", "Эндокринная регуляция", "Гормоны действуют на клетки с соответствующими рецепторами. Инсулин снижает концентрацию глюкозы в крови, глюкагон повышает. Обратная связь стабилизирует параметры."], ["bio", "Анализаторы", "Анализатор включает рецепторный, проводниковый и центральный отделы. Палочки сетчатки обеспечивают сумеречное зрение, колбочки — цветовое. Улитка участвует в слухе."], ["bio", "Высшая нервная деятельность", "Безусловные рефлексы врождённые, условные приобретаются и требуют подкрепления. Сон связан с закономерным чередованием фаз. Речь и мышление связаны с функциями коры."], ["bio", "Гигиена и здоровье", "Профилактика включает физическую активность, сон, сбалансированное питание, гигиену и вакцинацию. Гомеостаз поддерживает относительное постоянство внутренней среды."], ["bio", "История эволюционных идей", "Ламарк предложил раннюю целостную эволюционную теорию; Дарвин объяснил адаптации естественным отбором наследственных различий. Современная теория соединяет отбор с генетикой популяций."], ["bio", "СТЭ и факторы эволюции", "Мутации и рекомбинация создают разнообразие; дрейф генов случайно меняет частоты аллелей; поток генов и изоляция влияют на различия популяций. Отбор действует на фенотипы."], ["bio", "Вид и видообразование", "Вид определяют совокупностью критериев: морфологического, генетического, экологического и других. Репродуктивная изоляция препятствует обмену генами между популяциями."], ["bio", "Макроэволюция и доказательства", "Гомологичные органы имеют общее происхождение, аналогичные — сходную функцию при различном происхождении. Ароморфоз повышает общий уровень организации, идиоадаптация — частная адаптация."], ["bio", "Происхождение жизни", "Гипотезы абиогенеза описывают образование органических веществ и ранних самовоспроизводящихся систем. Эндосимбиотическая теория объясняет происхождение митохондрий и пластид."], ["bio", "Антропогенез", "Человек и современные человекообразные обезьяны имеют общих предков. Эволюция человека включала прямохождение, развитие мозга, орудийной деятельности и культуры. Все современные люди принадлежат одному виду."], ["bio", "Экологические факторы", "Абиотические факторы — условия неживой среды, биотические — взаимодействия организмов, антропогенные — деятельность человека. Лимитирующий фактор ограничивает жизнедеятельность."], ["bio", "Экосистемы и пищевые сети", "Продуценты создают органическое вещество, консументы потребляют его, редуценты минерализуют остатки. Энергия уменьшается по трофическим уровням; правило 10% приблизительно."], ["bio", "Сукцессии и агроценозы", "Сукцессия — последовательное изменение сообщества. Первичная начинается на субстрате без почвы, вторичная — после нарушения с сохранением почвы. Агроценоз зависит от вмешательства человека."], ["bio", "Популяционная экология", "Численность меняют рождаемость, смертность, иммиграция и эмиграция. При ограниченных ресурсах рост замедляется вблизи ёмкости среды."], ["bio", "Биосфера и круговороты", "Биосфера включает области Земли, населённые организмами. Углерод фиксируется при фотосинтезе, возвращается при дыхании и разложении. Азотфиксация переводит атмосферный азот в доступные соединения."], ["bio", "Охрана природы", "Сохранение местообитаний, снижение загрязнения, рациональное использование ресурсов и защита биоразнообразия поддерживают экосистемы. Эвтрофикация связана с избытком биогенных элементов."]]);

        '<p class="muted small">Конспекты ' + x.nr + '/' + x.nn + ' · тесты ' + x.qd + '/' + x.qn + ' · ДЗ ' + x.hd + '/' + x.hn + (x.acc !== null ? ' · точность ' + x.acc + '%' : '') + '</p></div></div>';
    }
    var h = '<div class="stack"><div class="hero"><span class="label">Общий прогресс</span><div class="row" style="align-items:flex-end"><span class="num" style="font-size:2.6rem">' + st.all + '%</span><span style="text-align:right;font-size:.88rem;color:#E6E8D8">Привет, ' + esc(S.me.name.split(" ")[0]) + '!<br>Учитель: ' + esc(t ? t.name : "—") + '</span></div><div class="bar"><i style="width:' + st.all + '%"></i></div></div>';
    if (fb) h += '<div class="card row"><div><h3>Есть отзывы учителя</h3><p class="muted small">Проверено заданий: ' + fb + '</p></div><button class="btn sm" data-tab="hw">Открыть</button></div>';
    h += sub("chem") + sub("bio");
    if (next) h += '<div class="card stack" style="gap:8px"><span class="label">Ближайшее задание</span><div class="subj">' + tile(next.s) + '<div class="grow" style="gap:2px"><h3>' + esc(next.title) + '</h3><p class="muted small">Срок: ' + next.due + '</p></div></div><button class="btn alt" data-open-hw="' + next.id + '">Открыть</button></div>';
    else h += '<div class="card"><h3>Все задания сданы</h3><p class="muted">Отличная работа.</p></div>';
    return h + '</div>';
  }

  function diagram(n) {
    if (!n.id.startsWith('e27_')) return '';
    var f=n.body.find(function(p){return p[0]==='f';})[1], parts=f.split(/\s*→\s*/);
    if(parts.length<2 || parts.length>6) return '<figure class="studyfig"><svg viewBox="0 0 320 100" role="img" aria-label="Опорная формула"><rect x="8" y="8" width="304" height="84" rx="15" fill="var(--sun)"/><text x="160" y="32" text-anchor="middle" fill="#2C3D37" font-size="11">ОПОРНЫЙ ПРИМЕР</text><foreignObject x="20" y="39" width="280" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;color:#2C3D37;font-size:13px;font-weight:700">'+esc(f)+'</div></foreignObject></svg></figure>';
    var h=parts.length*58+8; return '<figure class="studyfig"><svg viewBox="0 0 320 '+h+'" role="img" aria-label="Схема процесса">'+parts.map(function(x,i){return '<rect x="18" y="'+(i*58+4)+'" width="284" height="38" rx="12" fill="var(--'+n.s+'-soft)"/><foreignObject x="25" y="'+(i*58+10)+'" width="270" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font-size:12px;color:var(--fg);font-weight:700">'+esc(x)+'</div></foreignObject>'+(i<parts.length-1?'<path d="M160 '+(i*58+43)+' v13 l-5 -5 m5 5 l5 -5" stroke="var(--fg)" fill="none"/>':'');}).join('')+'</svg><figcaption>Учебная схема XBR</figcaption></figure>';
  }
  function noteBody(n) {
    return n.body.map(function (p) {
      if (p[0] === "h") return '<h3>' + esc(p[1]) + '</h3>';
      if (p[0] === "p") return '<p>' + esc(p[1]) + '</p>';
      if (p[0] === "r") return '<div class="reaction"><b>'+esc(p[1][0])+':</b> <span>'+esc(p[1][1])+'</span></div>';
      if (p[0] === "f") return '<div class="formula '+(n.s==='chem'?'chemical':'')+'">' + esc(p[1]) + '</div>';
      return '<ul>' + p[1].map(function (i) { return '<li>' + esc(i) + '</li>'; }).join("") + '</ul>';
    }).join("");
  }
  function searchBox(){return '<input type="search" placeholder="Поиск по теме…" aria-label="Поиск по теме" oninput="var q=this.value.toLowerCase();document.querySelectorAll(\'.item,details.gl\').forEach(function(el){el.hidden=!el.textContent.toLowerCase().includes(q)})">';}
  function library(){return '<details class="gl"><summary>Библиотека и кодификатор 2027</summary><p>Тематические конспекты и тесты XBR — авторские учебные материалы. Сверяйте формулировки с официальным перечнем ФИПИ.</p><p><a href="https://fipi.ru/ege/demoversii-specifikacii-kodifikatory" target="_blank" rel="noopener">ФИПИ — документы 2027</a></p><p><a href="https://stepenin.ru/" target="_blank" rel="noopener">Степенин и Дацук — теория и практика</a></p><p><a href="https://chem-ege.sdamgia.ru/" target="_blank" rel="noopener">Решу ЕГЭ — химия</a> · <a href="https://bio-ege.sdamgia.ru/" target="_blank" rel="noopener">биология</a></p><p><a href="https://chemege.ru/" target="_blank" rel="noopener">CHEMEGE</a> · <a href="https://acetyl.ru/f/k200.php" target="_blank" rel="noopener">Acetyl — тренажёры</a></p></details>';}
  function vNotes() {
    var isT = S.me.role === "teacher";
    if (S.view) {
      var n = NOTES.find(function(x){return x.id===S.view;}); if(!n){S.view=null;return vNotes();} var read = !isT && S.prog.read[n.id];
      return '<div class="stack"><button class="back" id="bk">← К конспектам</button>' + chip(n.s) + '<h1>' + esc(n.title) + '</h1><div class="note">' + (n.book ? chemistryFigure(n) : diagram(n)) + noteBody(n) + '</div>' +
        (isT ? "" : '<button class="btn' + (read ? " alt" : n.s === "bio" ? " bio" : "") + '" id="mark">' + (read ? "Отмечено как прочитанное" : "Отметить прочитанным") + '</button>') + '</div>';
    }
    return '<div class="stack"><h1>Конспекты по химии</h1><p class="muted">Новошинские · 32 темы неорганики и 16 тем органики</p><div class="seg"><button data-book="all" class="'+(S.noteBook!=="N"&&S.noteBook!=="O"?"on":"")+'">Все</button><button data-book="N" class="'+(S.noteBook==="N"?"on":"")+'">Неорганика</button><button data-book="O" class="'+(S.noteBook==="O"?"on":"")+'">Органика</button></div>' + searchBox() + NOTES.filter(function(n){return !S.noteBook||S.noteBook==="all"||n.id.startsWith("book"+S.noteBook);}).map(function (n) {
      var d = !isT && S.prog.read[n.id];
      return '<button class="item" data-note="' + n.id + '">' + tile(n.s) + '<span class="t"><b>' + esc(n.title) + '</b><small>' + esc(n.book) + ' · ' + n.min + ' мин</small></span>' + (isT ? "" : '<span class="dot' + (d ? " on" : "") + '">' + (d ? "✓" : "") + '</span>') + '</button>';
    }).join("") + '</div>';
  }

  function vTests() {
    var Q = S.quiz;
    if (Q) {
      var qz = QUIZ.filter(function (x) { return x.id === Q.id; })[0];
      if (Q.i >= qz.q.length) {
        var pct = Math.round(Q.score / qz.q.length * 100);
        return '<div class="stack"><div class="hero"><span class="label">' + esc(qz.title) + '</span><span class="num" style="font-size:2.6rem">' + Q.score + ' из ' + qz.q.length + '</span><div class="bar"><i style="width:' + pct + '%"></i></div><p style="font-size:.92rem;color:#E6E8D8">' + (pct === 100 ? "Без ошибок." : pct >= 60 ? "Хороший результат. Повторите ошибки в конспекте." : "Стоит перечитать конспект и пройти тест ещё раз.") + '</p></div>' +
          '<button class="btn" id="again">Пройти ещё раз</button><button class="btn alt" id="exit">К списку тестов</button></div>';
      }
      var q = qz.q[Q.i];
      return '<div class="stack"><button class="back" id="exit">← Выйти из теста</button><div class="row"><span class="label">Вопрос ' + (Q.i + 1) + ' из ' + qz.q.length + '</span>' + chip(qz.s) + '</div>' +
        '<div class="bar ' + qz.s + '"><i style="width:' + (Q.i / qz.q.length * 100) + '%"></i></div><h2 style="line-height:1.4">' + esc(q.t) + '</h2>' +
        q.o.map(function (o, k) {
          var c = "opt"; if (Q.pick !== null) { if (k === q.a) c += " right"; else if (k === Q.pick) c += " wrong"; }
          return '<button class="' + c + '" data-opt="' + k + '"' + (Q.pick !== null ? " disabled" : "") + '>' + esc(o) + '</button>';
        }).join("") +
        (Q.pick !== null && q.ex ? '<div class="info">'+esc(q.ex)+'</div>' : '') + (Q.pick !== null ? '<button class="btn" id="nx">' + (Q.i + 1 === qz.q.length ? "Показать результат" : "Дальше") + '</button>' : "") + '</div>';
    }
    return '<div class="stack"><h1>Тесты</h1>' + filter() + searchBox() + byS(QUIZ).map(function (z) {
      var r = S.prog.quiz[z.id];
      return '<button class="item" data-quiz="' + z.id + '">' + tile(z.s) + '<span class="t"><b>' + esc(z.title) + '</b><small>' + SUBJ[z.s] + ' · ' + z.q.length + ' вопроса' + (r ? " · лучший результат " + r.best + "/" + r.total : "") + '</small></span>' + (r ? '<span class="chip ok">пройден</span>' : '<span class="chip">новый</span>') + '</button>';
    }).join("") + '</div>';
  }

  function reviewBox(r) {
    if (!r) return "";
    return '<div class="review ' + (r.mark === "again" ? "again" : "") + '"><div class="row"><b>' + esc(TEACH[r.teacher] ? TEACH[r.teacher].name : "Учитель") + '</b><span class="chip ' + (r.mark === "again" ? "warn" : "ok") + '">' + (r.mark === "again" ? "доработать" : "зачёт") + '</span></div>' + (r.text ? '<p>' + esc(r.text) + '</p>' : "") + '</div>';
  }
  function vHw() {
    if (S.view) {
      var h = HW.filter(function (x) { return x.id === S.view; })[0], r = S.prog.hw[h.id] || { done: false, answer: "" };
      return '<div class="stack"><button class="back" id="bk">← К заданиям</button><div class="row">' + chip(h.s) + '<span class="muted small">Срок: ' + h.due + '</span></div><h1>' + esc(h.title) + '</h1><div class="card"><p>' + esc(h.text) + '</p></div>' +
        reviewBox(S.reviews[h.id]) +
        '<div class="field"><label class="label" for="ans">Ваш ответ</label><textarea id="ans" placeholder="Напишите решение или ссылку на фото">' + esc(r.answer) + '</textarea></div>' +
        '<button class="btn' + (r.done ? " alt" : "") + '" id="sub">' + (r.done ? "Сдано. Вернуть в работу" : "Сдать задание") + '</button></div>';
    }
    return '<div class="stack"><h1>Домашние задания</h1>' + filter() + byS(HW).map(function (h) {
      var d = S.prog.hw[h.id] && S.prog.hw[h.id].done, rv = S.reviews[h.id];
      return '<button class="item" data-hw="' + h.id + '">' + tile(h.s) + '<span class="t"><b>' + esc(h.title) + '</b><small>' + SUBJ[h.s] + ' · до ' + h.due + '</small></span>' +
        (rv ? '<span class="chip ' + (rv.mark === "again" ? "warn" : "ok") + '">' + (rv.mark === "again" ? "доработать" : "зачёт") + '</span>' : d ? '<span class="chip">сдано</span>' : "") + '</button>';
    }).join("") + '</div>';
  }

  function vGloss() {
    return '<div class="stack"><h1>Словарь терминов</h1>' + filter() + searchBox() + GLOSS.filter(function (g) { return S.sub === "all" || g[0] === S.sub; }).map(function (g) {
      return '<details class="gl"><summary><span>' + esc(g[1]) + '</span>' + chip(g[0]) + '</summary><p>' + esc(g[2]) + '</p></details>';
    }).join("") + '</div>';
  }

  /* ---------- Views: teacher ---------- */
  function pendingCount(p) {
    return HW.filter(function (h) { return p.hw && p.hw[h.id] && p.hw[h.id].done && !S.allReviews[p.id + "|" + h.id]; }).length;
  }
  function vStudents() {
    if (S.view) return vStudentDetail();
    var list = S.students.slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "ru"); });
    var avg = list.length ? Math.round(list.reduce(function (s, p) { return s + stats(p).all; }, 0) / list.length) : 0;
    var pend = list.reduce(function (s, p) { return s + pendingCount(p); }, 0);
    var h = '<div class="stack"><h1>Ваши ученики</h1><div class="stat3"><div class="card"><span class="label">Учеников</span><span class="num">' + list.length + '</span></div><div class="card"><span class="label">Средний</span><span class="num">' + avg + '%</span></div><div class="card"><span class="label">На проверке</span><span class="num" style="color:var(--chem)">' + pend + '</span></div></div>';
    if (store && store.mode === "local") h += '<div class="info">Тестовый режим: вы видите только данные с этого устройства.</div>';
    if (!list.length) return h + '<div class="card"><h3>Пока никого нет</h3><p class="muted">Ученики появятся здесь после регистрации. Пусть выберут «' + esc(S.me.name) + '» в качестве учителя.</p></div></div>';
    return h + list.map(function (p) {
      var st = stats(p), pc = pendingCount(p);
      return '<button class="item" data-stu="' + esc(p.id) + '"><span class="avatar">' + esc((p.name || "?").charAt(0).toUpperCase()) + '</span><span class="t"><b>' + esc(p.name) + '</b><small>' + st.all + '% · заходил(а): ' + fmtDate(p.updated) + '</small><div class="bar" style="margin-top:6px"><i style="width:' + st.all + '%"></i></div></span>' + (pc ? '<span class="chip warn">' + pc + ' на проверку</span>' : "") + '</button>';
    }).join("") + '</div>';
  }
  function vStudentDetail() {
    var p = S.students.filter(function (x) { return x.id === S.view; })[0];
    if (!p) { S.view = null; return vStudents(); }
    var st = stats(p);
    var h = '<div class="stack"><button class="back" id="bk">← Все ученики</button><h1>' + esc(p.name) + '</h1><p class="muted small">Последняя активность: ' + fmtDate(p.updated) + '</p>';
    h += '<button class="btn alt" id="rename-student">Изменить имя ученика</button>';
    h += '<div class="hero"><span class="label">Общий прогресс</span><span class="num" style="font-size:2.4rem">' + st.all + '%</span><div class="bar"><i style="width:' + st.all + '%"></i></div></div>';
    ["chem", "bio"].forEach(function (s) {
      var x = st[s];
      h += '<div class="card subj">' + tile(s) + '<div class="grow"><div class="row"><h3>' + SUBJ[s] + '</h3><span class="num" style="font-size:1.1rem">' + x.pct + '%</span></div><div class="bar ' + s + '"><i style="width:' + x.pct + '%"></i></div><p class="muted small">Конспекты ' + x.nr + '/' + x.nn + ' · тесты ' + x.qd + '/' + x.qn + ' · ДЗ ' + x.hd + '/' + x.hn + (x.acc !== null ? ' · точность ' + x.acc + '%' : '') + '</p></div></div>';
    });
    h += '<h2>Тесты</h2>' + QUIZ.map(function (z) {
      var r = p.quiz && p.quiz[z.id];
      return '<div class="item">' + tile(z.s) + '<span class="t"><b>' + esc(z.title) + '</b><small>' + (r ? "лучший " + r.best + "/" + r.total + " · попыток: " + (r.attempts || 1) : "не проходил(а)") + '</small></span>' + (r ? '<span class="chip ' + (r.best / r.total >= .6 ? "ok" : "warn") + '">' + Math.round(r.best / r.total * 100) + '%</span>' : "") + '</div>';
    }).join("");
    h += '<h2>Домашние задания</h2>' + HW.map(function (hw) {
      var r = p.hw && p.hw[hw.id], rv = S.allReviews[p.id + "|" + hw.id];
      var body = '<div class="row"><div class="subj" style="gap:10px">' + tile(hw.s) + '<div><b>' + esc(hw.title) + '</b><div class="muted small">до ' + hw.due + '</div></div></div>' + (r && r.done ? '<span class="chip' + (rv ? "" : " warn") + '">' + (rv ? (rv.mark === "again" ? "доработать" : "зачёт") : "ждёт проверки") + '</span>' : '<span class="chip">не сдано</span>') + '</div>';
      if (r && (r.answer || r.done)) {
        body += '<div class="card" style="background:var(--bg)"><span class="label">Ответ ученика</span><p style="white-space:pre-wrap;margin-top:4px">' + esc(r.answer || "(без текста)") + '</p></div>';
        if (r.done) body += '<textarea id="rv-' + hw.id + '" placeholder="Комментарий ученику">' + esc(rv ? rv.text : "") + '</textarea><div class="row"><button class="btn bio sm" data-rv="' + hw.id + '" data-mark="ok">Зачёт</button><button class="btn sm" data-rv="' + hw.id + '" data-mark="again">Доработать</button></div>';
      }
      return '<div class="card stack" style="gap:10px">' + body + '</div>';
    }).join("");
    return h + '</div>';
  }

  /* ---------- Render + events ---------- */
  function isEditing() { var a = document.activeElement; return a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT") && root.contains(a); }
  function rerender() { if (!S.me || S.tab === "assign") return; if (isEditing()) { rerender.p = true; return; } render(); }
  function render() {
    if (!S.me) { renderLogin(); return; }
    var T = S.me.role === "teacher", body;
    if (S.tab === "tools") body = vTools();
    else if (S.tab === "assign") body = vAssign();
    else if (T) body = S.tab === "students" ? vStudents() : S.tab === "notes" ? vNotes() : vGloss();
    else body = S.tab === "home" ? vHome() : S.tab === "notes" ? vNotes() : S.tab === "tests" ? vTests() : S.tab === "hw" ? vHw() : vGloss();
    root.innerHTML = '<div class="app">' + top() + body + '</div>' + tabs();
    bind();
  }
  function go(tab) { if(tab==="assign"){A.view=null;A.error="";A.items=null;loadAssignments();} S.tab = tab; S.view = null; S.quiz = null; render(); window.scrollTo(0, 0); }
  function on(sel, fn) { var els = root.querySelectorAll(sel); for (var i = 0; i < els.length; i++) els[i].addEventListener("click", fn); }

  function bind() {
    if(S.tab==="assign") bindAssign();
    if(S.tab==="tools") bindTools();
    on("#rename-student", async function(){var name=prompt("Новое имя ученика");if(!name)return;try{await api("rename_student",{sid:S.view,name:name});toast("Имя сохранено");}catch(e){toast(e.message);}});
    on("#out", logout);
    on("[data-tab]", function () { go(this.getAttribute("data-tab")); });
    on("[data-sub]", function () { S.sub = this.getAttribute("data-sub"); render(); });
    on("[data-open-hw]", function () { S.tab = "hw"; S.view = this.getAttribute("data-open-hw"); render(); window.scrollTo(0, 0); });
    on("[data-note]", function () { S.view = this.getAttribute("data-note"); render(); window.scrollTo(0, 0); });
    on("[data-hw]", function () { S.view = this.getAttribute("data-hw"); render(); window.scrollTo(0, 0); });
    on("[data-stu]", function () { S.view = this.getAttribute("data-stu"); render(); window.scrollTo(0, 0); });
    on("#bk", function () { S.view = null; render(); });
    on("#mark", function () { if (S.prog.read[S.view]) delete S.prog.read[S.view]; else S.prog.read[S.view] = 1; saveProg(); render(); });
    on("[data-quiz]", function () { S.quiz = { id: this.getAttribute("data-quiz"), i: 0, score: 0, pick: null }; render(); window.scrollTo(0, 0); });
    on("[data-opt]", function () {
      var Q = S.quiz, qz = QUIZ.filter(function (x) { return x.id === Q.id; })[0];
      Q.pick = +this.getAttribute("data-opt"); recordError(Q.id,Q.i,Q.pick !== qz.q[Q.i].a); if (Q.pick === qz.q[Q.i].a) Q.score++; render();
    });
    on("#nx", function () {
      var Q = S.quiz, qz = QUIZ.filter(function (x) { return x.id === Q.id; })[0];
      Q.i++; Q.pick = null;
      if (Q.i >= qz.q.length) {
        var prev = S.prog.quiz[Q.id];
        S.prog.quiz[Q.id] = { best: Math.max(prev ? prev.best : 0, Q.score), total: qz.q.length, attempts: (prev ? prev.attempts || 1 : 0) + 1, last: Q.score, at: nowIso() };
        saveProg();
      }
      render(); window.scrollTo(0, 0);
    });
    on("#again", function () { S.quiz = { id: S.quiz.id, i: 0, score: 0, pick: null }; render(); });
    on("#exit", function () { S.quiz = null; render(); });
    on("#sub", function () {
      var r = S.prog.hw[S.view] || { done: false, answer: "" };
      r.answer = $("ans").value; r.done = !r.done; r.at = nowIso();
      S.prog.hw[S.view] = r; saveProg(); render();
    });
    var ans = $("ans");
    if (ans) ans.addEventListener("change", function () {
      var r = S.prog.hw[S.view] || { done: false, answer: "" };
      r.answer = ans.value; S.prog.hw[S.view] = r; saveProg();
    });
    on("[data-rv]", async function () {
      var hw = this.getAttribute("data-rv"), mark = this.getAttribute("data-mark"), sid = S.view;
      var rec = { sid: sid, hw: hw, teacher: S.me.id, mark: mark, text: $("rv-" + hw).value.trim(), at: nowIso() };
      try { await store.set("reviews/" + sid + "-" + hw, rec); S.allReviews[sid + "|" + hw] = rec; toast(mark === "ok" ? "Зачёт поставлен" : "Отправлено на доработку"); render(); }
      catch (e) { toast("Не удалось сохранить отзыв"); }
    });
    document.querySelectorAll("textarea, input").forEach(function (el) {
      el.addEventListener("blur", function () { if (rerender.p) { rerender.p = false; setTimeout(function () { if (!isEditing()) render(); }, 150); } });
    });
  }

  var EX_BANK={"chem": [["Электронное строение", "Из ряда Na, Mg, Al, Si, K выберите два элемента с одним электроном на внешнем уровне. Запишите номера по возрастанию.", "15"], ["Периодичность", "Расположите элементы 1) Cl 2) Na 3) P в порядке возрастания электроотрицательности.", "231"], ["Степени окисления", "Выберите два вещества, в которых сера имеет степень окисления +6: 1) H₂S 2) SO₃ 3) SO₂ 4) Na₂SO₄ 5) S.", "24"], ["Химическая связь", "Выберите два вещества с ионной связью: 1) KBr 2) HCl 3) CO₂ 4) MgO 5) CH₄.", "14"], ["Классы веществ", "Соотнесите: А) CaO Б) HNO₃ В) Na₂SO₄. 1) кислота 2) соль 3) основный оксид 4) основание.", "312"], ["Неорганические вещества", "Выберите два вещества, реагирующих с HCl: 1) Cu 2) Mg 3) Ag 4) CaCO₃ 5) SiO₂.", "24"], ["Неорганические реакции", "Соотнесите вещество с реагентом: А) CO₂ Б) CuO В) AgNO₃. 1) NaOH 2) HCl 3) NaCl. Для В выберите реагент, образующий AgCl; для Б — кислоту.", "123"], ["Свойства солей", "Выберите два раствора, образующих осадок с BaCl₂: 1) Na₂SO₄ 2) KNO₃ 3) NaCl 4) K₂CO₃ 5) HCl.", "14"], ["Цепочка превращений", "Ca → X → CaCO₃. При взаимодействии Ca с водой получается X. Выберите X: 1) CaCl₂ 2) Ca(OH)₂ 3) CaS 4) CaH₂.", "2"], ["Органическая номенклатура", "Соотнесите: А) CH₃CHO Б) CH₃COOH В) CH₃OH. 1) спирт 2) кислота 3) альдегид.", "321"], ["Изомерия", "Выберите два изомера бутана: 1) CH₃CH₂CH₂CH₃ 2) CH₃CH₂CH₃ 3) (CH₃)₃CH 4) C₄H₈ 5) C₅H₁₂.", "13"], ["Углеводороды", "Выберите два реагента, присоединяющихся к этену: 1) H₂ 2) NaCl 3) Br₂ 4) Na₂SO₄ 5) KCl.", "13"], ["Кислородсодержащие вещества", "Выберите два вещества, реагирующих с NaOH: 1) этан 2) фенол 3) бензол 4) уксусная кислота 5) пропан.", "24"], ["Органические реакции", "Соотнесите реагент с продуктом реакции этена: А) H₂ Б) H₂O В) HCl. 1) этанол 2) хлорэтан 3) этан.", "312"], ["Азотсодержащие вещества", "Выберите два вещества, содержащих азот: 1) глицин 2) глюкоза 3) анилин 4) этанол 5) ацетон.", "13"], ["Органическая цепочка", "Этанол → X → уксусная кислота. Выберите X: 1) этан 2) этаналь 3) метан 4) бензол.", "2"], ["Типы реакций", "Соотнесите: А) горение метана Б) полимеризация этена В) гидролиз эфира. 1) окисление 2) полимеризация 3) гидролиз.", "123"], ["Скорость реакции", "Выберите два фактора, ускоряющих реакцию Zn с HCl: 1) нагревание 2) охлаждение 3) измельчение Zn 4) разбавление кислоты 5) уменьшение площади поверхности.", "13"], ["ОВР", "В реакции Zn + CuSO₄ → ZnSO₄ + Cu укажите номер окислителя: 1) Zn 2) Cu²⁺ 3) SO₄²⁻ 4) Cu.", "2"], ["Электролиз", "Соотнесите электрод и процесс: А) катод Б) анод. 1) окисление 2) восстановление.", "21"], ["Гидролиз", "Выберите две соли, растворы которых имеют щелочную среду: 1) Na₂CO₃ 2) NaCl 3) NH₄Cl 4) K₂S 5) KNO₃.", "14"], ["Равновесие", "N₂ + 3H₂ ⇄ 2NH₃ + Q. Выберите два воздействия, смещающие равновесие вправо: 1) повышение давления 2) повышение температуры 3) добавление H₂ 4) добавление NH₃ 5) снижение давления.", "13"], ["Расчёт равновесия", "В сосуде 2 л было 0,8 моль вещества A. Израсходовалось 0,2 моль. Найдите конечную концентрацию A (моль/л).", "0,3"], ["Качественные реакции", "Соотнесите ион и реагент: А) Cl⁻ Б) SO₄²⁻ В) CO₃²⁻. 1) Ba²⁺ (в кислой среде) 2) Ag⁺ 3) H⁺ (выделение газа).", "213"], ["Практическая химия", "Выберите два способа разделения смеси песка и воды: 1) фильтрование 2) отстаивание 3) хроматография 4) электролиз 5) магнитная сепарация.", "12"], ["Растворы", "В 180 г воды растворили 20 г NaCl. Найдите массовую долю соли в процентах.", "10"], ["Термохимия", "При сгорании 1 моль вещества выделяется 400 кДж. Сколько кДж выделится при сгорании 0,5 моль?", "200"], ["Расчёт по уравнению", "Какой объём H₂ (л, н.у., 22,4 л/моль) выделится из 6,5 г Zn при избытке HCl? Ar(Zn)=65.", "2,24"], ["ОВР", "Из веществ KMnO₄, HCl, KCl, NaOH выберите реагенты для ОВР с выделением хлора. Запишите уравнение, электронный баланс, окислитель и восстановитель.", "2KMnO₄ + 16HCl → 2KCl + 2MnCl₂ + 5Cl₂ + 8H₂O. Mn(+7) принимает 5e⁻; 2Cl⁻ отдают 2e⁻. Окислитель KMnO₄, восстановитель HCl."], ["Ионный обмен", "Из Na₂CO₃, HCl, KNO₃, NaCl выберите вещества, дающие газ при смешивании растворов. Напишите молекулярное, полное и сокращённое ионное уравнения.", "Na₂CO₃ + 2HCl → 2NaCl + CO₂ + H₂O; 2Na⁺ + CO₃²⁻ + 2H⁺ + 2Cl⁻ → 2Na⁺ + 2Cl⁻ + CO₂ + H₂O; CO₃²⁻ + 2H⁺ → CO₂ + H₂O."], ["Неорганическая цепочка", "Напишите уравнения превращений Fe → FeCl₂ → Fe(OH)₂ → Fe(OH)₃ → Fe₂O₃.", "Fe + 2HCl → FeCl₂ + H₂; FeCl₂ + 2NaOH → Fe(OH)₂ + 2NaCl; 4Fe(OH)₂ + O₂ + 2H₂O → 4Fe(OH)₃; 2Fe(OH)₃ → Fe₂O₃ + 3H₂O (нагревание)."], ["Органическая цепочка", "Напишите структурные уравнения превращений этан → этен → этанол → этаналь → уксусная кислота.", "C₂H₆ → C₂H₄ + H₂ (t, кат.); CH₂=CH₂ + H₂O → CH₃CH₂OH (H⁺); CH₃CH₂OH + CuO → CH₃CHO + Cu + H₂O (t); 2CH₃CHO + O₂ → 2CH₃COOH."], ["Молекулярная формула", "При сгорании 4,6 г вещества образовалось 8,8 г CO₂ и 5,4 г H₂O. Молярная масса 46 г/моль. Определите формулу и предложите структурную формулу вещества, реагирующего с Na с выделением H₂.", "n(C)=0,2; n(H)=0,6; m(O)=1,6 г, n(O)=0,1. Формула C₂H₆O. Структура CH₃CH₂OH; 2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂."], ["Расчётная задача", "К 200 г 10%-го раствора NaOH добавили 100 г 18,25%-го раствора HCl. Рассчитайте массовую долю NaCl в конечном растворе.", "n(NaOH)=0,5 моль; n(HCl)=0,5 моль. NaOH + HCl → NaCl + H₂O. m(NaCl)=29,25 г; масса раствора 300 г; доля 9,75%."]], "bio": [["Биология как наука", "Как называется метод изучения наследования признаков в родословных?", "генеалогический"], ["Клетка", "Выберите два органоида с собственной ДНК: 1) рибосома 2) митохондрия 3) лизосома 4) хлоропласт 5) аппарат Гольджи.", "24"], ["Генетическая информация", "В молекуле ДНК 20% аденина. Сколько процентов гуанина?", "30"], ["Клеточный цикл", "В диплоидной клетке 12 хромосом. Сколько хромосом в гамете?", "6"], ["Обмен веществ", "Выберите два процесса энергетического обмена: 1) гликолиз 2) транскрипция 3) цикл Кребса 4) трансляция 5) репликация.", "13"], ["Генетика", "При Aa × aa сколько про   function examKey(s){return 'xbr281:'+S.me.id+':'+s;}
  function examLoad(s,d){try{return JSON.parse(localStorage.getItem(examKey(s)))||d;}catch(e){return d;}}
  function examSave(s,v){try{localStorage.setItem(examKey(s),JSON.stringify(v));}catch(e){toast('Не удалось сохранить на устройстве');}}
  function examGenerate(s){return EX_BANK[s].map((x,i)=>({topic:x[0],t:x[1],a:x[2],long:i>=(s==='chem'?28:21)}));}
  function examNorm(s){return String(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace('.',',');}
  function examFinish(r){if(r.finished)return;r.finished=true;r.score=r.items.reduce((a,x,i)=>a+(!x.long&&examNorm(r.answers[i])===examNorm(x.a)?1:0),0);var history=examLoad('history',[]);history.unshift(r);examSave('history',history.slice(0,30));examSave('active',{});E.result=r;}
  function examView(){var r=examLoad('active',{}),history=examLoad('history',[]),head='<div class="stack"><button class="back" data-tool="menu">← К инструментам</button><h1>Экзаменационный режим</h1>';if(r.items&&Date.now()>=r.deadline){examFinish(r);r={};}if(E.result){r=E.result;return head+'<div class="hero"><h2>Результат части 1</h2><span class="num">'+r.score+' / '+(r.subject==='chem'?28:21)+'</span><p>Число верных ответов, не первичные баллы ЕГЭ. Часть 2 — самопроверка или проверка учителем.</p></div><button class="btn alt" id="ex-close">К вариантам</button>'+r.items.map((x,i)=>'<div class="card stack"><h3>'+(i+1)+'. '+esc(x.topic)+'</h3><p>'+esc(x.t)+'</p><p>Ваш ответ: '+esc(r.answers[i]||'Нет ответа')+'</p><p><b>'+(x.long?'Образец решения':'Правильный ответ')+':</b> '+esc(x.a)+'</p></div>').join('')+'</div>';}

  return head+'<div class="card stack"><h2>Авторский вариант № 1</h2><p>Химия — 34 задания; биология — 28. Структура приближена к ЕГЭ, задания XBR, не копия банка «Решу ЕГЭ».</p><label>Предмет<select id="ex-sub"><option value="chem">Химия · 34 задания</option><option value="bio">Биология · 28 заданий</option></select></label><p>Время: 235 минут.</p><button class="btn" id="ex-start">Начать вариант</button>'+(S.me.role==='teacher'?'<button class="btn alt" id="ex-assign">Назначить вариант как ДЗ</button>':'')+'</div><h2>История на этом устройстве</h2>'+history.map((a,i)=>'<button class="item" data-ex-history="'+i+'">'+(a.subject==='chem'?'Химия':'Биология')+' · '+a.score+'/'+(a.subject==='chem'?28:21)+'</button>').join('')+'</div>';}
  function examBind(){var r=examLoad('active',{});on('#ex-start',()=>{var s=$('ex-sub').value;examSave('active',{subject:s,minutes:235,deadline:Date.now()+235*60000,items:examGenerate(s),answers:{}});render();});function progress(){var el=$('ex-progress');if(el&&r.items)el.textContent=Object.values(r.answers).filter(v=>v.trim()).length+' / '+r.items.length+' отвечено';}progress();document.querySelectorAll('[data-ex-field]').forEach(el=>el.oninput=()=>{var i=Number(el.dataset.exField);r.answers[i]=el.value;examSave('active',r);progress();var b=document.querySelector('[data-ex-nav="'+i+'"]');if(b){b.classList.toggle('bio',!!el.value.trim());b.classList.toggle('alt',!el.value.trim());}});on('[data-ex-nav]',function(){var el=$('ex-q-'+this.dataset.exNav);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});on('#ex-finish',()=>{if(confirm('Завершить вариант?')){examFinish(r);render();}});on('#ex-close',()=>{E.result=null;render();});on('[data-ex-history]',function(){E.result=examLoad('history',[])[Number(this.dataset.exHistory)];render();});on('#ex-assign',()=>{var s=$('ex-sub').value,items=examGenerate(s);go('assign');A.view='new';A.error='';A.teacherPhoto='';A.selected=new Map();render();$('a-title').value='Экзаменационный вариант № 1';$('a-subject').value=s;$('a-subject').dispatchEvent(new Event('change'));$('a-text').value='Время: 235 мин. Запишите ответы и решения.\n\n'+items.map((x,i)=>(i+1)+'. '+x.t).join('\n\n');});}
  setInterval(()=>{if(!S.me||S.tab!=='tools'||U.mode!=='exam')return;var r=examLoad('active',{}),el=$('ex-clock');if(!r.items||!el)return;var t=Math.max(0,Math.ceil((r.deadline-Date.now())/1000));el.textContent=Math.floor(t/3600)+':'+String(Math.floor(t/60)%60).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(!t){examFinish(r);render();}},500);
