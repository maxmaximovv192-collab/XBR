llustration": "bookO4"}, {"id": "bookO5", "s": "chem", "title": "Циклоалканы", "min": 11, "body": [["h", "Введение"], ["p", "Циклоалканы — насыщенные циклические углеводороды. Для моноциклических представителей общая формула CₙH₂ₙ. По составу они изомерны алкенам, но по строению и свойствам отличаются: их атомы углерода соединены одинарными связями в цикл."], ["f", "Циклопропан C₃H₆; циклобутан C₄H₈; циклогексан C₆H₁₂"], ["h", "Строение и напряжение цикла"], ["p", "Малые циклы (циклопропан, циклобутан) напряжены, поэтому более реакционноспособны и способны вступать в реакции присоединения с разрывом кольца. Циклогексан устойчивее и по свойствам ближе к алканам."], ["h", "Номенклатура и изомерия"], ["p", "Названия образуют прибавлением приставки цикло- к названию соответствующего алкана: циклопропан, циклогексан. Для замещённых циклоалканов нумерацию ведут так, чтобы заместители получили наименьшие номера."], ["h", "Физические свойства"], ["p", "По физическим свойствам циклоалканы близки к соответствующим алканам: плохо растворимы в воде и хорошо — в органических растворителях."], ["h", "Химические свойства"], ["r", ["Гидрирование циклопропана", "C₃H₆ + H₂ → C₃H₈"]], ["r", ["Галогенирование напряжённых циклов", "C₃H₆ + Br₂ → BrCH₂–CH₂–CH₂Br"]], ["r", ["Дегидрирование циклогексана", "C₆H₁₂ → C₆H₆ + 3H₂"]], ["r", ["Горение", "CₙH₂ₙ + 3n/2 O₂ → nCO₂ + nH₂O"]], ["p", "Циклоалканы без напряжения чаще реагируют по типу замещения, а малые циклы — по типу присоединения с раскрытием кольца."], ["h", "Получение"], ["ul", ["внутримолекулярная реакция Вюрца из дигалогеналканов", "гидрирование циклоалкенов и аренов", "выделение из нефти"]], ["h", "Получение и различия циклов"], ["p", "Внутримолекулярное замыкание цепи дигалогенпроизводного даёт цикл. Большие циклы реагируют с галогенами по механизму замещения."], ["f", "BrCH₂CH₂CH₂Br + Zn → C₃H₆ + ZnBr₂"], ["f", "C₆H₁₂ + Cl₂ → C₆H₁₁Cl + HCl (hν)"], ["h", "Первоисточник"], ["p", "Конспект составлен по § 5: состав, строение, особенности малых и больших циклов, реакции присоединения и дегидрирования."]], "book": "Органическая химия, 2018", "illustration": "bookO5"}, {"id": "bookO6", "s": "chem", "title": "Ароматические углеводороды (арены)", "min": 14, "body": [["h", "Введение и ароматичность"], ["p", "Арены — углеводороды, содержащие бензольное кольцо. Главный представитель — бензол C₆H₆. В бензольном кольце шесть π-электронов делокализованы по кольцу, поэтому все связи C–C эквивалентны; это определяет повышенную устойчивость ароматической системы."], ["f", "Бензол C₆H₆; толуол C₆H₅CH₃; ксилолы C₆H₄(CH₃)₂"], ["h", "Изомерия и номенклатура"], ["p", "Для гомологов бензола характерна изомерия боковой цепи и изомерия положения заместителей в кольце: орто- (1,2-), мета- (1,3-) и пара- (1,4-). Названия могут быть тривиальными и систематическими."], ["h", "Физические свойства"], ["p", "Арены — обычно бесцветные жидкости или твёрдые вещества с характерным запахом, в воде практически не растворяются, хорошо растворяются в органических растворителях. Бензол токсичен."], ["h", "Химические свойства бензольного кольца"], ["p", "Для ароматического кольца наиболее характерны реакции электрофильного замещения: они сохраняют ароматическую систему."], ["r", ["Галогенирование", "C₆H₆ + Br₂ → C₆H₅Br + HBr (FeBr₃)"]], ["r", ["Нитрование", "C₆H₆ + HNO₃ → C₆H₅NO₂ + H₂O (конц. H₂SO₄)"]], ["r", ["Сульфирование", "C₆H₆ + H₂SO₄(конц.) ⇄ C₆H₅SO₃H + H₂O"]], ["r", ["Алкилирование Фриделя–Крафтса", "C₆H₆ + CH₃Cl → C₆H₅CH₃ + HCl (AlCl₃)"]], ["h", "Реакции присоединения и окисления"], ["r", ["Гидрирование", "C₆H₆ + 3H₂ → C₆H₁₂ (Ni, t, p)"]], ["r", ["Горение", "2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O"]], ["p", "У гомологов бензола важны реакции в боковой цепи: радикальное галогенирование и окисление до карбоновых кислот. Например, толуол окисляется до бензойной кислоты."], ["r", ["Окисление боковой цепи", "C₆H₅CH₃ + [O] → C₆H₅COOH"]], ["h", "Получение"], ["ul", ["дегидроциклизация алканов: C₆H₁₄ → C₆H₆ + 4H₂", "тримеризация ацетилена: 3C₂H₂ → C₆H₆", "выделение из каменноугольной смолы и нефтепродуктов"]], ["h", "Ориентирующее влияние заместителей"], ["p", "Алкильные и гидроксильные группы облегчают замещение и направляют новый заместитель в орто- и пара-положения. Нитрогруппа, карбоксильная группа и другие электроноакцепторные заместители дезактивируют кольцо и ориентируют в мета-положение."], ["h", "Боковая цепь и ориентация"], ["p", "Галогены дезактивируют кольцо, но направляют замещение в орто- и пара-положения. У алкилбензолов различают замещение в кольце и в боковой цепи."], ["f", "C₆H₅CH₃ + Cl₂ → C₆H₅CH₂Cl + HCl (hν)"], ["f", "C₆H₅CH₃ + 2KMnO₄ → C₆H₅COOK + 2MnO₂ + KOH + H₂O (t)"], ["h", "Первоисточник"], ["p", "Сделано по § 6: строение бензола, свойства ароматической системы, реакции замещения в кольце и реакции боковой цепи."]], "book": "Органическая химия, 2018", "illustration": "bookO6"}, {"id": "bookO7", "s": "chem", "title": "Гидроксильные соединения", "min": 14, "body": [["h", "Общая характеристика"], ["p", "К гидроксильным соединениям относят спирты и фенолы. Спирты содержат гидроксильную группу –OH, связанную с насыщенным атомом углерода; фенолы содержат –OH, непосредственно связанную с ароматическим кольцом. Между этими классами есть существенные различия в свойствах."], ["h", "Спирты: классификация и номенклатура"], ["p", "Спирты бывают одноатомные и многоатомные, первичные, вторичные и третичные. Названия строят от названия углеводорода с добавлением суффикса -ол: этанол, пропан-2-ол, этиленгликоль, глицерин."], ["h", "Физические свойства"], ["p", "Низшие спирты хорошо смешиваются с водой благодаря водородным связям; с увеличением углеводородного радикала растворимость уменьшается. Температуры кипения выше, чем у соответствующих углеводородов."], ["h", "Химические свойства спиртов"], ["r", ["Взаимодействие с металлами", "2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂↑"]], ["r", ["Замещение гидроксильной группы", "C₂H₅OH + HBr → C₂H₅Br + H₂O"]], ["r", ["Дегидратация внутримолекулярная", "C₂H₅OH → CH₂=CH₂ + H₂O (H₂SO₄, 170°C)"]], ["r", ["Дегидратация межмолекулярная", "2C₂H₅OH → C₂H₅–O–C₂H₅ + H₂O (H₂SO₄, 140°C)"]], ["r", ["Окисление первичного спирта", "CH₃CH₂OH + [O] → CH₃CHO + H₂O → CH₃COOH"]], ["p", "Многоатомные спирты реагируют с Cu(OH)₂ с образованием ярко-синего раствора — это качественная реакция на многоатомные спирты."], ["h", "Фенолы"], ["p", "Фенол C₆H₅OH кислотнее спиртов, потому что феноксид-ион стабилизирован ароматической системой. Поэтому фенол реагирует не только с активными металлами, но и со щелочами."], ["r", ["Реакция фенола со щёлочью", "C₆H₅OH + NaOH → C₆H₅ONa + H₂O"]], ["r", ["Бромирование фенола", "C₆H₅OH + 3Br₂ → C₆H₂Br₃OH↓ + 3HBr"]], ["r", ["Качественная реакция с FeCl₃", "фенол + FeCl₃ → фиолетовое окрашивание"]], ["h", "Получение"], ["ul", ["гидратация алкенов и гидролиз галогеналканов — для спиртов", "брожение глюкозы: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂", "гидролиз галогенаренов и кумольный метод — для фенола"]], ["h", "Дополнительные свойства спиртов и фенолов"], ["p", "Первичные спирты окисляются до альдегидов, вторичные до кетонов, третичные обычно устойчивы к мягкому окислению. Фенол не вытесняет угольную кислоту из её солей."], ["f", "CH₃CH₂OH + CuO → CH₃CHO + Cu + H₂O (t)"], ["f", "CH₃CH(OH)CH₃ + CuO → CH₃COCH₃ + Cu + H₂O (t)"], ["f", "2C₆H₅OH + 2Na → 2C₆H₅ONa + H₂↑"], ["h", "Первоисточник"], ["p", "Конспект соответствует § 7: спирты и фенолы рассмотрены раздельно, с акцентом на их сходство и различия, свойства и качественные реакции."]], "book": "Органическая химия, 2018", "illustration": "bookO7"}, {"id": "bookO8", "s": "chem", "title": "Карбонильные соединения", "min": 13, "body": [["h", "Общая характеристика"], ["p", "К карбонильным соединениям относят альдегиды и кетоны. Их общая функциональная группа — карбонильная >C=O. Альдегиды содержат группу –CHO, кетоны — группу >CO между двумя углеводородными радикалами."], ["h", "Строение и номенклатура"], ["p", "Карбонильный атом углерода находится в sp²-гибридизации. Названия альдегидов часто заканчиваются на -аль: метаналь, этаналь; кетонов — на -он: пропанон."], ["h", "Физические свойства"], ["p", "Низшие альдегиды и кетоны — бесцветные летучие вещества. Карбонильная группа полярна, поэтому растворимость низших представителей в воде заметна, но водородных связей между собственными молекулами меньше, чем у спиртов."], ["h", "Химические свойства"], ["r", ["Гидрирование альдегида", "CH₃CHO + H₂ → CH₃CH₂OH"]], ["r", ["Гидрирование кетона", "CH₃COCH₃ + H₂ → CH₃CH(OH)CH₃"]], ["r", ["Окисление альдегидов", "2CH₃CHO + O₂ → 2CH₃COOH"]], ["p", "Альдегиды легко окисляются до карбоновых кислот, а кетоны окисляются значительно труднее. Поэтому именно альдегиды дают качественные реакции на окисление."], ["r", ["Реакция серебряного зеркала", "R–CHO + 2[Ag(NH₃)₂]OH → R–COONH₄ + 2Ag↓ + 3NH₃ + H₂O"]], ["r", ["Реакция с Cu(OH)₂", "R–CHO + 2Cu(OH)₂ → R–COOH + Cu₂O↓ + 2H₂O"]], ["p", "Для формальдегида и ацетальдегида особенно важны окислительно-восстановительные свойства и реакции поликонденсации/полимеризации в прикладных задачах."], ["h", "Получение"], ["ul", ["окисление или дегидрирование первичных спиртов — для альдегидов", "окисление или дегидрирование вторичных спиртов — для кетонов", "гидратация ацетилена даёт ацетальдегид"]], ["h", "Присоединение и окисление"], ["p", "Полярность C=O определяет присоединение нуклеофилов. Формальдегид при полном окислении может дать CO₂."], ["f", "CH₃CHO + HCN ⇌ CH₃CH(OH)CN"], ["f", "CH₃CHO + H₂ → C₂H₅OH (Ni)"], ["h", "Первоисточник"], ["p", "Сделано по § 8: функциональная группа, свойства альдегидов и кетонов, качественные реакции и основные способы получения."]], "book": "Органическая химия, 2018", "illustration": "bookO8"}, {"id": "bookO9", "s": "chem", "title": "Карбоновые кислоты и их производные", "min": 14, "body": [["h", "Введение"], ["p", "Карбоновые кислоты содержат карбоксильную группу –COOH. Для одноосновных насыщенных монокарбоновых кислот характерна общая формула CₙH₂ₙ₊₁COOH. В учебнике вместе с кислотами обычно рассматривают их соли, сложные эфиры, ангидриды, хлорангидриды и амиды как важнейшие производные."], ["h", "Номенклатура и классификация"], ["p", "Кислоты бывают одноосновные и многоосновные, насыщенные и ненасыщенные, предельные и ароматические. Названия: метановая (муравьиная), этановая (уксусная), бензойная кислота."], ["h", "Физические свойства"], ["p", "Низшие кислоты — жидкости с характерным запахом, хорошо растворимы в воде. Высшие кислоты — твёрдые вещества. За счёт водородных связей температуры кипения карбоновых кислот высоки."], ["h", "Химические свойства карбоновых кислот"], ["p", "Карбоновые кислоты проявляют общие свойства кислот: реагируют с металлами, основаниями, основными оксидами и солями слабых кислот."], ["r", ["С металлами", "2CH₃COOH + 2Na → 2CH₃COONa + H₂↑"]], ["r", ["Нейтрализация", "CH₃COOH + NaOH → CH₃COONa + H₂O"]], ["r", ["С карбонатами", "2CH₃COOH + Na₂CO₃ → 2CH₃COONa + H₂O + CO₂↑"]], ["r", ["Этерификация", "CH₃COOH + C₂H₅OH ⇄ CH₃COOC₂H₅ + H₂O (H₂SO₄)"]], ["p", "Муравьиная кислота сочетает кислотные свойства со свойствами альдегида и способна давать серебряное зеркало."], ["h", "Производные карбоновых кислот"], ["ul", ["соли — продукты замещения атома водорода на металл", "сложные эфиры — продукты взаимодействия кислоты и спирта", "жиры — сложные эфиры глицерина и высших карбоновых кислот", "амиды и хлорангидриды — важные производные для органического синтеза"]], ["h", "Получение"], ["ul", ["окисление первичных спиртов и альдегидов", "окисление боковых цепей аренов", "гидролиз нитрилов и производных"]], ["h", "Особо важные примеры"], ["ul", ["уксусная кислота CH₃COOH", "муравьиная кислота HCOOH", "стеариновая кислота C₁₇H₃₅COOH", "олеиновая кислота C₁₇H₃₃COOH"]], ["h", "Дополнительные кислотные свойства"], ["p", "Сила карбоновой кислоты зависит от заместителей. Электроноакцепторные заместители усиливают кислотность. Ненасыщенные кислоты реагируют по двойной связи."], ["f", "2CH₃COOH + CaO → (CH₃COO)₂Ca + H₂O"], ["f", "CH₂=CHCOOH + H₂ → CH₃CH₂COOH (Ni)"], ["f", "CH₃COOH + PCl₅ → CH₃COCl + POCl₃ + HCl"], ["h", "Первоисточник"], ["p", "Структура конспекта построена по § 9: свойства кислот, образование солей и эфиров, а также основные производные карбоновых кислот."]], "book": "Органическая химия, 2018", "illustration": "bookO9"}, {"id": "bookO10", "s": "chem", "title": "Эфиры", "min": 11, "body": [["h", "Общая характеристика"], ["p", "В школьном курсе под темой «Эфиры» обычно понимают простые эфиры R–O–R′ и, при рассмотрении гидролиза, сложные эфиры карбоновых кислот. Простые эфиры являются продуктами межмолекулярной дегидратации спиртов, а сложные эфиры — продуктами этерификации кислот и спиртов."], ["h", "Простые эфиры"], ["p", "Простые эфиры имеют атом кислорода между двумя углеводородными радикалами. Названия: диметиловый эфир, диэтиловый эфир. Они сравнительно инертны, плохо растворимы в воде, летучи и легковоспламенимы."], ["r", ["Получение простого эфира", "2C₂H₅OH → C₂H₅–O–C₂H₅ + H₂O (H₂SO₄, 140°C)"]], ["h", "Сложные эфиры"], ["p", "Сложные эфиры имеют функциональную группу –COO–. Они часто обладают приятным запахом. Многие природные ароматические вещества и жиры относятся к сложным эфирам."], ["r", ["Этерификация", "CH₃COOH + C₂H₅OH ⇄ CH₃COOC₂H₅ + H₂O"]], ["r", ["Кислотный гидролиз", "CH₃COOC₂H₅ + H₂O ⇄ CH₃COOH + C₂H₅OH (H⁺)"]], ["r", ["Щелочной гидролиз (омыление)", "CH₃COOC₂H₅ + NaOH → CH₃COONa + C₂H₅OH"]], ["h", "Жиры как представители сложных эфиров"], ["p", "Жиры — триэфиры глицерина и высших карбоновых кислот. При гидролизе образуют глицерин и кислоты, а при омылении — глицерин и соли высших кислот (мыла)."], ["h", "Получение и применение"], ["ul", ["простые эфиры — межмолекулярная дегидратация спиртов", "сложные эфиры — этерификация кислот и спиртов", "эфиры используют как растворители, ароматизаторы, компоненты косметических и пищевых систем"]], ["h", "Сложные эфиры и жиры"], ["p", "Гидролиз сложных эфиров в кислотной среде обратим, в щелочной практически необратим. Ненасыщенные жиры можно гидрировать."], ["f", "(C₁₇H₃₅COO)₃C₃H₅ + 3NaOH → 3C₁₇H₃₅COONa + C₃H₅(OH)₃"], ["f", "(C₁₇H₃₃COO)₃C₃H₅ + 3H₂ → (C₁₇H₃₅COO)₃C₃H₅ (Ni)"], ["h", "Первоисточник"], ["p", "Сделано по § 10, с объединением материала о простых и сложных эфирах в удобную для приложения схему."]], "book": "Органическая химия, 2018", "illustration": "bookO10"}, {"id": "bookO11", "s": "chem", "title": "Азотсодержащие соединения", "min": 13, "body": [["h", "Общая характеристика"], ["p", "К азотсодержащим соединениям школьного курса относят амины, нитросоединения, анилины и некоторые родственные классы. Важнейшая функциональная группа аминов — аминогруппа –NH₂; у нитросоединений — нитрогруппа –NO₂."], ["h", "Амины: классификация и строение"], ["p", "Амины рассматривают как производные аммиака, в котором атомы водорода заменены углеводородными радикалами. Они бывают первичные, вторичные и третичные, алифатические и ароматические."], ["h", "Физические и основные свойства аминов"], ["p", "Низшие амины — газы с резким запахом, растворимы в воде. Амины проявляют основные свойства за счёт неподелённой пары электронов атома азота."], ["r", ["Взаимодействие с кислотами", "CH₃NH₂ + HCl → CH₃NH₃Cl"]], ["r", ["Горение метиламина", "4CH₃NH₂ + 9O₂ → 4CO₂ + 10H₂O + 2N₂"]], ["h", "Анилин"], ["p", "Анилин C₆H₅NH₂ — ароматический амин. Его основность слабее, чем у алифатических аминов, из-за сопряжения неподелённой пары с бензольным кольцом. Однако он реагирует с кислотами и легко вступает в электрофильное замещение по кольцу."], ["r", ["Бромирование анилина", "C₆H₅NH₂ + 3Br₂ → C₆H₂Br₃NH₂↓ + 3HBr"]], ["h", "Нитросоединения"], ["p", "Нитросоединения получают нитрованием углеводородов. Важнейший представитель — нитробензол C₆H₅NO₂. При восстановлении нитросоединения превращаются в амины."], ["r", ["Восстановление нитробензола", "C₆H₅NO₂ + 3H₂ → C₆H₅NH₂ + 2H₂O"]], ["h", "Получение"], ["ul", ["амины — аммонолиз галогеналканов, восстановление нитросоединений", "нитросоединения — нитрование углеводородов"]], ["h", "Основность и соли аминов"], ["p", "Амины присоединяют протон. При взаимодействии соли амина со щёлочью выделяется свободный амин."], ["f", "CH₃NH₂ + H₂O ⇌ CH₃NH₃⁺ + OH⁻"], ["f", "CH₃NH₃Cl + NaOH → CH₃NH₂ + NaCl + H₂O"], ["h", "Первоисточник"], ["p", "Конспект выполнен по § 11: свойства аминов и нитросоединений, различие алифатических аминов и анилина, основные реакции и способы получения."]], "book": "Органическая химия, 2018", "illustration": "bookO11"}, {"id": "bookO12", "s": "chem", "title": "Аминокислоты и белки", "min": 13, "body": [["h", "Аминокислоты: строение и свойства"], ["p", "Аминокислоты содержат одновременно аминогруппу –NH₂ и карбоксильную группу –COOH. Поэтому они амфотерны: реагируют и с кислотами, и со щелочами. Простейший пример — глицин NH₂CH₂COOH."], ["f", "Глицин: NH₂CH₂COOH"], ["r", ["Реакция с кислотой", "NH₂CH₂COOH + HCl → [NH₃CH₂COOH]Cl"]], ["r", ["Реакция со щёлочью", "NH₂CH₂COOH + NaOH → NH₂CH₂COONa + H₂O"]], ["p", "В водных растворах аминокислоты существуют в виде цвиттер-ионов. Это объясняет их высокие температуры плавления и хорошую растворимость некоторых представителей."], ["h", "Пептидная связь"], ["p", "При взаимодействии карбоксильной группы одной аминокислоты с аминогруппой другой образуется пептидная связь –CO–NH– и выделяется вода. Так формируются дипептиды, полипептиды и белки."], ["r", ["Образование дипептида", "NH₂CH₂COOH + NH₂CH(R)COOH → NH₂CH₂CONHCH(R)COOH + H₂O"]], ["h", "Белки"], ["p", "Белки — природные высокомолекулярные полипептиды. Для них различают первичную, вторичную, третичную и четвертичную структуры. Белки выполняют каталитическую, структурную, транспортную, регуляторную и защитную функции."], ["h", "Свойства белков"], ["ul", ["гидролиз до аминокислот", "денатурация под действием температуры, кислот, солей тяжёлых металлов", "цветные реакции: биуретовая — на пептидную связь, ксантопротеиновая — на ароматические аминокислоты"]], ["h", "Реакции функциональных групп"], ["p", "Аминокислоты образуют соли и сложные эфиры, а также пептиды. Гидролиз пептидной связи обратен её образованию."], ["f", "NH₂CH₂COOH + C₂H₅OH ⇌ NH₂CH₂COOC₂H₅ + H₂O (условная схема этерификации)"], ["h", "Первоисточник"], ["p", "Сделано по § 12: амфотерность аминокислот, строение белков, пептидная связь и характерные качественные реакции."]], "book": "Органическая химия, 2018", "illustration": "bookO12"}, {"id": "bookO13", "s": "chem", "title": "Углеводы", "min": 14, "body": [["h", "Общая характеристика"], ["p", "Углеводы — кислородсодержащие органические соединения, которые обычно рассматривают как полиоксиальдегиды или поликетоны и их производные. Их делят на моносахариды, дисахариды и полисахариды."], ["h", "Моносахариды"], ["p", "Наиболее важны глюкоза и фруктоза. Глюкоза C₆H₁₂O₆ — альдегидоспирт, поэтому сочетает свойства многоатомного спирта и альдегида."], ["r", ["Брожение глюкозы", "C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂"]], ["r", ["Серебряное зеркало", "глюкоза + [Ag(NH₃)₂]OH → Ag↓ + ..."]], ["r", ["Реакция с Cu(OH)₂", "глюкоза растворяет Cu(OH)₂ с образованием ярко-синего раствора; при нагревании даёт Cu₂O↓"]], ["h", "Дисахариды"], ["p", "Сахароза C₁₂H₂₂O₁₁ — наиболее известный дисахарид. Она гидролизуется с образованием глюкозы и фруктозы."], ["r", ["Гидролиз сахарозы", "C₁₂H₂₂O₁₁ + H₂O → C₆H₁₂O₆ + C₆H₁₂O₆ (H⁺, ферменты)"]], ["p", "Сахароза не даёт серебряного зеркала, потому что в её циклической форме нет свободной альдегидной группы."], ["h", "Полисахариды"], ["p", "Крахмал и целлюлоза имеют формулу (C₆H₁₀O₅)ₙ. Крахмал служит запасным веществом растений, целлюлоза — основа клеточных стенок растений. Их свойства и биологическая роль различаются из-за пространственного строения."], ["r", ["Гидролиз крахмала", "(C₆H₁₀O₅)ₙ + nH₂O → nC₆H₁₂O₆"]], ["ul", ["качественная реакция на крахмал — синее окрашивание с йодом", "целлюлоза образует сложные эфиры (нитроцеллюлоза, ацетатцеллюлоза)", "глюкоза проявляет свойства многоатомного спирта и альдегида"]], ["h", "Восстановление и окисление глюкозы"], ["p", "При восстановлении карбонильной группы глюкозы образуется сорбит. Окисление альдегидной группы даёт глюконовую кислоту."], ["f", "C₆H₁₂O₆ + H₂ → C₆H₁₄O₆ (Ni)"], ["f", "C₆H₁₂O₆ + Br₂ + H₂O → C₆H₁₂O₇ + 2HBr"], ["h", "Первоисточник"], ["p", "Конспект соответствует § 13: глюкоза, сахароза, крахмал и целлюлоза раскрыты как обязательные объекты школьного курса."]], "book": "Органическая химия, 2018", "illustration": "bookO13"}, {"id": "bookO14", "s": "chem", "title": "Азотсодержащие гетероциклы", "min": 11, "body": [["h", "Общая характеристика"], ["p", "Гетероциклические соединения содержат в цикле не только атомы углерода, но и гетероатомы — азот, кислород или серу. В теме ЕГЭ чаще всего рассматривают азотсодержащие гетероциклы: пиридин, пиррол, имидазол и другие."], ["f", "Пиридин: C₅H₅N"], ["h", "Пиридин"], ["p", "Пиридин по строению напоминает бензол, в котором одна группа CH заменена атомом азота. Неподелённая пара азота не входит в ароматический секстет, поэтому пиридин проявляет основные свойства и образует соли с кислотами."], ["r", ["Образование соли пиридиния", "C₅H₅N + HCl → [C₅H₅NH]Cl"]], ["h", "Пиррол"], ["p", "В пирроле неподелённая пара атома азота входит в ароматическую систему, поэтому основные свойства выражены значительно слабее. Из-за высокой электронной плотности пиррол легко вступает в реакции замещения."], ["h", "Биологическое и прикладное значение"], ["p", "Гетероциклы широко распространены в природе: они входят в состав алкалоидов, витаминов, лекарств и нуклеиновых оснований. Поэтому важно знать их общие свойства и различия между пиридиновым и пиррольным типом строения."], ["h", "Сравнение азотных гетероциклов"], ["p", "Пиридиновый азот имеет свободную электронную пару вне ароматического секстета. Пиррольный азот отдаёт пару в ароматическую систему."], ["f", "C₅H₅N + H⁺ ⇌ C₅H₅NH⁺"], ["h", "Первоисточник"], ["p", "Сделано по § 14: выделены общие признаки гетероциклов, ароматичность и различия в основных свойствах пиридина и пиррола."]], "book": "Органическая химия, 2018", "illustration": "bookO14"}, {"id": "bookO15", "s": "chem", "title": "Нуклеиновые кислоты", "min": 12, "body": [["h", "Состав и мономеры"], ["p", "Нуклеиновые кислоты — природные биополимеры, мономерами которых являются нуклеотиды. Каждый нуклеотид состоит из остатка фосфорной кислоты, пентозы (рибозы или дезоксирибозы) и азотистого основания."], ["ul", ["в РНК сахар — рибоза, в ДНК — дезоксирибоза", "основания ДНК: аденин, тимин, гуанин, цитозин", "основания РНК: аденин, урацил, гуанин, цитозин"]], ["h", "ДНК"], ["p", "ДНК имеет двойную спираль. Цепи антипараллельны и удерживаются водородными связями между комплементарными основаниями: A=T, G≡C. ДНК хранит и передаёт наследственную информацию."], ["h", "РНК"], ["p", "РНК чаще одноцепочечна. Различают мРНК, тРНК и рРНК: они участвуют в реализации наследственной информации при биосинтезе белка."], ["h", "Биологическая роль"], ["p", "Последовательность нуклеотидов в ДНК определяет последовательность аминокислот в белке через генетический код. Репликация обеспечивает удвоение ДНК, транскрипция — синтез РНК, трансляция — синтез белка."], ["h", "Что важно для запоминания"], ["ul", ["строение нуклеотида", "различия ДНК и РНК", "комплементарность оснований", "связь нуклеиновых кислот с биосинтезом белка"]], ["h", "Связи в нуклеиновых кислотах"], ["p", "Нуклеозид состоит из сахара и основания; нуклеотид дополнительно содержит фосфат. Соседние нуклеотиды соединены фосфодиэфирными связями."], ["f", "Основание + пентоза → нуклеозид; нуклеозид + фосфат → нуклеотид (схема состава)"], ["h", "Первоисточник"], ["p", "Тема отражает § 15 и адаптирована под формат приложения: химическая природа нуклеотидов, строение ДНК и РНК, роль в наследственности."]], "book": "Органическая химия, 2018", "illustration": "bookO15"}, {"id": "bookO16", "s": "chem", "title": "Высокомолекулярные соединения", "min": 12, "body": [["h", "Общие понятия"], ["p", "Высокомолекулярные соединения (полимеры) — вещества с очень большой относительной молекулярной массой, построенные из повторяющихся звеньев — мономеров. В школьном курсе различают реакции полимеризации и поликонденсации."], ["h", "Полимеризация"], ["p", "Полимеризация — соединение большого числа одинаковых молекул-мономеров без выделения побочных продуктов. Чаще всего так полимеризуются алкены и их производные."], ["r", ["Полиэтилен", "nCH₂=CH₂ → (–CH₂–CH₂–)ₙ"]], ["r", ["Поливинилхлорид", "nCH₂=CHCl → (–CH₂–CHCl–)ₙ"]], ["r", ["Полистирол", "nCH₂=CHC₆H₅ → (–CH₂–CH(C₆H₅)–)ₙ"]], ["h", "Поликонденсация"], ["p", "Поликонденсация — образование полимера с выделением низкомолекулярного побочного продукта, например воды или аммиака. Так получают полиамиды, полиэфиры, фенолформальдегидные смолы."], ["h", "Природные и синтетические полимеры"], ["ul", ["природные: белки, нуклеиновые кислоты, крахмал, целлюлоза, натуральный каучук", "синтетические: полиэтилен, ПВХ, капрон, лавсан, синтетические каучуки"]], ["h", "Свойства и применение"], ["p", "Свойства полимеров зависят от строения цепей, степени полимеризации и наличия поперечных связей. Полимеры широко используют в производстве волокон, пластмасс, эластомеров и плёнок."], ["h", "Сравнение способов синтеза"], ["p", "В полимеризации мономер с кратной связью даёт звенья без отщепления молекул. В поликонденсации взаимодействуют функциональные группы."], ["f", "nCH₂=CHCH₃ → [–CH₂–CH(CH₃)–]ₙ"], ["h", "Первоисточник"], ["p", "Источник темы: Новошинские, Органическая химия, 2018, глава V «Высокомолекулярные соединения (полимеры)», с. 166–173. Авторский конспект."]], "book": "Органическая химия, 2018", "illustration": "bookO16"}];

QUIZ = QUIZ.concat([{"id": "qe27_1", "s": "chem", "title": "Атом и электронные конфигурации", "q": [{"t": "Сколько электронов у Na⁺?", "o": ["12", "10", "11", "23"], "a": 1, "ex": "Протоны определяют заряд ядра; нейтроны различают изотопы; электроны заполняют орбитали по принципу Паули и правилу Хунда."}, {"t": "Сколько нейтронов в ³⁷Cl?", "o": ["20", "17", "37", "18"], "a": 0, "ex": "Изотопы имеют одинаковое Z, но различное A. Для иона число электронов равно Z минус алгебраический заряд. На одной орбитали максимум два электрона с противоположными спинами. При образовании катионов переходных металлов сначала удаляются внешние s-электроны. Пример: Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶"}, {"t": "Какой пример соответствует теме «Атом и электронные конфигурации»?", "o": ["Алмаз — атомная решётка; лёд — молекулярная", "2Mg + O₂ → 2MgO", "При γ = 2 повышение на 20 °C увеличивает скорость в 4 раза.", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶"], "a": 3, "ex": "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶"}]}, {"id": "qe27_2", "s": "chem", "title": "Периодичность", "q": [{"t": "Какой атом крупнее?", "o": ["F", "K", "Li", "Na"], "a": 1, "ex": "В периоде обычно растёт электроотрицательность и уменьшается радиус; вниз по группе радиус растёт. У элементов групп 13–18 число внешних электронов обычно равно номеру группы минус 10."}, {"t": "Какой атом больше по радиусу?", "o": ["Na", "Li", "F", "K"], "a": 3, "ex": "В периоде заряд ядра возрастает при одинаковом числе занятых слоёв. В группе сверху вниз появляются новые слои, поэтому радиус увеличивается. Кислотность высших оксидов обычно возрастает слева направо. Пример: Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный"}, {"t": "Какой пример соответствует теме «Периодичность»?", "o": ["При γ = 2 повышение на 20 °C увеличивает скорость в 4 раза.", "N₂ + 3H₂ ⇄ 2NH₃; повышение давления способствует образованию NH₃", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "2Mg + O₂ → 2MgO"], "a": 2, "ex": "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный"}]}, {"id": "qe27_3", "s": "chem", "title": "Связи и гибридизация", "q": [{"t": "Сколько π-связей в ацетилене?", "o": ["1", "3", "0", "2"], "a": 3, "ex": "Ковалентная связь возникает при обобществлении электронов; ионная — при притяжении ионов. Одинарная связь содержит σ, двойная — σ и π, тройная — σ и две π."}, {"t": "Сколько π-связей в этине?", "o": ["3", "0", "2", "1"], "a": 2, "ex": "Гибридизация определяется числом направлений σ-связей и неподелённых пар в простой модели. sp соответствует линейной форме, sp² — плоской треугольной, sp³ — тетраэдрической электронной геометрии. Водородная связь влияет на кипение воды и спиртов. Пример: H–O–H: угловая молекула; CH₄: тетраэдр"}, {"t": "Какой пример соответствует теме «Связи и гибридизация»?", "o": ["NH₄⁺ + H₂O ⇄ NH₃·H₂O + H⁺", "H–O–H: угловая молекула; CH₄: тетраэдр", "При γ = 2 повышение на 20 °C увеличивает скорость в 4 раза.", "N₂ + 3H₂ ⇄ 2NH₃; повышение давления способствует образованию NH₃"], "a": 1, "ex": "H–O–H: угловая молекула; CH₄: тетраэдр"}]}, {"id": "qe27_4", "s": "chem", "title": "Кристаллические решётки", "q": [{"t": "Какая решётка у алмаза?", "o": ["Металлическая", "Атомная", "Молекулярная", "Ионная"], "a": 1, "ex": "Ионные кристаллы проводят ток в расплаве; молекулярные обычно легкоплавки; атомные имеют прочные ковалентные связи; металлические проводят ток в твёрдом состоянии."}, {"t": "Какая решётка у сухого льда?", "o": ["Атомная", "Молекулярная", "Ионная", "Металлическая"], "a": 1, "ex": "При плавлении молекулярных кристаллов преодолеваются межмолекулярные взаимодействия, а не связи внутри молекул. Ионные вещества в твёрдом состоянии обычно не проводят ток из-за неподвижности ионов. Графит — исключение среди атомных кристаллов по проводимости. Пример: Алмаз — атомная решётка; лёд — молекулярная"}, {"t": "Какой пример соответствует теме «Кристаллические решётки»?", "o": ["Алмаз — атомная решётка; лёд — молекулярная", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "N₂ + 3H₂ ⇄ 2NH₃; повышение давления способствует образованию NH₃", "NH₄⁺ + H₂O ⇄ NH₃·H₂O + H⁺"], "a": 0, "ex": "Алмаз — атомная решётка; лёд — молекулярная"}]}, {"id": "qe27_5", "s": "chem", "title": "Классификация реакций", "q": [{"t": "Как называется реакция A + B → AB?", "o": ["Разложение", "Соединение", "Замещение", "Обмен"], "a": 1, "ex": "Реакции различают по составу реагентов и продуктов, тепловому эффекту, обратимости и изменению степеней окисления."}, {"t": "К какому типу относится разложение CaCO₃?", "o": ["Разложение", "Замещение", "Обмен", "Соединение"], "a": 0, "ex": "Соединение даёт один продукт из нескольких реагентов; разложение — несколько продуктов из одного вещества. Замещение включает простое и сложное вещество; обмен — два сложных вещества. Одна реакция может одновременно быть ОВР и экзотермической. Пример: 2Mg + O₂ → 2MgO"}, {"t": "Какой пример соответствует теме «Классификация реакций»?", "o": ["Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "NH₄⁺ + H₂O ⇄ NH₃·H₂O + H⁺", "2Mg + O₂ → 2MgO"], "a": 3, "ex": "2Mg + O₂ → 2MgO"}]}, {"id": "qe27_6", "s": "chem", "title": "Кинетика", "q": [{"t": "Что увеличивает скорость растворения мрамора в кислоте?", "o": ["Измельчение мрамора", "Охлаждение", "Уменьшение поверхности", "Разбавление кислоты"], "a": 0, "ex": "Скорость зависит от температуры, концентрации, площади контакта фаз и катализатора. Катализатор снижает энергию активации прямой и обратной реакции."}, {"t": "Что увеличивает скорость реакции мрамора с кислотой?", "o": ["Охлаждение", "Уменьшение концентрации кислоты", "Удаление части кислоты", "Измельчение мрамора"], "a": 3, "ex": "При увеличении температуры возрастает доля частиц с энергией выше энергии активации. Для гетерогенной реакции измельчение увеличивает поверхность контакта. Ингибиторы замедляют процессы. Пример: При γ = 2 повышение на 20 °C увеличивает скорость в 4 раза."}, {"t": "Какой пример соответствует теме «Кинетика»?", "o": ["Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "При γ = 2 повышение на 20 °C увеличивает скорость в 4 раза.", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶"], "a": 2, "ex": "При γ = 2 повышение на 20 °C увеличивает скорость в 4 раза."}]}, {"id": "qe27_7", "s": "chem", "title": "Равновесие", "q": [{"t": "Повышение давления смещает данное равновесие куда?", "o": ["Останавливает реакцию", "Не влияет", "К N₂", "К NH₃"], "a": 3, "ex": "По принципу Ле Шателье система противодействует внешнему воздействию. Давление влияет на газовые реакции с изменением числа молей газа. Катализатор не смещает равновесие."}, {"t": "Что изменяет катализатор при равновесии?", "o": ["Равновесный выход", "Тепловой эффект", "Скорость установления равновесия", "Константу равновесия"], "a": 2, "ex": "При добавлении реагента равновесие смещается в сторону его расходования. При нагревании предпочтительно эндотермическое направление. Изменение давления не смещает равновесие при равном числе молей газов. Пример: N₂ + 3H₂ ⇄ 2NH₃; повышение давления способствует образованию NH₃"}, {"t": "Какой пример соответствует теме «Равновесие»?", "o": ["H–O–H: угловая молекула; CH₄: тетраэдр", "N₂ + 3H₂ ⇄ 2NH₃; повышение давления способствует образованию NH₃", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный"], "a": 1, "ex": "N₂ + 3H₂ ⇄ 2NH₃; повышение давления способствует образованию NH₃"}]}, {"id": "qe27_8", "s": "chem", "title": "Диссоциация и гидролиз", "q": [{"t": "Среда раствора Na₂CO₃?", "o": ["Не определяется", "Кислая", "Щелочная", "Нейтральная"], "a": 2, "ex": "Сильные электролиты в разбавленном растворе диссоциируют практически полностью. Соль слабой кислоты и сильного основания обычно даёт щелочную среду."}, {"t": "Какова среда раствора Na₂CO₃?", "o": ["Невозможно определить", "Щелочная", "Кислая", "Нейтральная"], "a": 1, "ex": "Сильные кислоты, щёлочи и растворимые соли в полных ионных уравнениях записывают как ионы. Осадки, газы, воду и слабые электролиты оставляют молекулами. Гидролиз NH₄⁺ создаёт кислую среду. Пример: NH₄⁺ + H₂O ⇄ NH₃·H₂O + H⁺"}, {"t": "Какой пример соответствует теме «Диссоциация и гидролиз»?", "o": ["NH₄⁺ + H₂O ⇄ NH₃·H₂O + H⁺", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр"], "a": 0, "ex": "NH₄⁺ + H₂O ⇄ NH₃·H₂O + H⁺"}]}, {"id": "qe27_9", "s": "chem", "title": "ОВР", "q": [{"t": "Сколько электронов принимает Mn⁷⁺ при переходе в Mn²⁺?", "o": ["5", "7", "3", "2"], "a": 0, "ex": "Окисление — отдача электронов, восстановление — принятие. Число отданных и принятых электронов уравнивают."}, {"t": "Степень окисления Mn в KMnO₄?", "o": ["+7", "+2", "+4", "+6"], "a": 0, "ex": "Сумма степеней окисления в нейтральной частице равна нулю, в ионе — его заряду. Кислород обычно имеет −2, водород +1; в пероксидах и гидридах есть исключения. Электронный баланс не заменяет проверку атомов. Пример: 2FeCl₂ + Cl₂ → 2FeCl₃"}, {"t": "Какой пример соответствует теме «ОВР»?", "o": ["Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "2FeCl₂ + Cl₂ → 2FeCl₃"], "a": 3, "ex": "2FeCl₂ + Cl₂ → 2FeCl₃"}]}, {"id": "qe27_10", "s": "chem", "title": "Электролиз", "q": [{"t": "Какой процесс идёт на катоде?", "o": ["Восстановление", "Окисление", "Гидролиз", "Нейтрализация"], "a": 0, "ex": "На катоде идёт восстановление, на аноде окисление. В водном растворе конкурируют ионы и вода; в расплаве воды нет."}, {"t": "Какой процесс идёт на аноде?", "o": ["Восстановление", "Нейтрализация", "Гидролиз", "Окисление"], "a": 3, "ex": "На инертном аноде раствора хлоридов может выделяться хлор; для растворов сульфатов часто окисляется вода. На катоде раствора CuSO₄ выделяется медь. Учитывай материал электродов. Пример: Cu²⁺ + 2e⁻ → Cu"}, {"t": "Какой пример соответствует теме «Электролиз»?", "o": ["Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "Cu²⁺ + 2e⁻ → Cu", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶"], "a": 2, "ex": "Cu²⁺ + 2e⁻ → Cu"}]}, {"id": "qe27_11", "s": "chem", "title": "Классы и номенклатура неорганики", "q": [{"t": "Какой оксид амфотерный?", "o": ["CO₂", "SO₃", "Na₂O", "Al₂O₃"], "a": 3, "ex": "Оксиды, кислоты, основания, соли различают по составу. Соли бывают средними, кислыми и основными; амфотерные гидроксиды реагируют с кислотами и щелочами."}, {"t": "Какая соль кислая?", "o": ["KCl", "KNO₃", "KHCO₃", "K₂CO₃"], "a": 2, "ex": "В названиях солей переменная степень окисления металла обозначается римской цифрой. Кислые соли образуются при неполной нейтрализации многоосновных кислот. Пероксиды отличаются от обычных оксидов наличием связи O–O. Пример: FeCl₂ — хлорид железа(II); FeCl₃ — хлорид железа(III)"}, {"t": "Какой пример соответствует теме «Классы и номенклатура неорганики»?", "o": ["H–O–H: угловая молекула; CH₄: тетраэдр", "FeCl₂ — хлорид железа(II); FeCl₃ — хлорид железа(III)", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный"], "a": 1, "ex": "FeCl₂ — хлорид железа(II); FeCl₃ — хлорид железа(III)"}]}, {"id": "qe27_12", "s": "chem", "title": "Металлы и неметаллы", "q": [{"t": "Какой металл вытеснит медь из раствора CuSO₄?", "o": ["Fe", "Ag", "Au", "Pt"], "a": 0, "ex": "Активность металлов определяет возможность вытеснения водорода из неокисляющих кислот и металлов из растворов солей. Неметаллы могут быть окислителями и восстановителями."}, {"t": "Какой металл не вытесняет водород из разбавленной HCl?", "o": ["Fe", "Cu", "Zn", "Mg"], "a": 1, "ex": "Металлы до водорода в ряду активности обычно вытесняют его из разбавленной HCl. Азотная и концентрированная серная кислоты реагируют иначе; водород обычно не выделяется. Al, Fe и Cr могут пассивироваться в холодных концентрированных кислотах. Пример: Zn + 2HCl → ZnCl₂ + H₂↑"}, {"t": "Какой пример соответствует теме «Металлы и неметаллы»?", "o": ["Zn + 2HCl → ZnCl₂ + H₂↑", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр"], "a": 0, "ex": "Zn + 2HCl → ZnCl₂ + H₂↑"}]}, {"id": "qe27_13", "s": "chem", "title": "Оксиды", "q": [{"t": "Какой оксид несолеобразующий?", "o": ["CO", "CaO", "SO₂", "P₂O₅"], "a": 0, "ex": "Основные оксиды реагируют с кислотами, кислотные — с основаниями, амфотерные — с обоими классами. CO и NO относятся к несолеобразующим."}, {"t": "Какой оксид амфотерный?", "o": ["ZnO", "CaO", "SO₂", "CO"], "a": 0, "ex": "Кислотные оксиды могут образовывать разные соли в зависимости от соотношения реагентов. Не каждый основной оксид взаимодействует с водой. Амфотерные оксиды реагируют с кислотами и при подходящих условиях со щелочами. Пример: CO₂ + NaOH → NaHCO₃"}, {"t": "Какой пример соответствует теме «Оксиды»?", "o": ["Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "CO₂ + NaOH → NaHCO₃"], "a": 3, "ex": "CO₂ + NaOH → NaHCO₃"}]}, {"id": "qe27_14", "s": "chem", "title": "Гидроксиды и кислоты", "q": [{"t": "Какой гидроксид амфотерный?", "o": ["Ba(OH)₂", "Zn(OH)₂", "NaOH", "KOH"], "a": 1, "ex": "Щёлочи — растворимые основания. Амфотерный Al(OH)₃ растворяется и в кислоте, и в избытке щёлочи. Кислоты реагируют с основаниями."}, {"t": "Какой гидроксид амфотерный?", "o": ["NaOH", "KOH", "Ba(OH)₂", "Al(OH)₃"], "a": 3, "ex": "При нагревании многие нерастворимые основания разлагаются до оксида и воды. Сильные кислоты в воде практически полностью диссоциируют. При нейтрализации многоосновной кислоты возможна кислая соль. Пример: Cu(OH)₂ → CuO + H₂O (t°)"}, {"t": "Какой пример соответствует теме «Гидроксиды и кислоты»?", "o": ["Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "Cu(OH)₂ → CuO + H₂O (t°)", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶"], "a": 2, "ex": "Cu(OH)₂ → CuO + H₂O (t°)"}]}, {"id": "qe27_15", "s": "chem", "title": "Соли", "q": [{"t": "Какой осадок образуется при смешении BaCl₂ и Na₂SO₄?", "o": ["NaCl", "Na₂SO₄", "BaCl₂", "BaSO₄"], "a": 3, "ex": "Обмен в растворах протекает при образовании осадка, газа или слабого электролита. Кислые соли содержат замещаемый водород."}, {"t": "Какой газ образуется при действии HCl на карбонат?", "o": ["O₂", "NH₃", "CO₂", "H₂"], "a": 2, "ex": "Для обмена в растворе проверяй растворимость продуктов. Карбонаты с кислотами дают CO₂; сульфиты — SO₂; аммонийные соли со щёлочью при нагревании — NH₃. Пример: Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂↑"}, {"t": "Какой пример соответствует теме «Соли»?", "o": ["H–O–H: угловая молекула; CH₄: тетраэдр", "Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂↑", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный"], "a": 1, "ex": "Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂↑"}]}, {"id": "qe27_16", "s": "chem", "title": "Химия элементов", "q": [{"t": "Какой ион окисляется хлором?", "o": ["K⁺", "Na⁺", "Br⁻", "F⁻"], "a": 2, "ex": "Щелочные металлы образуют щёлочи; Al и Zn амфотерны; Fe имеет степени +2 и +3; Cu реагирует с кислотами-окислителями. Галогены вытесняют менее активные галогены. S, N, P, C и Si образуют характерные кислотные оксиды."}, {"t": "Какой галоген вытесняет бром из KBr?", "o": ["Ни один", "Cl₂", "I₂", "Br₂"], "a": 1, "ex": "Щелочные металлы реагируют с водой; магний — с горячей водой или паром; алюминий защищён оксидной плёнкой. Железо образует соединения Fe(II) и Fe(III), медь — преимущественно Cu(II). Пример: 2Na + 2H₂O → 2NaOH + H₂↑"}, {"t": "Какой пример соответствует теме «Химия элементов»?", "o": ["2Na + 2H₂O → 2NaOH + H₂↑", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр"], "a": 0, "ex": "2Na + 2H₂O → 2NaOH + H₂↑"}]}, {"id": "qe27_17", "s": "chem", "title": "Качественные реакции", "q": [{"t": "Какой реагент выявляет сульфат-ионы?", "o": ["BaCl₂", "H₂O", "NaCl", "KNO₃"], "a": 0, "ex": "Ag⁺ обнаруживает Cl⁻ белым осадком; Ba²⁺ обнаруживает SO₄²⁻ белым осадком, устойчивым к разбавленным кислотам. Fe³⁺ с SCN⁻ даёт красное окрашивание."}, {"t": "Какого цвета осадок Fe(OH)₃?", "o": ["Бурый", "Голубой", "Белый", "Чёрный"], "a": 0, "ex": "Для обнаружения карбонатов используют выделение CO₂ и помутнение известковой воды. Ионы Fe²⁺ с OH⁻ дают зеленоватый осадок, Fe³⁺ — бурый. AgBr кремовый, AgI жёлтый. Пример: HCl + AgNO₃ → HNO₃ + AgCl↓"}, {"t": "Какой пример соответствует теме «Качественные реакции»?", "o": ["Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "HCl + AgNO₃ → HNO₃ + AgCl↓"], "a": 3, "ex": "HCl + AgNO₃ → HNO₃ + AgCl↓"}]}, {"id": "qe27_18", "s": "chem", "title": "Органическое строение и изомерия", "q": [{"t": "Какой класс межклассово изомерен предельным одноатомным спиртам?", "o": ["Простые эфиры", "Алкины", "Алкены", "Карбоновые кислоты"], "a": 0, "ex": "Свойства зависят от порядка соединения атомов и их взаимного влияния. Изомеры имеют одинаковую молекулярную формулу, гомологи отличаются на группы CH₂."}, {"t": "Какая формула у обоих изомеров этанола и диметилового эфира?", "o": ["C₂H₄O", "C₂H₆", "C₂H₄O₂", "C₂H₆O"], "a": 3, "ex": "Различают изомерию углеродного скелета, положения кратной связи и функциональной группы, межклассовую и пространственную. При выборе названия главная цепь должна включать старшую группу. Пример: CH₃CH₂OH и CH₃OCH₃ — межклассовые изомеры"}, {"t": "Какой пример соответствует теме «Органическое строение и изомерия»?", "o": ["Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "CH₃CH₂OH и CH₃OCH₃ — межклассовые изомеры", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶"], "a": 2, "ex": "CH₃CH₂OH и CH₃OCH₃ — межклассовые изомеры"}]}, {"id": "qe27_19", "s": "chem", "title": "Алканы и циклоалканы", "q": [{"t": "Каков тип реакции хлорирования метана на свету?", "o": ["Обмен", "Поликонденсация", "Замещение", "Присоединение"], "a": 2, "ex": "Алканы вступают в радикальное замещение и горение; малые циклы могут вступать в присоединение с раскрытием кольца."}, {"t": "Какой процесс характерен для метана с хлором на свету?", "o": ["Этерификация", "Гидролиз", "Замещение", "Гидратация"], "a": 2, "ex": "Алканы имеют формулу CₙH₂ₙ₊₂. При радикальном хлорировании возможна смесь продуктов. Крекинг даёт более короткие углеводороды. Циклоалканы с одним кольцом имеют формулу CₙH₂ₙ. Пример: C₂H₆ → C₂H₄ + H₂ (t°, кат.)"}, {"t": "Какой пример соответствует теме «Алканы и циклоалканы»?", "o": ["H–O–H: угловая молекула; CH₄: тетраэдр", "C₂H₆ → C₂H₄ + H₂ (t°, кат.)", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный"], "a": 1, "ex": "C₂H₆ → C₂H₄ + H₂ (t°, кат.)"}]}, {"id": "qe27_20", "s": "chem", "title": "Алкены, диены и алкины", "q": [{"t": "Какое вещество обесцвечивает бромную воду без освещения?", "o": ["Этан", "Пропан", "Метан", "Этен"], "a": 3, "ex": "Кратные связи допускают присоединение водорода, галогенов и галогеноводородов. Сопряжённые диены дают 1,2- и 1,4-присоединение. Терминальные алкины имеют подвижный атом водорода."}, {"t": "Продукт гидратации ацетилена по Кучерову?", "o": ["Этан", "Этаналь", "Этанол", "Этен"], "a": 1, "ex": "При присоединении HX к несимметричному алкену в обычных условиях применяется правило Марковникова. Обесцвечивание бромной воды служит признаком многих непредельных соединений. При гидратации ацетилена образуется этаналь. Пример: CH₃CH=CH₂ + HBr → CH₃CHBrCH₃"}, {"t": "Какой пример соответствует теме «Алкены, диены и алкины»?", "o": ["CH₃CH=CH₂ + HBr → CH₃CHBrCH₃", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр"], "a": 0, "ex": "CH₃CH=CH₂ + HBr → CH₃CHBrCH₃"}]}, {"id": "qe27_21", "s": "chem", "title": "Арены", "q": [{"t": "Продукт нитрования бензола?", "o": ["Анилин", "Нитробензол", "Толуол", "Фенол"], "a": 1, "ex": "Бензольное кольцо устойчиво благодаря делокализации π-электронов. Характерно электрофильное замещение, а не обычное присоединение."}, {"t": "Какой тип реакции характерен для нитрования бензола?", "o": ["Замещение", "Присоединение", "Гидролиз", "Полимеризация"], "a": 0, "ex": "Бензол нитруется в присутствии серной кислоты, галогенируется с катализатором. Толуол легче вступает в замещение в кольце; при окислении боковой цепи образуется бензойная кислота. Пример: C₆H₆ + Br₂ → C₆H₅Br + HBr (FeBr₃)"}, {"t": "Какой пример соответствует теме «Арены»?", "o": ["Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "C₆H₆ + Br₂ → C₆H₅Br + HBr (FeBr₃)"], "a": 3, "ex": "C₆H₆ + Br₂ → C₆H₅Br + HBr (FeBr₃)"}]}, {"id": "qe27_22", "s": "chem", "title": "Спирты и фенолы", "q": [{"t": "Какое вещество реагирует с NaOH в водном растворе?", "o": ["Фенол", "Метанол", "Пропанол", "Этанол"], "a": 0, "ex": "Спирты реагируют с активными металлами, подвергаются дегидратации и окислению. Фенол проявляет более выраженные кислотные свойства и реагирует со щёлочью."}, {"t": "Какой продукт окисления пропанола-2?", "o": ["Пропаналь", "Пропан", "Пропен", "Пропанон"], "a": 3, "ex": "Первичные спирты окисляются до альдегидов и далее кислот, вторичные — до кетонов. Многоатомные спирты с соседними OH-группами образуют ярко-синий раствор с Cu(OH)₂. Фенол с бромной водой даёт белый осадок. Пример: C₆H₅OH + NaOH → C₆H₅ONa + H₂O"}, {"t": "Какой пример соответствует теме «Спирты и фенолы»?", "o": ["Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "C₆H₅OH + NaOH → C₆H₅ONa + H₂O", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶"], "a": 2, "ex": "C₆H₅OH + NaOH → C₆H₅ONa + H₂O"}]}, {"id": "qe27_23", "s": "chem", "title": "Альдегиды и кетоны", "q": [{"t": "Какой реагент отличает этаналь от пропанона?", "o": ["H₂ при катализаторе", "NaCl", "Аммиачный раствор оксида серебра", "Вода"], "a": 2, "ex": "Альдегидная группа –CHO окисляется до карбоксильной; кетоны обычно не дают реакцию серебряного зеркала. Оба класса гидрируются до спиртов."}, {"t": "Какой продукт гидрирования ацетона?", "o": ["Пропаналь", "Пропановая кислота", "Пропанол-2", "Пропанол-1"], "a": 2, "ex": "Альдегиды восстанавливают реактив Толленса и при нагревании Cu(OH)₂ до Cu₂O. Кетоны обычно не проявляют эти свойства. При восстановлении кетонов образуются вторичные спирты. Пример: CH₃CHO + 2Cu(OH)₂ → CH₃COOH + Cu₂O↓ + 2H₂O"}, {"t": "Какой пример соответствует теме «Альдегиды и кетоны»?", "o": ["H–O–H: угловая молекула; CH₄: тетраэдр", "CH₃CHO + 2Cu(OH)₂ → CH₃COOH + Cu₂O↓ + 2H₂O", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный"], "a": 1, "ex": "CH₃CHO + 2Cu(OH)₂ → CH₃COOH + Cu₂O↓ + 2H₂O"}]}, {"id": "qe27_24", "s": "chem", "title": "Карбоновые кислоты и эфиры", "q": [{"t": "Продукт щелочного гидролиза жира кроме глицерина?", "o": ["Альдегиды", "Амины", "Соли жирных кислот", "Алкены"], "a": 2, "ex": "Кислоты реагируют с основаниями и карбонатами; сложные эфиры образуются при этерификации и гидролизуются. Щелочной гидролиз жиров даёт глицерин и соли кислот."}, {"t": "Какой продукт омыления этилового ацетата кроме этанола?", "o": ["Этен", "Ацетат натрия", "Уксусный альдегид", "Метанол"], "a": 1, "ex": "Карбоксильная группа определяет кислотные свойства. Этерификация обратима, удаление воды увеличивает выход эфира. Щелочной гидролиз эфира даёт соль кислоты и спирт. Пример: CH₃COOC₂H₅ + NaOH → CH₃COONa + C₂H₅OH"}, {"t": "Какой пример соответствует теме «Карбоновые кислоты и эфиры»?", "o": ["CH₃COOC₂H₅ + NaOH → CH₃COONa + C₂H₅OH", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр"], "a": 0, "ex": "CH₃COOC₂H₅ + NaOH → CH₃COONa + C₂H₅OH"}]}, {"id": "qe27_25", "s": "chem", "title": "Углеводы", "q": [{"t": "Какой углевод даёт синее окрашивание с йодом?", "o": ["Сахароза", "Крахмал", "Фруктоза", "Глюкоза"], "a": 1, "ex": "Глюкоза — моносахарид, сахароза — дисахарид, крахмал и целлюлоза — полисахариды. Крахмал даёт синее окрашивание с йодом."}, {"t": "Какой углевод даёт синее окрашивание с йодом?", "o": ["Крахмал", "Глюкоза", "Сахароза", "Целлюлоза"], "a": 0, "ex": "Глюкоза проявляет свойства многоатомного спирта и альдегида. Сахароза не даёт серебряного зеркала до гидролиза. Целлюлоза и крахмал имеют одинаковую общую формулу, но различаются строением и свойствами. Пример: C₁₂H₂₂O₁₁ + H₂O → C₆H₁₂O₆ + C₆H₁₂O₆ (глюкоза и фруктоза)"}, {"t": "Какой пример соответствует теме «Углеводы»?", "o": ["Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "C₁₂H₂₂O₁₁ + H₂O → C₆H₁₂O₆ + C₆H₁₂O₆ (глюкоза и фруктоза)"], "a": 3, "ex": "C₁₂H₂₂O₁₁ + H₂O → C₆H₁₂O₆ + C₆H₁₂O₆ (глюкоза и фруктоза)"}]}, {"id": "qe27_26", "s": "chem", "title": "Амины, аминокислоты, белки", "q": [{"t": "Какое вещество амфотерно?", "o": ["Метиламин", "Этанол", "Глицин", "Бензол"], "a": 2, "ex": "Амины проявляют основные свойства. Аминокислоты амфотерны; белки состоят из аминокислотных остатков, связанных пептидными связями. Азот входит и в состав некоторых гетероциклов."}, {"t": "Какая связь соединяет остатки аминокислот?", "o": ["Гликозидная", "Ионная", "Фосфодиэфирная", "Пептидная"], "a": 3, "ex": "Амины принимают протон неподелённой парой азота. Анилин слабее алифатических аминов. Аминокислоты содержат кислотную и основную группы; при образовании пептида выделяется вода. Денатурация нарушает пространственную структуру белка. Пример: CH₃NH₂ + HCl → [CH₃NH₃]Cl"}, {"t": "Какой пример соответствует теме «Амины, аминокислоты, белки»?", "o": ["Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "CH₃NH₂ + HCl → [CH₃NH₃]Cl", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶"], "a": 2, "ex": "CH₃NH₂ + HCl → [CH₃NH₃]Cl"}]}, {"id": "qe27_27", "s": "chem", "title": "Полимеры", "q": [{"t": "Мономер полиэтилена?", "o": ["Этин", "Этен", "Этанол", "Этан"], "a": 1, "ex": "При полимеризации мономеры соединяются без выделения низкомолекулярного продукта; при поликонденсации он обычно выделяется."}, {"t": "Мономер поливинилхлорида?", "o": ["Хлорэтан", "Пропен", "Хлорэтен", "Этен"], "a": 2, "ex": "Мономер — исходная низкомолекулярная частица, звено — повторяющийся фрагмент цепи. Полиэтилен и полипропилен образуются полимеризацией; полиамиды могут образовываться поликонденсацией. Пример: nCH₂=CHCl → (–CH₂–CHCl–)ₙ"}, {"t": "Какой пример соответствует теме «Полимеры»?", "o": ["H–O–H: угловая молекула; CH₄: тетраэдр", "nCH₂=CHCl → (–CH₂–CHCl–)ₙ", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный"], "a": 1, "ex": "nCH₂=CHCl → (–CH₂–CHCl–)ₙ"}]}, {"id": "qe27_28", "s": "chem", "title": "Лаборатория и разделение смесей", "q": [{"t": "Как отделить песок от воды?", "o": ["Фильтрование", "Титрование", "Нейтрализация", "Электролиз"], "a": 0, "ex": "Фильтрование отделяет нерастворимый осадок; перегонка использует различия температур кипения; кристаллизация — растворимость. При работе соблюдают инструкции и используют защиту."}, {"t": "Как отделить песок от воды?", "o": ["Сублимацией", "Фильтрованием", "Перегонкой", "Хроматографией"], "a": 1, "ex": "Разделение смесей основано на различиях физических свойств. Делительная воронка разделяет несмешивающиеся жидкости. Для раствора соли выпаривание даёт соль, перегонка позволяет получить растворитель. Пример: Раствор соли → перегонка → вода (дистиллят)"}, {"t": "Какой пример соответствует теме «Лаборатория и разделение смесей»?", "o": ["Раствор соли → перегонка → вода (дистиллят)", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр"], "a": 0, "ex": "Раствор соли → перегонка → вода (дистиллят)"}]}, {"id": "qe27_29", "s": "chem", "title": "Промышленность и экология", "q": [{"t": "Исходные вещества синтеза аммиака?", "o": ["NO и O₂", "N₂ и O₂", "NH₄Cl и H₂O", "N₂ и H₂"], "a": 3, "ex": "Аммиак получают из азота и водорода; серную кислоту — контактным способом через SO₃. Металлургия использует восстановление и электролиз. Химические отходы требуют надлежащей утилизации."}, {"t": "Какой катализатор типичен для контактного процесса?", "o": ["V₂O₅", "NaCl", "CaCO₃", "CuSO₄"], "a": 0, "ex": "Промышленные процессы учитывают равновесие, скорость, стоимость сырья и безопасность. В синтезе аммиака давление благоприятствует выходу, а температура выбирается как компромисс. В контактном процессе окисление SO₂ катализируется V₂O₅. Пример: N₂ + 3H₂ ⇄ 2NH₃"}, {"t": "Какой пример соответствует теме «Промышленность и экология»?", "o": ["Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "N₂ + 3H₂ ⇄ 2NH₃"], "a": 3, "ex": "N₂ + 3H₂ ⇄ 2NH₃"}]}, {"id": "qe27_30", "s": "chem", "title": "Растворы и массовая доля", "q": [{"t": "10 г соли в 90 г воды. Массовая доля соли?", "o": ["90%", "9%", "11,1%", "10%"], "a": 3, "ex": "Массовая доля равна отношению массы компонента к массе всей смеси. При добавлении воды масса растворённого вещества сохраняется."}, {"t": "Массовая доля 15 г соли в 150 г раствора?", "o": ["15%", "1%", "90%", "10%"], "a": 3, "ex": "Масса раствора равна сумме масс растворённого вещества и растворителя. При смешивании без реакции складывают массы растворённого вещества. При выпаривании воды масса вещества не меняется, если оно нелетучее. Пример: 20 г соли + 180 г воды → 200 г раствора; ω = 10%"}, {"t": "Какой пример соответствует теме «Растворы и массовая доля»?", "o": ["Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "20 г соли + 180 г воды → 200 г раствора; ω = 10%", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶"], "a": 2, "ex": "20 г соли + 180 г воды → 200 г раствора; ω = 10%"}]}, {"id": "qe27_31", "s": "chem", "title": "Стехиометрия, выход и примеси", "q": [{"t": "Теоретически 20 г продукта, выход 80%. Масса?", "o": ["25 г", "16 г", "20 г", "4 г"], "a": 1, "ex": "Переведи массы в моли, найди ограничивающий реагент по коэффициентам, вычисли теоретический выход, затем учти фактический выход и чистоту сырья."}, {"t": "Теоретический выход 50 г, фактический 40 г. Каков выход?", "o": ["20%", "90%", "80%", "125%"], "a": 2, "ex": "Сначала вычисли количество вещества каждого реагента и раздели на его коэффициент. Минимальное отношение определяет ограничивающий реагент. Массу чистого вещества находят умножением массы образца на долю чистоты. Пример: 100 г сырья с 80% CaCO₃ содержит 80 г CaCO₃ = 0,8 моль."}, {"t": "Какой пример соответствует теме «Стехиометрия, выход и примеси»?", "o": ["H–O–H: угловая молекула; CH₄: тетраэдр", "100 г сырья с 80% CaCO₃ содержит 80 г CaCO₃ = 0,8 моль.", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный"], "a": 1, "ex": "100 г сырья с 80% CaCO₃ содержит 80 г CaCO₃ = 0,8 моль."}]}, {"id": "qe27_32", "s": "chem", "title": "Термохимия", "q": [{"t": "При сгорании 1 моль выделяется 400 кДж. Сколько при 0,5 моль?", "o": ["400 кДж", "100 кДж", "800 кДж", "200 кДж"], "a": 3, "ex": "Тепловой эффект пропорционален количеству прореагировавшего вещества. Экзотермический процесс выделяет тепло; эндотермический поглощает."}, {"t": "Сколько теплоты выделится при сгорании 2 моль C при указанном ΔH?", "o": ["0 кДж", "788 кДж", "394 кДж", "197 кДж"], "a": 1, "ex": "В термохимическом уравнении теплота относится к указанным коэффициентам. При обращении реакции знак ΔH меняется. При умножении коэффициентов на число тепловой эффект умножается на него. Пример: C + O₂ → CO₂; ΔH = −394 кДж/моль"}, {"t": "Какой пример соответствует теме «Термохимия»?", "o": ["C + O₂ → CO₂; ΔH = −394 кДж/моль", "Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр"], "a": 0, "ex": "C + O₂ → CO₂; ΔH = −394 кДж/моль"}]}, {"id": "qe27_33", "s": "chem", "title": "Вывод молекулярной формулы", "q": [{"t": "Простейшая формула CH₂O, M=60 г/моль. Молекулярная формула?", "o": ["CH₂O", "C₃H₆O₃", "C₂H₂O", "C₂H₄O₂"], "a": 3, "ex": "По продуктам сгорания найди количество C и H, кислород — по разности масс. Раздели количества атомов на минимальное, затем учти молярную массу."}, {"t": "Простейшая формула CH₂, M = 42. Молекулярная формула?", "o": ["C₃H₆", "C₂H₄", "CH₂", "C₄H₈"], "a": 0, "ex": "Эмпирическая формула показывает простейшее соотношение атомов, молекулярная — действительное. Если известна плотность пара по H₂, M = 2D. Умножь эмпирические индексы на отношение молярных масс. Пример: CH₂O: M = 30; при M = 180 формула C₆H₁₂O₆."}, {"t": "Какой пример соответствует теме «Вывод молекулярной формулы»?", "o": ["Fe: [Ar] 3d⁶ 4s²; Fe²⁺: [Ar] 3d⁶", "Na₂O — основной; Al₂O₃ — амфотерный; SO₃ — кислотный", "H–O–H: угловая молекула; CH₄: тетраэдр", "CH₂O: M = 30; при M = 180 формула C₆H₁₂O₆."], "a": 3, "ex": "CH₂O: M = 30; при M = 180 формула C₆H₁₂O₆."}]}, {"id": "qe27_34", "s": "bio", "title": "Биология и методы исследования", "q": [{"t": "Какой метод предполагает изменение исследуемого фактора?", "o": ["Классификация", "Эксперимент", "Описание", "Наблюдение"], "a": 1, "ex": "Биология изучает живые системы. Наблюдение не предполагает вмешательства, эксперимент проверяет гипотезу при контролируемых условиях. Контрольная группа нужна для сравнения."}, {"t": "Что является зависимой переменной в таком опыте?", "o": ["Освещённость", "Объём полива", "Тип почвы", "Прирост растений"], "a": 3, "ex": "Независимая переменная изменяется исследователем, зависимая измеряется. Остальные условия желательно держать постоянными. Повторности уменьшают влияние случайных отклонений; корреляция сама по себе не доказывает причинность. Пример: Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."}, {"t": "Какой пример соответствует теме «Биология и методы исследования»?", "o": ["Гипертонический раствор → выход воды из клетки.", "Световая фаза → АТФ и НАДФН → цикл Кальвина.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Крахмал — запас у растений; гликоген — у животных и грибов."], "a": 2, "ex": "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."}]}, {"id": "qe27_35", "s": "bio", "title": "Уровни и свойства живого", "q": [{"t": "На каком уровне действует элементарная эволюция?", "o": ["Клеточном", "Популяционно-видовом", "Организменном", "Молекулярном"], "a": 1, "ex": "Выделяют молекулярный, клеточный, организменный, популяционно-видовой, экосистемный и биосферный уровни. Живым системам свойственны обмен, саморегуляция, наследственность и изменчивость."}, {"t": "На каком уровне происходит изменение частот аллелей?", "o": ["Организменном", "Тканевом", "Популяционно-видовом", "Молекулярном"], "a": 2, "ex": "На молекулярном уровне рассматривают биополимеры, на клеточном — процессы клетки, на организменном — системы органов. Популяция является единицей микроэволюции. Экосистема включает сообщество и неживую среду. Пример: Лесные организмы + почва + климат = экосистема."}, {"t": "Какой пример соответствует теме «Уровни и свойства живого»?", "o": ["Матричная ДНК 3′–ТАЦ–5′ → иРНК 5′–АУГ–3′.", "Лесные организмы + почва + климат = экосистема.", "Гипертонический раствор → выход воды из клетки.", "Световая фаза → АТФ и НАДФН → цикл Кальвина."], "a": 1, "ex": "Лесные организмы + почва + климат = экосистема."}]}, {"id": "qe27_36", "s": "bio", "title": "Клеточная теория", "q": [{"t": "Как возникают новые клетки?", "o": ["Самозарождением", "Из внеклеточного вещества", "Делением исходных клеток", "Из вирусов"], "a": 2, "ex": "Клетка — структурная и функциональная единица клеточных организмов; новые клетки возникают из предшествующих клеток. Клетки сходны по основным химическим процессам."}, {"t": "Кто сформулировал принцип «каждая клетка из клетки»?", "o": ["Павлов", "Вирхов", "Мендель", "Дарвин"], "a": 1, "ex": "Клеточная теория связана с работами Шлейдена и Шванна; Вирхов сформулировал принцип происхождения клетки из клетки. Вирусы не имеют клеточного строения. Клетки могут сильно различаться по форме и специализации. Пример: Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."}, {"t": "Какой пример соответствует теме «Клеточная теория»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Световая фаза → АТФ и НАДФН → цикл Кальвина.", "Матричная ДНК 3′–ТАЦ–5′ → иРНК 5′–АУГ–3′.", "2n2c → 2n4c → n2c → n1c."], "a": 0, "ex": "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."}]}, {"id": "qe27_37", "s": "bio", "title": "Биохимия клетки", "q": [{"t": "Мономер белка?", "o": ["Нуклеотид", "Глицерин", "Аминокислота", "Глюкоза"], "a": 2, "ex": "Вода — растворитель и среда реакций; белки состоят из аминокислот, нуклеиновые кислоты — из нуклеотидов; липиды формируют мембраны; углеводы запасают энергию."}, {"t": "Мономеры белка?", "o": ["Аминокислоты", "Нуклеотиды", "Моносахариды", "Жирные кислоты"], "a": 0, "ex": "Белки имеют первичную, вторичную, третичную и иногда четвертичную структуру. Ферменты снижают энергию активации, их активность зависит от pH и температуры. Фосфолипиды амфифильны. АТФ служит кратковременным переносчиком энергии. Пример: Крахмал — запас у растений; гликоген — у животных и грибов."}, {"t": "Какой пример соответствует теме «Биохимия клетки»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Матричная ДНК 3′–ТАЦ–5′ → иРНК 5′–АУГ–3′.", "2n2c → 2n4c → n2c → n1c.", "Крахмал — запас у растений; гликоген — у животных и грибов."], "a": 3, "ex": "Крахмал — запас у растений; гликоген — у животных и грибов."}]}, {"id": "qe27_38", "s": "bio", "title": "Мембраны и органоиды", "q": [{"t": "Какой органоид немембранный?", "o": ["Лизосома", "Хлоропласт", "Митохондрия", "Рибосома"], "a": 3, "ex": "Мембрана регулирует транспорт; рибосомы синтезируют белок, митохондрии обеспечивают аэробное дыхание, аппарат Гольджи сортирует продукты. Осмос — движение воды через полупроницаемую мембрану."}, {"t": "Какой процесс требует энергии для переноса против градиента?", "o": ["Осмос", "Простая диффузия", "Облегчённая диффузия", "Активный транспорт"], "a": 3, "ex": "Пассивный транспорт идёт по градиенту без затрат энергии; активный — против градиента с затратами энергии. Эндоцитоз переносит крупные частицы. Лизосомы содержат гидролазы, шероховатая ЭПС несёт рибосомы. Пример: Гипертонический раствор → выход воды из клетки."}, {"t": "Какой пример соответствует теме «Мембраны и органоиды»?", "o": ["Лесные организмы + почва + климат = экосистема.", "2n2c → 2n4c → n2c → n1c.", "Гипертонический раствор → выход воды из клетки.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "Гипертонический раствор → выход воды из клетки."}]}, {"id": "qe27_39", "s": "bio", "title": "Метаболизм и фотосинтез", "q": [{"t": "Где идёт цикл Кальвина?", "o": ["Ядро", "Строма хлоропласта", "Матрикс митохондрии", "Цитоплазма"], "a": 1, "ex": "Катаболизм высвобождает энергию, анаболизм расходует её. При фотосинтезе световая фаза создаёт АТФ и НАДФН, цикл Кальвина фиксирует CO₂. Хемосинтез использует энергию окисления неорганических веществ."}, {"t": "Где у эукариот находится дыхательная цепь?", "o": ["На рибосомах", "В аппарате Гольджи", "На внутренней мембране митохондрий", "В ядре"], "a": 2, "ex": "Гликолиз даёт чистый выход 2 АТФ и две молекулы пирувата. В аэробном дыхании цикл Кребса идёт в матриксе, дыхательная цепь — на внутренней мембране митохондрий. При фотосинтезе кислород выделяется из воды. Пример: Световая фаза → АТФ и НАДФН → цикл Кальвина."}, {"t": "Какой пример соответствует теме «Метаболизм и фотосинтез»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Световая фаза → АТФ и НАДФН → цикл Кальвина.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "Световая фаза → АТФ и НАДФН → цикл Кальвина."}]}, {"id": "qe27_40", "s": "bio", "title": "Генетическая информация", "q": [{"t": "Как называется синтез РНК на ДНК?", "o": ["Транскрипция", "Репликация", "Конъюгация", "Трансляция"], "a": 0, "ex": "Репликация удваивает ДНК; транскрипция создаёт РНК; трансляция — полипептид. Генетический код триплетен и вырожден."}, {"t": "Какой процесс удаляет интроны из пре-иРНК?", "o": ["Гликолиз", "Сплайсинг", "Репликация", "Трансляция"], "a": 1, "ex": "ДНК синтезируется в направлении 5′→3′, матричная цепь читается 3′→5′. Кодон и антикодон комплементарны и антипараллельны. Стоп-кодоны не кодируют аминокислоту. У эукариот первичная РНК может подвергаться сплайсингу. Пример: Матричная ДНК 3′–ТАЦ–5′ → иРНК 5′–АУГ–3′."}, {"t": "Какой пример соответствует теме «Генетическая информация»?", "o": ["Матричная ДНК 3′–ТАЦ–5′ → иРНК 5′–АУГ–3′.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "Матричная ДНК 3′–ТАЦ–5′ → иРНК 5′–АУГ–3′."}]}, {"id": "qe27_41", "s": "bio", "title": "Клеточный цикл, митоз, мейоз", "q": [{"t": "Что расходится в анафазе I мейоза?", "o": ["Сестринские хроматиды", "Гомологичные хромосомы", "Рибосомы", "Нуклеотиды"], "a": 1, "ex": "В S-фазе удваивается ДНК. Митоз сохраняет число хромосом; мейоз I разделяет гомологи, мейоз II — сестринские хроматиды. Кроссинговер происходит в профазе I."}, {"t": "Набор после мейоза I в каждой клетке?", "o": ["n2c", "2n2c", "n1c", "2n4c"], "a": 0, "ex": "В G₁ диплоидная клетка имеет 2n2c, после S — 2n4c. В анафазе митоза до цитокинеза в одной клетке 4n4c. После первого деления мейоза набор n2c, после второго n1c. Считай хромосомы по центромерам. Пример: 2n2c → 2n4c → n2c → n1c."}, {"t": "Какой пример соответствует теме «Клеточный цикл, митоз, мейоз»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "2n2c → 2n4c → n2c → n1c."], "a": 3, "ex": "2n2c → 2n4c → n2c → n1c."}]}, {"id": "qe27_42", "s": "bio", "title": "Вирусы", "q": [{"t": "Какой структуры нет у вирусов?", "o": ["Геном", "Рибосомы", "Капсид", "Белки"], "a": 1, "ex": "Вирус содержит генетический материал и белковый капсид, иногда липидную оболочку. Размножение зависит от клетки хозяина."}, {"t": "Какого органоида нет у вирусов?", "o": ["Капсида", "Генетического материала", "Белков оболочки", "Рибосом"], "a": 3, "ex": "Вирусы содержат ДНК или РНК и не имеют собственных рибосом. Бактериофаги заражают бактерии. При лизогенном цикле генетический материал фага может сохраняться в клетке без немедленного разрушения. Пример: Фаг: прикрепление → введение генома → образование новых частиц."}, {"t": "Какой пример соответствует теме «Вирусы»?", "o": ["Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Фаг: прикрепление → введение генома → образование новых частиц.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "Фаг: прикрепление → введение генома → образование новых частиц."}]}, {"id": "qe27_43", "s": "bio", "title": "Ткани и организация организмов", "q": [{"t": "Какая ткань обеспечивает рост растения?", "o": ["Механическая", "Покровная", "Проводящая", "Образовательная"], "a": 3, "ex": "У многоклеточных клетки специализируются и образуют ткани, органы и системы. У растений выделяют образовательные, покровные, основные, проводящие и механические ткани."}, {"t": "Какая ткань образует новые клетки при росте растений?", "o": ["Механическая", "Проводящая", "Образовательная", "Покровная"], "a": 2, "ex": "Меристема обеспечивает рост; покровная ткань защищает; ксилема переносит воду и минералы, флоэма — органические вещества. У животных выделяют эпителиальные, соединительные, мышечные и нервные ткани. Пример: Камбий — боковая меристема, обеспечивает рост в толщину."}, {"t": "Какой пример соответствует теме «Ткани и организация организмов»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Камбий — боковая меристема, обеспечивает рост в толщину.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "Камбий — боковая меристема, обеспечивает рост в толщину."}]}, {"id": "qe27_44", "s": "bio", "title": "Размножение и онтогенез", "q": [{"t": "Когда возникают зародышевые листки?", "o": ["Дробление", "Овуляция", "Оплодотворение", "Гаструляция"], "a": 3, "ex": "Бесполое размножение не требует слияния гамет; половое создаёт новые комбинации аллелей. Эмбриогенез включает дробление, гаструляцию и органогенез."}, {"t": "Из какого листка развивается нервная система?", "o": ["Трофобласт", "Эктодерма", "Мезодерма", "Энтодерма"], "a": 1, "ex": "При митотическом бесполом размножении потомки обычно генетически сходны с родителем. При половом размножении рекомбинация повышает разнообразие. В эмбриогенезе из зародышевых листков формируются ткани и органы. Пример: Эктодерма → нервная система; энтодерма → эпителий кишечника."}, {"t": "Какой пример соответствует теме «Размножение и онтогенез»?", "o": ["Эктодерма → нервная система; энтодерма → эпителий кишечника.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "Эктодерма → нервная система; энтодерма → эпителий кишечника."}]}, {"id": "qe27_45", "s": "bio", "title": "Жизненные циклы растений", "q": [{"t": "Какое поколение доминирует у мхов?", "o": ["Спорофит", "Гаметофит", "Зигота", "Спора"], "a": 1, "ex": "Гаметофит образует гаметы митозом, спорофит — споры мейозом. У мхов преобладает гаметофит, у сосудистых растений — спорофит."}, {"t": "Как образуются гаметы у гаплоидного гаметофита?", "o": ["Митозом", "Мейозом", "Оплодотворением", "Конъюгацией"], "a": 0, "ex": "У мхов зелёное листостебельное растение — гаметофит; коробочка на ножке — спорофит. У папоротника взрослое растение — спорофит, заросток — гаметофит. У семенных гаметофиты сильно редуцированы. Пример: Спорофит 2n → мейоз → споры n → гаметофит n."}, {"t": "Какой пример соответствует теме «Жизненные циклы растений»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Спорофит 2n → мейоз → споры n → гаметофит n."], "a": 3, "ex": "Спорофит 2n → мейоз → споры n → гаметофит n."}]}, {"id": "qe27_46", "s": "bio", "title": "Менделевская генетика", "q": [{"t": "Доля aa при Aa × Aa?", "o": ["25%", "100%", "50%", "75%"], "a": 0, "ex": "При полном доминировании Aa × Aa даёт 3:1 по фенотипу. Независимое наследование двух несцепленных генов даёт 9:3:3:1. Анализирующее скрещивание проводят с рецессивной гомозиготой."}, {"t": "Сколько типов гамет образует AaBb при независимом наследовании?", "o": ["2", "8", "1", "4"], "a": 3, "ex": "При неполном доминировании фенотипы F₂ распределяются 1:2:1. При кодоминировании оба аллеля проявляются, например группа AB. Независимое наследование предполагает отсутствие значимого сцепления. Пример: AaBb образует гаметы AB, Ab, aB, ab при независимом наследовании."}, {"t": "Какой пример соответствует теме «Менделевская генетика»?", "o": ["Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "AaBb образует гаметы AB, Ab, aB, ab при независимом наследовании.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "AaBb образует гаметы AB, Ab, aB, ab при независимом наследовании."}]}, {"id": "qe27_47", "s": "bio", "title": "Сцепление и хромосомная теория", "q": [{"t": "Что нарушает полное сцепление?", "o": ["Митоз", "Диссоциация", "Трансляция", "Кроссинговер"], "a": 3, "ex": "Гены одной хромосомы образуют группу сцепления, кроссинговер создаёт рекомбинанты. Частота рекомбинации позволяет оценить расстояние между генами. X-сцепленные признаки имеют особые схемы наследования."}, {"t": "Какая доля каждого рекомбинантного типа при 12% рекомбинации?", "o": ["44%", "88%", "6%", "12%"], "a": 2, "ex": "При полном сцеплении дигетерозигота AB/ab образует AB и ab. При неполном сцеплении доля рекомбинантов равна частоте кроссинговера между локусами в простых задачах. Сын получает X-хромосому от матери. Пример: При 20% рекомбинации: AB и ab по 40%; Ab и aB по 10%."}, {"t": "Какой пример соответствует теме «Сцепление и хромосомная теория»?", "o": ["Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "При 20% рекомбинации: AB и ab по 40%; Ab и aB по 10%.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема."], "a": 1, "ex": "При 20% рекомбинации: AB и ab по 40%; Ab и aB по 10%."}]}, {"id": "qe27_48", "s": "bio", "title": "Изменчивость", "q": [{"t": "К какому типу относится изменение числа хромосом?", "o": ["Комбинативная", "Генная", "Геномная", "Модификационная"], "a": 2, "ex": "Модификации обычно не меняют генотип; комбинативная изменчивость перераспределяет аллели; мутации меняют наследственный материал. Различают генные, хромосомные и геномные мутации."}, {"t": "Полиплоидия относится к каким мутациям?", "o": ["Модификациям", "Геномным", "Генным", "Хромосомным структурным"], "a": 1, "ex": "Модификационная изменчивость ограничена нормой реакции. Генные мутации меняют последовательность ДНК, хромосомные — структуру хромосомы, геномные — число хромосом. Соматические мутации обычно не передаются потомкам при половом размножении. Пример: Делеция участка хромосомы — хромосомная мутация."}, {"t": "Какой пример соответствует теме «Изменчивость»?", "o": ["Делеция участка хромосомы — хромосомная мутация.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки)."], "a": 0, "ex": "Делеция участка хромосомы — хромосомная мутация."}]}, {"id": "qe27_49", "s": "bio", "title": "Генетика человека", "q": [{"t": "Какой метод выявляет трисомию?", "o": ["Гибридологический", "Генеалогический", "Цитогенетический", "Близнецовый"], "a": 2, "ex": "Родословные помогают определить тип наследования, близнецовый метод — вклад среды и наследственности, цитогенетический — особенности хромосом, биохимический — нарушения обмена."}, {"t": "Какой метод изучает наследование по родословной?", "o": ["Генеалогический", "Близнецовый", "Цитогенетический", "Биохимический"], "a": 0, "ex": "Аутосомно-доминантный признак обычно встречается в последовательных поколениях; рецессивный может появиться у детей здоровых носителей. При X-сцепленном наследовании отец не передаёт свой X сыну. Для анализа нужны сведения о нескольких поколениях. Пример: Aa × Aa: вероятность aa = 1/4."}, {"t": "Какой пример соответствует теме «Генетика человека»?", "o": ["Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив.", "Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Aa × Aa: вероятность aa = 1/4."], "a": 3, "ex": "Aa × Aa: вероятность aa = 1/4."}]}, {"id": "qe27_50", "s": "bio", "title": "Селекция и биотехнология", "q": [{"t": "Как называется увеличение числа наборов хромосом?", "o": ["Трансляция", "Инбридинг", "Гетерозис", "Полиплоидия"], "a": 3, "ex": "Селекция использует отбор, гибридизацию, мутагенез и полиплоидию. Биотехнология применяет живые системы для получения продуктов; генная инженерия меняет генетический материал."}, {"t": "Что увеличивает гомозиготность?", "o": ["Аутбридинг", "Кроссинговер сам по себе", "Модификация", "Инбридинг"], "a": 3, "ex": "Массовый отбор оценивает фенотипы группы, индивидуальный — отдельные организмы и потомство. Инбридинг повышает гомозиготность, аутбридинг может давать гетерозис. Культура тканей позволяет размножать растения клонально. Пример: Гетерозис — повышенная жизнеспособность или продуктивность гибридов первого поколения."}, {"t": "Какой пример соответствует теме «Селекция и биотехнология»?", "o": ["Лесные организмы + почва + климат = экосистема.", "Бактериальная клетка и нейрон имеют мембрану, генетический материал и рибосомы (у нейрона — в теле клетки).", "Гетерозис — повышенная жизнеспособность или продуктивность гибридов первого поколения.", "Опыт с освещением: меняем свет, измеряем прирост растений, сохраняем одинаковый полив."], "a": 2, "ex": "Гетерозис — повышенная жизнеспособность или продуктивность гибридов первого поколения."}]}, {"id": "qe27_51", "s": "bio", "title": "Систематика", "q": [{"t": "Какой таксон выше рода?", "o": ["Семейство", "Популяция", "Вид", "Особь"], "a": 0, "ex": "Иерархия таксонов отражает классификацию и эволюционное родство. Бинарное название вида содержит родовое и видовое названия."}, {"t": "Какой таксон непосредственно выше рода в стандартной иерархии?", "o": ["Класс", "Царство", "Семейство", "Вид"], "a": 2, "ex": "Таксоны растений обычно испо
